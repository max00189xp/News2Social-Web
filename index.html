st_attempt_status": null}}], "drafts": []}, {"id": "n2s-38b9190ec38f47ae12fd", "title": "討論牆 | 別補過頭！醫推「保養攝護腺」3飲食 預防肥大、改善排尿障礙 - LINE TODAY", "date": "2026-10-26", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "討論牆 | 別補過頭！醫推「保養攝護腺」3飲食 預防肥大、改善排尿障礙 - LINE TODAY", "publisher": "LINE TODAY", "published_at": "2026-10-25T10:42:43Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE1KLVBDU1ktem91OFdWYmdtX2J6Y3lGZDB1VFpqVE55MkxGcVRUZUgzVnFRdFFBUFpySW1Nay1reTdDcy1mU2F5ZzNzNk9abkFCS21MLU8tbUxUd1dFZnBnbWF4SUI?oc=5", "retrieval": {"status": "tool_policy_blocked", "method": "none", "checked_at": "2026-10-28T02:21:28.410013Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-8ba53079934bfe339ae2", "title": "Purulent cardiac tamponade associated with necrotic mediastinal lymphadenopathy: Multimodality imaging of a presumed mediastinal-pericardial pathway.", "date": "2026-10-25", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Purulent cardiac tamponade associated with necrotic mediastinal lymphadenopathy: Multimodality imaging of a presumed mediastinal-pericardial pathway.", "publisher": "Radiology case reports", "published_at": "2026-10-05T00:00:00Z", "date_precision": null, "summary": "Purulent pericarditis is an uncommon but potentially fatal condition that may rapidly progress to cardiac tamponade. Contiguous spread from adjacent thoracic disease is a recognized mechanism; however, imaging documentation of a presumed mediastinal-pericardial pathway in association with necrotic mediastinal lymphadenopathy remains uncommon. We describe the case of a 72-year-old man with recently diagnosed low-grade prostate adenocarcinoma and a concomitant radiologically suspected primary right upper lobe lung malignancy. Baseline FDG PET/CT performed on 19 March 2026 demonstrated intensely hypermetabolic right upper lobe pulmonary lesions and FDG-avid mediastinal lymphadenopathy, including a supracarinal nodal station with central photopenia and corresponding central hypoattenuation, suggesting pre-existing necrotic change. On 11 May 2026, the patient presented with progressive dyspnea, hemodynamic compromise, and echocardiographic evidence of cardiac tamponade. Urgent subxiphoid pericardiocentesis yielded grossly purulent material. Cytology showed abundant neutrophilic inflammatory material without evidence of malignant cells. Gram stain, aerobic and anaerobic bacterial cultures, blood cultures, fungal cultures, and mycobacterial testing did not identify a causative pathogen. Contrast-enhanced chest CT performed on 13 May 2026 because of rapid pericardial fluid re-accumulation demonstrated a right lower paratracheal/anterior supracarinal nodal conglomerate with more extensive liquefactive necrosis, superior vena cava infiltration, and close apparent contiguity with the superior pericardial recess. Associated circumferential pericardial effusion, pericardial thickening, and pericardial enhancement were consistent with active pericarditis. This case highlights the complementary role of FDG PET/CT and contrast-enhanced CT in suggesting a presumed mediastinal-pericardial route in a patient with recurrent purulent pericardial effusion and necrotic mediastinal lymphadenopathy.", "access_scope": "abstract", "pmid": "42890963", "doi": "10.1016/j.radcr.2026.09.038", "url": "https://pubmed.ncbi.nlm.nih.gov/42890963/"}], "drafts": [], "editorial": {"title": "走幾步就喘得不對勁，別只當作最近太累", "text": "晚飯後，阿成原本想陪太太走到巷口買水果，才走一小段路，就停下來扶著牆。太太問他怎麼了，他還想笑著帶過：「可能最近比較累，休息一下就好。」\n\n可是，這幾天他的呼吸越來越吃力，連熟悉的路都走得很辛苦。太太沒有再催他繼續走，而是陪他尋求醫療協助。\n\n【喘是身體的訊號，原因需要檢查】\n\n呼吸困難可能有許多原因，不能只憑感覺判斷。有一種較少見、卻需要及時處理的狀況，是心臟外面的心包膜出現大量積液，壓迫到心臟，讓心臟無法正常舒張與充血，稱為心包填塞。\n\n可以把心臟想成需要空間活動的幫浦。外側壓力太大時，裡面的運作就可能受影響；但不是所有喘、所有心包積液都代表已經發生這種狀況。\n\n一篇病例報告描述，一名病人在呼吸困難與循環不穩時，檢查發現化膿性心包積液及心包填塞，接受緊急引流。影像讓醫療團隊懷疑，胸腔淋巴結病變與心包之間可能存在感染擴散路徑。\n\n這只是單一病例，報告也未找到確定的致病微生物，影像上的推測不能當成已證實的傳播機制。病人同時有攝護腺癌診斷，也不能因此推論攝護腺癌會造成這種感染。\n\n【先處理危急症狀，再釐清原因】\n\n如果突然嚴重喘不過氣、胸痛、昏厥，或整個人明顯不對勁，應立即尋求急救協助，不要自己勉強開車，也不要等下次門診才提起。\n\n若是逐漸加重、已影響日常活動的呼吸不適，也值得及早評估。就診時可以說清楚何時開始、是否持續惡化，以及目前疾病與用藥，讓醫療團隊判斷需要哪些檢查。\n\n這篇病例真正帶來的提醒，是別用一句「年紀大了」把變化帶過。陪家人注意和平常不同的狀況，必要時及時就醫，比對照新聞猜測自己得了哪種罕見疾病，更能幫上忙。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依單一病例報告摘要改寫；感染路徑為推測，屬一般心胸疾病題材。", "character_count": 652, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42890963/"}, {"title": "NHS 呼吸困難就醫提醒", "url": "https://www.nhs.uk/symptoms/shortness-of-breath/"}]}}, {"id": "n2s-5b2eeb7d2ab36aa1dfa2", "title": "A Comprehensive Beam-Level Assessment of Pencil-Beam Scanning Migration and Utilization at a Multi-System Proton Therapy Center.", "date": "2026-10-25", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "A Comprehensive Beam-Level Assessment of Pencil-Beam Scanning Migration and Utilization at a Multi-System Proton Therapy Center.", "publisher": "International journal of particle therapy", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "PURPOSE: To provide a beam-level comparison of pencil-beam scanning (PBS) proton therapy at a high-volume center operating both the ProteusPLUS (P-PLUS) and ProteusONE (P-ONE) platforms and to evaluate how system capabilities influenced room utilization during a multi-year transition to PBS.\nMETHODS AND MATERIALS: Log files were analyzed for three rooms: P-PLUS Gantry Room 2 (GTR2; 2018-2024), P-PLUS Gantry Room 1 (GTR1; mid-2023-2024), and P-ONE Compact Gantry Room (CGTR; 2020-2024). A script was written to extract beam parameters while clinical and demographic information were obtained from the MOSAIQ database. Data streams were merged, then grouped and analyzed by site, age, and temporal factors.\nRESULTS: The final dataset included 120,367 beams for the P-PLUS and 95,587 for the P-ONE. During an 18-month comparative period, mean throughput was 27.4 ± 5.4 patients/day (GTR2), 22.9 ± 5.1 (GTR1), and 27.0 ± 4.6 (CGTR), with mean session times of 28.2 ± 2.5, 25.6 ± 1.7, and 26.9 ± 2.4 minutes, respectively. Case allocation reflected platform/nozzle differences: GTR2 primarily treated prostate, breast, and thorax/abdomen targets, while GTR1 and CGTR focused on prostate, head-and-neck, brain, and CNS cases. CGTR treated more pediatric patients (25.2% vs 7.1% in GTR2 and 5.8% in GTR1) and cases involving anesthesia. Maximum cyclotron energy was used more on GTR2 compared to CGTR (7.5% vs 0.4%), while range-shifter use was similar (71.1% vs 67.0%); couch flips occurred in 77% of P-ONE treatments.\nCONCLUSIONS: Expanding PBS capacity substantially shifted room utilization and case mix, driven mainly by differences in spot and field size, and secondarily by imaging, layer-switching, and pediatric-oriented room features. The P-ONE's smaller field size did not materially constrain prostate treatment with involved lymph nodes, frequent couch flips did not inhibit high operational capacity, and the P-ONE's lower minimum energy reduced range-shifter reliance and the need for maximum cyclotron energy. This real-world analysis provides guidance for case selection, workflow optimization, and future proton system design.", "access_scope": "abstract", "pmid": "42904178", "doi": "10.1016/j.ijpt.2026.101969", "url": "https://pubmed.ncbi.nlm.nih.gov/42904178/"}], "drafts": [], "editorial": {"title": "放療機器規格看不懂，該怎麼替家人問對問題？", "text": "媽媽開始討論癌症治療後，阿庭的手機裡存滿不同設備的介紹。這家強調機型，那家介紹掃描速度；他越看越焦慮，總覺得沒有選到最厲害的機器，就是沒有替媽媽盡力。\n\n媽媽卻只問了一句：「這些差別，跟我的治療到底有什麼關係？」阿庭才發現，自己記住好多規格，卻還沒弄清楚治療目標。\n\n【機器的能力，和病人的治療結果是不同問題】\n\n質子治療是一種放射治療。研究人員除了關心腫瘤照射，也會研究設備如何安排病人、調整治療床、完成定位與提供不同部位所需的照射。\n\n可以把治療室想成需要精準協作的工作站。設備設計會影響能做哪些安排、流程怎麼進行，但運作快不快，不能直接換算成癌症控制得好不好。\n\n一篇研究分析同一醫療中心不同質子治療系統的照射紀錄，觀察設備特性與治療室使用情況。結果顯示，照射範圍、影像與其他設計會影響個案分配及工作流程。\n\n這是一項設備使用與流程分析，不是隨機分派病人、比較存活或副作用的試驗。因此，不能用它替某個機型排名，也不能據此宣稱質子一定比其他放療方式更適合每個人。\n\n【把問題從「哪台最好」改成「我需要什麼」】\n\n討論治療時，可以先問醫療團隊：目前希望達成什麼目標？為什麼建議這種方式？對這個腫瘤位置，有哪些需要保護的正常組織？還有哪些可行選項？\n\n也要把家人的實際生活放進來，包括能否配合定位、往返交通與照護安排。這些問題都值得事先談清楚，並請團隊用你聽得懂的方式說明。\n\n若拿到設備新聞，可以直接帶去問它和自己的療程有沒有關係，不需要自己在網路規格中做醫療判斷。\n\n替家人努力，不必表現在背熟機器名稱。把病情、治療目的和生活需要一起放上討論桌，才能讓科技服務病人，也讓照顧者少一點「一定要選最貴、最新」的壓力。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依設備與照射紀錄分析摘要改寫；非療效比較試驗，屬一般放療題材。", "character_count": 686, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42904178/"}]}}, {"id": "n2s-3fc9f7620a1c10cc185b", "title": "FMOD marks a low-malignancy epithelial state in prostate cancer: an ECM-related prognostic signature with single-cell and functional validation.", "date": "2026-10-25", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "FMOD marks a low-malignancy epithelial state in prostate cancer: an ECM-related prognostic signature with single-cell and functional validation.", "publisher": "Cell adhesion \u0026 migration", "published_at": "2026-10-21T00:00:00Z", "date_precision": null, "summary": "Extracellular matrix (ECM) remodeling promotes prostate cancer progression, while the prognostic value and cellular context of ECM-related genes (ERGs) remain unclear. A 4-gene ERG signature for disease-free interval prediction was built using TCGA-PRAD data, and the hub gene Fibromodulin (FMOD) was validated in an external cohort via scRNA-seq, bulk deconvolution and siRNA knockdown. The signature stratified patient prognosis, and FMOD exerted the strongest protective effect. Despite higher bulk expression in tumor tissues, FMOD predicted better clinical outcomes. FMOD was enriched in a low-chromosomal-instability, low-proliferation epithelial subpopulation with enhanced stromal-immune crosstalk, and FMOD knockdown boosted cancer cell proliferation and colony formation. FMOD identifies a low-malignancy epithelial state linked to favorable prostate cancer prognosis, supporting cell state-resolved validation of ECM-related prognostic biomarkers.", "access_scope": "abstract", "pmid": "42904786", "doi": "10.1080/19336918.2026.2728740", "url": "https://pubmed.ncbi.nlm.nih.gov/42904786/"}], "drafts": [], "editorial": {"title": "看到「預後基因」就緊張？先別讓一個名詞決定你的心情", "text": "阿仁追蹤攝護腺癌時，朋友傳來一篇談「預後基因」的新聞。他越看越不安，開始想：自己是不是也該馬上做這個檢查？如果沒有測，會不會錯過什麼？\n\n隔天回診，他把手機遞給醫師，才發現研究討論的，是還在探索中的分子線索，和自己手上的檢查報告並不是同一件事。\n\n【研究想知道的，是癌細胞有哪些不同面貌】\n\n即使都叫攝護腺癌，不同腫瘤裡的細胞也可能有不同狀態。研究人員會分析基因表現，試著找出和疾病變化相關的訊號，幫助理解哪些細胞比較活躍。\n\n這篇研究關注細胞外基質相關基因，以及名為 FMOD 的分子。可以把細胞外基質想成細胞周圍的支架與環境，它和細胞互動，可能和腫瘤行為有關。\n\n研究結合公開資料、其他病人資料及細胞實驗，觀察到 FMOD 和較低惡性特徵的細胞狀態、較好的臨床結果相關；在細胞實驗中，降低它的表現，也出現細胞增生變化。\n\n但「和較好結果相關」不等於增加這個分子就能治療癌症。這也不是證明某種保健品有效的研究，更不能只靠單一分子決定一個人的治療。\n\n【新研究，可以帶進診間一起解讀】\n\n如果對這類檢查有興趣，可以先問：這個工具是否已用於目前的臨床情境？有沒有在其他人群驗證？檢查結果是否真的會改變自己的追蹤或治療？\n\n同時，別忽略原本已安排的病理、抽血與影像追蹤。研究中的分子訊號，需要和既有資訊一起理解，不能拿來自行取代原有計畫。\n\n看新聞時，也可以留意它是在描述實驗室發現，還是已完成病人治療的比較。兩者都可能重要，但回答的問題不一樣。\n\n阿仁後來把疑問寫在回診筆記裡，沒有急著加做一堆檢查。面對新名詞，不必立刻替自己下結論；先弄懂它離實際照護還有多遠，才能把好奇轉成有用的討論。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依分子預後與細胞研究摘要改寫；非介入治療證據。", "character_count": 667, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42904786/"}]}}, {"id": "n2s-bc376251b6759a69a58f", "title": "一夜4次確診攝護腺肥大醫自救成功年過50沒再夜尿- 健康 - 中時新聞網", "date": "2026-10-25", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "一夜4次確診攝護腺肥大醫自救成功年過50沒再夜尿- 健康 - 中時新聞網", "publisher": "中時新聞網", "published_at": "2026-10-24T02:31:03Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMibkFVX3lxTE5IclB4RnNsV3llbE9OOVV2bVpLQktMcDdRbGNKV1ptdFRDbUpLejNlU2Q5QmNxWDlXYUk4b2MwejhjVldfV2ZBZmJXcThSOGp5ejRVd1JEMG5ZNHl3WDFrYVJMNFZSSTVsOFFWUGNR?oc=5", "retrieval": {"status": "robots_blocked", "method": "none", "checked_at": "2026-10-28T02:21:34.645414Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-b1373234f280151207cc", "title": "男尿不出來 脫褲驚見狼牙棒 菜花竟拖10年 - 鏡週刊Mirror Media", "date": "2026-10-25", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "男尿不出來 脫褲驚見狼牙棒 菜花竟拖10年 - 鏡週刊Mirror Media", "publisher": "鏡週刊Mirror Media", "published_at": "2026-10-23T05:37:00Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiXEFVX3lxTE0xTTJHVkpnZS1XU21Jc3VIc0tLRUFVeXU3bG9jbG8xUEl3T1FZNi1pcnRucXhVdnBlXzcwTE1qa1lpNEdydUkwczhlUHUtbWJ1bDZmWWk0WFFxT0850gFiQVVfeXFMTzN1VUYxMUZocW5yM0w5R0JmODRGaDVCVkstX2JXRXRWSVQtTXYzd2RkLVVhUHRmZThEWEUzU2dzSVVHNUhVcDA2QnlrazN3LVNxa2xUNlJVSzJjM0wyNFFNWWc?oc=5", "retrieval": {"status": "publisher_url_unresolved", "method": "none", "checked_at": "2026-10-28T02:21:33.606705Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-a7c6e3ebc170f6fd2e63", "title": "攝護腺肥大拖多年 60歲男血尿就醫 膀胱塞滿50顆結石 - 世界新聞網", "date": "2026-10-25", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "攝護腺肥大拖多年 60歲男血尿就醫 膀胱塞滿50顆結石 - 世界新聞網", "publisher": "世界新聞網", "published_at": "2026-10-24T06:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.worldjournal.com/wj/amp/story/121238/9825529", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-26T11:47:37.433218Z", "resolved_by": "curated_registry", "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "尿流慢了好久，為什麼還會冒出膀胱結石？", "text": "老吳上廁所越來越久，卻總說：「反正還尿得出來，慢一點沒關係。」出門時，他會先找廁所；夜裡醒來，也習慣不開燈就摸著走。家人看在眼裡，勸他回診，他總想再等一等。\n\n直到有天看到尿色不對，他才開始緊張：原來自己忍了很久的問題，不一定只是生活有點麻煩。\n\n【尿液排不乾淨，可能讓結石有機會形成】\n\n膀胱像暫時存放尿液的容器。如果長期無法順利排空，尿液裡的物質可能逐漸形成結石。攝護腺增大壓迫尿道，是排尿受阻的可能原因之一，但還有其他情況需要評估。\n\n本次補讀的世界新聞網報導，描述一名攝護腺肥大合併多顆膀胱結石的病人。醫療團隊依情況分階段處理結石與阻塞，提醒讀者不應一直忽略排尿變化。\n\n這是一則個案新聞，不代表有夜尿的人都會長結石，也不能把報導中的手術安排當成所有患者都該接受的標準方案。\n\n【處理結石，也要了解為什麼尿排不乾淨】\n\n若出現排尿疼痛、下腹不適、反覆感染或血尿，應讓醫師確認原因。血尿也不一定都是結石或攝護腺造成，不能自己先下結論。\n\n檢查可能包含尿液、影像或其他評估，依實際狀況安排。需要治療時，除了討論結石如何處理，也要問清楚造成排尿不順的原因是否需要一起改善，才能降低問題反覆的機會。\n\n不要因為聽說小結石有時會自行排出，就把所有情況都當成多喝水、等一等即可。尤其突然完全尿不出來，合併下腹脹痛時，應立即就醫，而不是繼續在家用力嘗試。\n\n老吳後來把過去不好意思說的排尿困擾，一項項告訴醫師。他才發現，及早回診不代表一定要接受大手術，而是先知道自己面對什麼。能不能忍，不是衡量問題輕重的唯一標準；生活的變化，也值得被認真對待。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依世界新聞網公開 AMP 正文及 NHS 膀胱結石衛教改寫；個案處置不能直接套用所有患者。", "character_count": 649, "references": [{"title": "世界新聞網原始報導", "url": "https://www.worldjournal.com/wj/amp/story/121238/9825529"}, {"title": "NHS 膀胱結石衛教", "url": "https://www.nhs.uk/conditions/bladder-stones/"}]}}, {"id": "n2s-10695b1dc71b8ca5e178", "title": "怕痛不敢治！男「菜花長滿整根」拖10年　尿道口遭堵慘變狼牙棒尿不出來 - 鏡週刊Mirror Media", "date": "2026-10-25", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "怕痛不敢治！男「菜花長滿整根」拖10年　尿道口遭堵慘變狼牙棒尿不出來 - 鏡週刊Mirror Media", "publisher": "鏡週刊Mirror Media", "published_at": "2026-10-23T07:11:00Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiaEFVX3lxTFBtcW81Z01HMGJJZlphWlZlVE5jTi14X2NPRklNT0dtck52UVVndUpzTVBkMGlzWUkwcDdUOENGdDJXTllrZGI0My00UEtyNV9nTTJoZVhNakVsX1QyVFBrcDc1SnJfVTZZ0gFoQVVfeXFMUG1xbzVnTUcwYklmWmFaVmVUTmNOLXhfY09GSU1PR21yTnZRVWd1SnNNUGQwaXNZSTBwN1Q4Q0Z0MldOWWtkYjQzLTRQS3I1X2dNMmhlWE1qRWxfVDJUUGtwNzVKcl9VNlk?oc=5", "retrieval": {"status": "publisher_url_unresolved", "method": "none", "checked_at": "2026-10-28T02:21:32.559173Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-cb6fc1a788d2c89bc18d", "title": "碳離子放射治療：全球收案研究總覽", "date": "2026-10-24", "status": "pending_review", "warning": "選題待退回：內容偏一般腫瘤；工作紀錄建議退回，尚未變更原審核狀態。", "revision": 1, "sources": [{"title": "Global Landscape of Clinical Studies Open to Enrollment in Carbon Ion Radiotherapy: A PTCOG Review.", "publisher": "International journal of particle therapy", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "BACKGROUND: Radiotherapy with high linear energy transfer (LET) has shown promise for improving cancer outcomes. Carbon ion radiotherapy (CIRT) combines charged-particle dose conformality with enhanced biological effectiveness. However, clinical development remains constrained by limited center availability, modest trial accrual, and few randomized studies. We reviewed the global landscape of CIRT studies open to enrollment to identify current priorities and gaps.\nMETHODS: This Particle Therapy Cooperative Group (PTCOG)-sanctioned project, conducted within the CIRT Guidelines Subcommittee, identified studies through registry review and institutional verification. ClinicalTrials.gov and the Japan Registry of Clinical Trials were searched from December 2025 through February 2026. We included interventional CIRT trials and prospective registries open to new enrollment and excluded studies not open to enrollment, retrospective cohorts, proton-only studies, and preclinical studies.\nRESULTS: Thirty-six studies were identified: 35 interventional trials in 6 countries and 1 North American registry-based comparative-effectiveness study. Japan had the largest share, followed by Germany, China, Italy, Austria, and France. Three centers (SPHIC, QST, and HIT) accounted for 21 of 36 studies. The portfolio included 7 phase I, 23 phase II, 5 phase III, and 1 registry study. Pancreatic cancer and sarcoma-related tumors each accounted for 7 studies; head and neck cancers, 5; prostate and breast cancers, 3 each; glioblastoma, lung cancer, and gynecologic malignancies, 2 each; and mucosal melanoma, mixed solid tumors, kidney cancer, esophageal cancer, and hepatocellular carcinoma, 1 each. Most studies were conducted at a single institution and emphasized feasibility, toxicity, local control, progression-free survival, or overall survival.\nCONCLUSIONS: This expert-verified inventory shows that CIRT studies open to enrollment remain concentrated by center, disease site, and phase. Future progress may depend more on shared outcome definitions, transparent biological dose reporting, and registry-enabled or multicenter comparative designs than on additional isolated single-institution studies.", "access_scope": "abstract", "pmid": "42893060", "doi": "10.1016/j.ijpt.2026.101968", "url": "https://pubmed.ncbi.nlm.nih.gov/42893060/"}], "drafts": [], "editorial": {"title": "看到「新式放療」就想換治療？先把研究看懂再決定", "text": "爸爸確診癌症後，阿豪每天睡前都在查資料。有天看到碳離子治療的消息，他立刻轉給家人：「這個聽起來很厲害，我們是不是應該改用這個？」\n\n家人都想替爸爸找到更好的選擇，卻也擔心，一直追著新技術跑，會不會反而打亂原本的安排。大家真正需要的，是有人說清楚：新聞中的進展，和爸爸的病情有什麼關係。\n\n【治療名稱很新，不等於已回答所有問題】\n\n碳離子治療是一種利用帶電粒子的放射治療。研究團隊會關心它如何把能量送到腫瘤，以及不同病人使用後的效果與風險。\n\n這次收錄的文獻，是整理當時仍開放收案的碳離子相關研究，涵蓋多種癌別，也包含攝護腺癌。它像一張研究地圖，讓人知道目前有哪些方向正在探索。\n\n不過，研究地圖不等於治療排行榜。知道哪些研究正在收人，不能直接推論某種治療已經比標準方式有效，也不能把不同癌別的結果套用到自己身上。\n\n這篇總覽也提到，研究集中在部分中心，能直接比較治療的隨機研究仍有限。這些限制，提醒我們評估新技術時，還需要看病人特徵、比較對象及追蹤結果。\n\n【帶著新聞問醫師，比自己急著換療程更有幫助】\n\n可以先問：這項研究有包含和家人相近的癌別與期別嗎？目前談的是已建立的照護選項，還是臨床試驗？如果參加，會有哪些額外檢查、風險與交通負擔？\n\n也值得討論既有治療的目標、替代方案和等待的影響，不要只因標題寫著「新」就自行中斷原計畫。若考慮研究收案，是否符合條件，仍需由研究與照護團隊確認。\n\n阿豪後來把新聞和問題整理成一張紙，陪爸爸回診。家人想多做一點的心情很自然；把這份心意用在問清楚證據與選項，往往比急著替技術分高下，更能支持眼前的決定。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依研究收案總覽摘要改寫；非療效比較試驗，保留原選題待退回標示。", "character_count": 652, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42893060/"}]}}, {"id": "n2s-c88707022636f3a56cb3", "title": "OAB治療迎新趨勢 新一代口服藥物提供不同用藥選擇 - 健康醫療網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "OAB治療迎新趨勢 新一代口服藥物提供不同用藥選擇 - 健康醫療網", "publisher": "健康醫療網", "published_at": "2026-10-22T02:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.healthnews.com.tw/article/70122", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:10:15.868124Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "出門第一件事就是找廁所？別讓尿意替你安排行程", "text": "電影才演到一半，阿哲又站了起來。\n\n「你不是進場前才去過？」朋友小聲問。他只能尷尬地笑笑，快步往出口走。\n\n最近，他越來越不喜歡出門。吃飯要挑靠近廁所的位置，搭車先問中途有沒有休息站，連散步都只敢走熟悉的路線。\n\n他也試過少喝水，以為膀胱裡沒什麼水，就不會一直想尿。可是，那種突然湧上來、很難等的尿意，還是讓他坐立難安。\n\n【這種「說來就來」的尿意，可能和膀胱過動症有關】\n\n正常情況下，膀胱會先儲存尿液，等到合適的時候再排出。膀胱過動症可以簡單理解成：膀胱的提醒變得太急，尿意一來，就讓人很難延後上廁所。\n\n有些人同時會頻尿、夜裡起床排尿，甚至還沒走到廁所就漏尿。但沒有漏尿，也可能有膀胱過動症。\n\n只是，常跑廁所不等於一定得了這個病。感染、攝護腺相關問題或其他原因，也可能造成類似困擾，需要醫師協助釐清。\n\n【先找出規律，比一味忍耐更有幫助】\n\n可以先記錄自己什麼時候喝水、喝了哪些飲料、何時出現急尿，以及有沒有漏尿。這些生活細節，能幫助醫療人員了解症狀。\n\n如果平常常喝咖啡、濃茶或含咖啡因飲料，可以試著減少，觀察尿意是否有變化。飲水量也需要適當，喝太多或太少，都可能讓問題更難控制。\n\n醫療人員也可能安排膀胱訓練，循序漸進練習調整排尿間隔。這需要依個人狀況進行，並不是每次想尿，都硬撐到受不了。\n\n若生活調整後仍然困擾，還有藥物等治療選項。醫師會考量其他疾病、目前用藥及副作用，和你討論適合的方式，不必自行買藥嘗試。\n\n如果同時有排尿疼痛、血尿或發燒，就應及時就醫，不要只當作膀胱太敏感。\n\n阿哲真正想找回的，其實很簡單：完整看完一場電影，和朋友吃頓飯，不必一直留意出口在哪裡。\n\n如果你也開始因為尿意取消聚會、避開旅行，這份困擾就值得被好好處理。看診時，把生活受到的影響說出來，也是治療很重要的一部分。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依原站衛教及所列官方資料改寫；不取代個別醫療評估。", "character_count": 726, "references": [{"title": "NHS 排尿控制問題的非手術治療", "url": "https://www.nhs.uk/conditions/urinary-incontinence/treatment/"}, {"title": "NHS 飲水與生活調整建議", "url": "https://www.nhs.uk/conditions/urinary-incontinence/10-ways-to-stop-leaks/"}]}}, {"id": "n2s-b0c77b0c3c60d2c0ef73", "title": "攝護腺癌主動監測：MRI 與重複切片（PRIAS）", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Can We Omit Systematic Biopsies in Men with a Positive MRI During Repeat Biopsies for Active Surveillance for Prostate Cancer? Results from the PRIAS Study.", "publisher": "European urology open science", "published_at": "2026-10-13T00:00:00Z", "date_precision": null, "summary": "BACKGROUND AND OBJECTIVE: This study evaluated the added value of systematic biopsies (SBx) in addition to targeted biopsies (TBx) for detecting upgrading during repeat biopsies on active surveillance (AS) using data from the Prostate Cancer Research International Active Surveillance study.\nMETHODS: We analyzed repeat biopsies of men who underwent magnetic resonance imaging (MRI) and SBx at diagnosis, with or without TBx depending on the presence of an MRI lesion, had at least one positive (Prostate Imaging Reporting and Data System 3-5) follow-up MRI, and received both SBx + TBx at subsequent repeat biopsy. Upgrading compared with diagnostic biopsy was assessed for TBx only, SBx only, and both, using three definitions: any upgrading, upgrading to grade group (GG) ≥2 with cribriform growth or intraductal carcinoma (≥GG2+), and upgrading to ≥GG3. Cumulative incidences were calculated using each detection method as competing events. For upgrading ≥GG2+ detected by SBx only, the laterality relative to the MRI lesion was determined.\nKEY FINDINGS AND LIMITATIONS: We analyzed 650 repeat biopsies in 568 patients with a median follow-up of 3.0 yr (interquartile range = 1.8-4.3) for men still on AS. During available follow-up, any upgrading occurred in 238 biopsies (37%), of which 47 (7.2%) were detected by SBx only. Upgrading to ≥GG2+ and ≥GG3 was observed in 100 biopsies (16%) and 78 biopsies (12%), respectively, with SBx alone identifying 19 (3.0%) and 15 (2.3%) of these patients. At 6 yr, the cumulative incidence of ≥GG2+ upgrading was 27% (95% confidence interval [CI] = 21-32%), with 5.4% (95% CI = 2.9-9.1%) for upgrading detected exclusively by SBx. Three of the 19 cases with upgrading to ≥GG2+ detected by SBx only were located contralateral to the MRI lesion (0.5% of all biopsies). Limitations include the retrospective design, which may introduce selection and registration biases.\nCONCLUSIONS AND CLINICAL IMPLICATIONS: In men on AS who underwent diagnostic MRI with SBx (with or without TBx) and a positive follow-up MRI, SBx has limited added value during repeat biopsies, particularly for contralateral sampling, supporting a targeted and perilesional biopsy approach.", "access_scope": "abstract", "pmid": "42909178", "doi": "10.1016/j.euros.2026.09.006", "url": "https://pubmed.ncbi.nlm.nih.gov/42909178/"}], "drafts": [], "editorial": {"title": "攝護腺癌追蹤做了 MRI，為什麼還要討論切片？", "text": "老陳接受攝護腺癌主動監測，每次回診都很準時。最近安排完 MRI，聽到醫師提起可能還要切片，他有點疑惑：「不是已經照過了？是不是代表變嚴重了？」\n\n太太也跟著緊張。兩人最怕的，是每多做一項檢查，就表示病情又往壞的方向走。但檢查的安排，有時是在補足資訊，並不等於已經確定惡化。\n\n【影像和切片，提供的是不同線索】\n\n主動監測不是放著不管，而是依計畫追蹤，評估是否需要改變處理方式。MRI 可以幫忙觀察可疑區域，切片則取得組織，讓病理檢查進一步了解細胞的樣子。\n\n可以把 MRI 想成地圖，幫忙找出要注意的位置；切片像取得現場樣本，補上影像看不到的細節。兩者功能不同，是否需要搭配，要看個人情況。\n\nPRIAS 研究分析特定一群接受主動監測、後續 MRI 有可疑病灶的男性，比較針對病灶取樣與加做系統性取樣能找到哪些病理變化。\n\n研究顯示，系統性取樣的額外價值有限，但不是完全沒有；也因為是回顧性分析，存在選取與登錄偏差。結果不能簡化成「照了 MRI，人人都不用切片」，也不適用於所有攝護腺癌病人。\n\n【把擔心說出來，讓檢查有清楚目的】\n\n下次討論時，可以問：這次切片想確認什麼？MRI 與之前相比有什麼變化？建議的取樣方式是什麼？結果可能如何影響後續追蹤或治療？\n\n如果曾因切片疼痛、出血或感染而害怕，也要把經驗告訴團隊，一起討論風險與安排。不要只因為新聞提到「可以省略」，就自行取消已約好的檢查。\n\n同時，把抽血、影像與病理結果放在一起看，比單看某個數字或一句報告更能理解狀況。\n\n老陳後來在筆記本寫下：「這次檢查會回答什麼問題？」主動參與照護，不是自己扛起所有判斷，而是讓每一步都有人說明，也讓自己的擔心被聽見。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依 PRIAS 回顧性分析摘要改寫；僅適用研究所納入族群，非人人可省略切片。", "character_count": 675, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42909178/"}, {"title": "NHS 攝護腺癌治療與監測", "url": "https://www.nhs.uk/conditions/prostate-cancer/treatment/"}]}}, {"id": "n2s-94e9f401294ab093226c", "title": "3T、1.5T差在哪？磁場不是越強越好 醫揭MRI適用情境 - 健康醫療網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "3T、1.5T差在哪？磁場不是越強越好 醫揭MRI適用情境 - 健康醫療網", "publisher": "健康醫療網", "published_at": "2026-10-22T01:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.healthnews.com.tw/article/70093", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:10:13.280798Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "做 MRI 一定要挑 3T？選檢查不是比手機規格", "text": "小林準備做 MRI，朋友聽到醫院安排的是 1.5T，立刻提醒：「現在不是都有 3T 了？數字比較大，應該比較好吧！」\n\n他原本只是想把檢查做好，這下卻開始懷疑自己是不是選錯。打開手機搜尋後，規格越看越多，心裡反而更沒底。\n\n【磁場強度，是影響影像的其中一個條件】\n\nMRI 利用磁場與無線電波取得身體影像；T 是磁場強度的單位。較強的磁場通常能帶來更多訊號，可用來呈現細節，或在合適條件下調整掃描時間。\n\n但取得好影像，就像拍一張清楚的照片，除了器材，也要考量拍攝對象、設定與過程。檢查部位、身體狀況及能否配合不動，都會影響結果。\n\n原報導中的影像醫學醫師說明，3T 與 1.5T 各有適用情境，並非所有檢查都以 3T 較佳。有些情況需要更多細節，有些則需要考量影像干擾或其他條件。\n\n因此，單靠一個數字，不能判斷檢查一定比較準，也不能推論另一種規格就會漏掉問題。\n\n【事先說清楚身體狀況，比自己挑機器更重要】\n\n如果有心律調節器、人工關節、金屬植入物，或不確定曾接受過哪些植入手術，要主動告知團隊，並提供可取得的資料。能不能做 MRI、在什麼條件下做，需要個別確認，不能只憑「有金屬」或「磁場較弱」自行決定。\n\n若容易害怕狹窄空間、難以久躺，或過去檢查曾很不舒服，也可以提早說明，讓團隊討論如何協助配合。\n\n安排檢查時，不妨問：「這次主要要看什麼？為什麼這個設備與掃描方式適合我？」比起追問哪台最新，這些問題更接近真正的需要。\n\n小林最後把朋友的建議帶回醫院討論，沒有急著換院。檢查的目的，是取得能幫助判斷的資訊；適合自己的安排，需要把身體條件和醫療目的放在一起看。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依原站醫師衛教改寫；MRI 規格須依檢查目的與植入物條件評估。", "character_count": 650, "references": [{"title": "本篇原始來源", "url": "https://www.healthnews.com.tw/article/70093"}]}}, {"id": "n2s-6a7cbbcadcd23c51d50c", "title": "健康網》排尿滴滴答答又頻尿 醫點名男性健檢別漏這3項 - 自由健康網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "健康網》排尿滴滴答答又頻尿 醫點名男性健檢別漏這3項 - 自由健康網", "publisher": "自由健康網", "published_at": "2026-10-21T07:42:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://health.ltn.com.tw/article/breakingnews/5612727", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:10:06.248618Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "健檢項目加越多越安心？先把排尿困擾說清楚", "text": "阿文拿到公司健檢表，看到密密麻麻的加選項目，第一個念頭是：「全部勾一勾，總不會錯吧？」太太卻問他：「你不是最近上廁所很慢？有把這件事跟醫師說嗎？」\n\n他才發現，自己願意花時間比較檢查價格，卻一直沒把每天遇到的困擾說出口。健檢表填得很滿，也不代表每一項都能回答他的問題。\n\n【不同檢查，看的事情不一樣】\n\n尿流速檢查會記錄排尿的速度與型態，幫助了解排尿功能。它可以提供阻塞或膀胱功能方面的線索，但不能只看速度，就自行判斷一定是哪個器官出了問題。\n\nPSA 是和攝護腺相關的抽血指標。數值升高不等於已確診癌症，也可能受到其他攝護腺狀況影響，是否檢查及如何解讀，需要搭配症狀、病史與風險討論。\n\n至於容易疲累、性慾改變等情況，有時會需要評估男性荷爾蒙，但不是只要累就代表睪固酮不足，更不應拿單次數值自行購買補充品或荷爾蒙。\n\n原報導提醒男性留意排尿功能、荷爾蒙與攝護腺健康；實際要做哪些項目，仍需由醫療人員依個別情況安排，而不是人人一律照單全做。\n\n【先準備生活紀錄，再討論檢查】\n\n可以記下排尿變化何時開始，是否尿流變弱、夜裡常起床，或出現排不乾淨的感覺；也把使用的藥物、家族病史及過去檢查結果一起帶去。\n\n問醫師：「這項檢查想找什麼？如果異常，下一步會怎麼做？」理解檢查的用途與限制，才不會拿到一串數字後反而更焦慮。\n\n如果已經有持續症狀，不必等年度健檢才處理；出現血尿、疼痛或突然尿不出來，更需要及時就醫評估。\n\n阿文後來沒有把所有格子勾滿，而是先預約門診。照顧健康可以從一件很實際的事開始：把身體的變化說清楚，讓檢查真正對上自己的需要。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依原站衛教並參照 NHS PSA 說明；非建議所有男性接受相同檢查組合。", "character_count": 646, "references": [{"title": "本篇原始來源", "url": "https://health.ltn.com.tw/article/breakingnews/5612727"}, {"title": "NHS PSA 檢驗說明", "url": "https://www.nhs.uk/tests-and-treatments/psa-test/"}]}}, {"id": "n2s-3d55b5638576a4946e44", "title": "HoLEP 與 Mini-HoLEP：長期追蹤隨機試驗", "date": "2026-10-24", "status": "pending_review", "warning": "原生成稿中的術式中文譯名須由醫療人員核對；保留原稿，尚未核准。", "revision": 1, "sources": [{"title": "HoLEP Versus Mini-HoLEP: A Long-term Follow-up Prospective Randomized Controlled Trial.", "publisher": "European urology open science", "published_at": "2026-10-08T00:00:00Z", "date_precision": null, "summary": "BACKGROUND AND OBJECTIVE: Holmium laser enucleation of the prostate (HoLEP) is increasingly performed with miniaturized instruments, aiming to reduce postoperative urinary incontinence (UI). Evidence for mini-HoLEP (MiLEP) using a 22-Fr resectoscope remains largely retrospective or nonrandomized. We aimed to compare MiLEP with a standard 26 Fr HoLEP in a prospective randomized trial.\nMETHODS: Ninety men were randomized to MiLEP (n = 45) or HoLEP (n = 45). All procedures were performed by one surgeon using a standardized technique. The prespecified primary end point was UI, defined as any reported loss of urine, at 1 mo. Key secondary end points included UI at 2 mo and at the end of follow-up.\nKEY FINDINGS AND LIMITATIONS: Median follow-up was 828 days. UI at 1 mo was lower after MiLEP than HoLEP (22.2% vs 51.1%; odds ratio [OR] 0.27; 95% confidence interval [CI] = 0.11-0.67; p = 0.004). UI at 2 mo was also lower (8.9% vs 24.4%; OR 0.30; 95% CI = 0.09-0.99; p = 0.048), whereas long-term UI did not differ significantly (2.2% vs 6.7%; p = 0.61). MiLEP also lowered the need for meatal dilation (15% vs 51%; p \u003c 0.001), irrigation volume (16 vs 24 l; p \u003c 0.001), and improved core temperature maintenance (+0.1 °C vs -0.1 °C; p \u003c 0.001), with higher median enucleation efficiency (1.22 vs 1.0; p = 0.003) and not statistically different operative time, complications, and functional improvement. Limitations include the inability to blind the surgeon and limited power for uncommon events.\nCONCLUSIONS AND CLINICAL IMPLICATIONS: MiLEP seems to improve early continence recovery, supporting miniaturization as a strategy to enhance patient-centered outcomes after HoLEP.", "access_scope": "abstract", "pmid": "42892994", "doi": "10.1016/j.euros.2026.09.010", "url": "https://pubmed.ncbi.nlm.nih.gov/42892994/"}], "drafts": [], "editorial": {"title": "擔心攝護腺手術後漏尿？先問恢復過程，別只看術式名字", "text": "老周吃藥一段時間，排尿仍不順，開始和醫師討論手術。他最擔心的，不是住院要帶什麼，而是出院後會不會漏尿，連和朋友出門喝茶都不自在。\n\n兒子找到「Mini-HoLEP」的研究，興奮地說：「器械比較小，是不是就保證不會漏尿？」老周聽了安心一點，卻也想知道，這個保證究竟從哪裡來。\n\n【手術工具和恢復情況，需要分開理解】\n\nHoLEP 指的是鈥雷射攝護腺剜除術，用來處理造成阻塞的增生組織。Mini-HoLEP 則是使用較小型器械的做法；名稱裡有「小」，不代表完全沒有風險，也不代表切除的是癌症。\n\n這項前瞻性隨機研究，比較標準器械與小型器械的手術結果。研究中，小型器械組在早期追蹤出現較少的漏尿，但長期漏尿差異沒有達到統計上的明確差異。\n\n研究也有同一位手術醫師執行、無法讓醫師不知道分組，以及對少見事件判斷能力有限等限制。因此，不能把結果寫成「小型器械人人都比較好」，也不能承諾某個人術後一定不漏尿。\n\n【把最在意的生活，帶進手術討論】\n\n如果正在考慮手術，可以問：自己的阻塞程度與攝護腺條件，適合哪些選項？預期改善哪些症狀？短期恢復和長期結果有何不同？可能有哪些排尿或性功能方面的影響？\n\n也可以說明工作是否需要久站、常出門，或自己最擔心哪些恢復問題，請團隊解釋術後追蹤與照護安排。\n\n面對研究上的比例，記得它描述的是一群人的結果，不是對個人的保證。手術選擇還需要考量身體狀況、醫師經驗與自己的期待。\n\n老周後來把「哪個術式一定最好」換成「哪個選擇適合我，也讓我了解風險」。願意問清楚，不是對治療沒信心，而是讓自己在做決定前，知道可以期待什麼，又有哪些事情需要一起面對。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依隨機試驗摘要改寫；未讀全文，早期改善不等於長期療效保證。", "character_count": 662, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42892994/"}]}}, {"id": "n2s-2a6a97466a54d7fdb0e3", "title": "守護攝護腺健康! 童綜合醫院「攝立健康新目標」互動登場 - 優活健康網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "守護攝護腺健康! 童綜合醫院「攝立健康新目標」互動登場 - 優活健康網", "publisher": "優活健康網", "published_at": "2026-10-21T03:50:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.uho.com.tw/article-70536.html", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:09:59.590123Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "陪爸爸看衛教展，才知道他一直沒說的排尿困擾", "text": "阿慧陪爸爸到醫院，經過一區介紹攝護腺的衛教看板。爸爸平常對這類話題總是揮揮手，這次卻在「尿流變弱」幾個字前停了下來。\n\n她隨口問：「你也會這樣嗎？」爸爸先說偶爾，聊著聊著，才承認出門前要先上廁所，晚上也常被尿意叫醒。他一直覺得這些事很難啟齒，怕一說出口就得開刀。\n\n【衛教的第一步，是讓人願意談自己的變化】\n\n這次收錄的新聞介紹醫院透過互動展覽，協助民眾認識攝護腺健康。活動是當時的衛教消息，不代表現在仍在展出；真正可以帶回生活的，是理解身體與及早求助的觀念。\n\n攝護腺位於膀胱下方，包圍尿道。當組織增生壓迫通道，可能讓尿流變弱、排尿中斷，或出現頻尿與排不乾淨的感覺。\n\n但這些症狀不能單靠看板就確診，也不能直接認定是癌症。攝護腺肥大、感染或其他泌尿問題，都需要依個別狀況評估。\n\n是否治療、採用哪種方式，會考量症狀、生活影響與檢查結果。有些人可以先調整習慣或使用藥物，有些人則需要進一步處理；並非一踏進泌尿科，就只剩手術一條路。\n\n【陪伴，可以從不讓對方難堪開始】\n\n比起在全家人面前追問，不妨找個自在的時候說：「如果最近上廁所比較辛苦，我可以陪你去問問。」讓對方有選擇，也有時間整理想法。\n\n就診前，可以一起記錄症狀持續多久、夜裡起床的情況，以及目前服用的藥。把問題帶進診間，通常比自己尋找偏方更能釐清原因。\n\n平常的飲水、飲酒及體重管理，也可和醫療人員討論，別把任何單一食物或保健品當成保證預防或治療的方法。\n\n阿慧後來發現，爸爸需要的不是被說教，而是一個能安心開口的機會。一句不帶責備的關心，可能就讓原本一直忍著的人，開始願意照顧自己。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依醫院衛教活動報導改寫；歷史展覽非現行活動公告。", "character_count": 650, "references": [{"title": "本篇原始來源", "url": "https://www.uho.com.tw/article-70536.html"}, {"title": "NHS 攝護腺肥大", "url": "https://www.nhs.uk/conditions/enlarged-prostate/"}]}}, {"id": "n2s-290793ea1e9b1175a5b5", "title": "健康網》晚上起床尿尿好幾次別當老化！ 醫揭攝護腺肥大4迷思 - 自由健康網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "健康網》晚上起床尿尿好幾次別當老化！ 醫揭攝護腺肥大4迷思 - 自由健康網", "publisher": "自由健康網", "published_at": "2026-10-22T12:01:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://health.ltn.com.tw/article/breakingnews/5614002", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:09:58.047552Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "半夜一直跑廁所，連好好睡一覺都變成奢望？", "text": "「你昨晚是不是又沒睡好？」\n\n早餐桌上，太太看著阿明打了第三個哈欠。他笑著說：「年紀大了嘛，晚上起來尿尿很正常。」\n\n其實，阿明昨晚才剛睡著，就被尿意叫醒。回到床上，好不容易有了睡意，沒多久又想上廁所。天亮後，他整個人昏沉沉，連最期待的晨間散步都懶得出門。\n\n他最困擾的，已經不只是跑廁所，而是每天都像沒充飽電。\n\n【晚上常起床排尿，是值得留意的身體訊號】\n\n攝護腺位在膀胱下方，包圍著尿液排出的通道，也就是尿道。可以把它想成套在水管外的一圈組織；當它逐漸增大，有時會擠壓通道，讓尿液排出不那麼順暢。\n\n因此，有些人除了夜尿，還會發現尿流變弱、站了一會兒才尿得出來，或上完廁所仍覺得沒有排乾淨。\n\n不過，光憑夜尿，不能直接認定是攝護腺肥大。膀胱問題、飲水習慣等因素，也可能影響排尿，需要一起評估。\n\n同樣地，攝護腺比較大，也不一定代表症狀比較嚴重。醫師會關心的，是你實際怎麼排尿，以及生活受到多少影響。\n\n【想改善，可以先從觀察自己的習慣開始】\n\n睡前是不是習慣喝一大杯茶？白天忙到忘記喝水，晚上才一次補足？試著把水分分散到白天，避免睡前大量飲用，也留意咖啡、茶與酒精是否讓症狀更明顯。\n\n但別為了少跑廁所，就整天不敢喝水。調整飲水時間，和過度限制水分，是兩回事。\n\n也可以記下幾天的飲水時間、排尿次數，以及夜裡起床的情況，就診時帶給醫師參考，比一句「最近比較常尿」更容易說清楚困擾。\n\n如果已經反覆影響睡眠，就值得安排泌尿科評估。治療可能從生活調整開始，也可能需要藥物，並非一看診就得開刀。\n\n下次家人再說「老了就是這樣」，不妨多問一句：「是不是已經讓你睡不好了？」這個小問題，可能就是開始照顧自己的第一步。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依原站衛教及所列官方資料改寫；不取代個別醫療評估。", "character_count": 677, "references": [{"title": "NHS 攝護腺肥大衛教", "url": "https://www.nhs.uk/conditions/enlarged-prostate/"}, {"title": "NIDDK 攝護腺肥大說明", "url": "https://www.niddk.nih.gov/health-information/urologic-diseases/prostate-problems/enlarged-prostate-benign-prostatic-hyperplasia."}]}}, {"id": "n2s-18e85484b4da97c446bb", "title": "Beyond pairwise comparisons of androgen receptor signaling inhibitors in nonmetastatic castration-resistant prostate cancer.", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Beyond pairwise comparisons of androgen receptor signaling inhibitors in nonmetastatic castration-resistant prostate cancer.", "publisher": "ESMO real world data and digital oncology", "published_at": "2026-10-12T00:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": "42903688", "doi": "10.1016/j.esmorw.2026.100805", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC13682055/", "retrieval": {"status": "read", "method": "pmc_xml", "checked_at": "2026-10-23T18:09:51.110946Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "別人的攝護腺癌藥比較好？換藥前先把比較條件問清楚", "text": "阿德在病友群組看到一段討論：「這個藥效果比較好，你怎麼還在吃另一種？」他當下沒有回話，心裡卻一直惦記，連原本按時吃的藥，都開始猶豫要不要繼續。\n\n太太陪他把文章讀完，才注意到它是一封討論研究方法的來函。裡面談的，不是一場讓所有病人在相同條件下直接比較藥物的新試驗。\n\n【藥物研究的結果，需要看它怎麼比較】\n\n部分攝護腺癌治療會使用抑制雄性素訊號的藥物，讓癌細胞較難接收到相關生長訊號。適合哪一種，仍要依疾病狀態、身體條件與其他用藥來評估。\n\n這篇來函討論非轉移性去勢抗性攝護腺癌的藥物比較，提醒讀者留意回顧性資料、統計方式與副作用紀錄的差異。\n\n可以把不同研究想成不同班級的成績表。如果學生原本條件、上課方式與考試時間都不同，就不能只拿平均分數決定哪一班教得最好。\n\n同樣地，研究沒有發現明顯差異，也不一定代表兩種治療已被證明完全相同。這封來函屬於評論，不能單靠它替所有藥物排名，更不能當成自行換藥的依據。\n\n【把病友經驗當問題，別直接當處方】\n\n如果對現在的治療有疑慮，可以記下想了解的事：這個藥目前的治療目標是什麼？如何判斷效果？有哪些副作用要通報？如果不適合，還有哪些選項？\n\n也要主動說出疲倦、頭暈或其他不舒服，並帶上完整藥單，讓團隊了解症狀是否和用藥有關。不要因為群組裡某個人效果很好，就自行停藥、加藥或交換藥物。\n\n病友分享可以帶來支持，但每個人的期別、共病與過往治療都不相同。讀研究時先問「這群人和我像不像」，比只問哪個數字漂亮更有幫助。\n\n阿德後來把群組訊息帶去回診，得到針對自己的說明。好的治療討論，不需要和別人比輸贏，而是一起確認：眼前這個選擇，是否符合自己的病情與生活需要。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依已取得全文的讀者來函改寫；評論非新的原始臨床試驗。", "character_count": 676, "references": [{"title": "本篇原始來源", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC13682055/"}]}}, {"id": "n2s-13452cf169e700990e75", "title": "健康醫療網》攝護腺肥大是男性必經之路？「排尿不順」可能不是小問題醫解析治療策略- 股市爆料同學會 - CMoney", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "健康醫療網》攝護腺肥大是男性必經之路？「排尿不順」可能不是小問題醫解析治療策略- 股市爆料同學會 - CMoney", "publisher": "CMoney", "published_at": "2026-10-21T00:13:47Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://talk.ltn.com.tw/article/breakingnews/5610102", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:09:48.192202Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "排尿越來越慢，卻怕看診就要開刀？先了解有哪些選擇", "text": "老林出門前總要先確認附近有沒有廁所。朋友約他去郊外走走，他想到路上可能排尿不順，就找理由推掉。太太勸他看診，他卻說：「去了大概就要開刀，我再忍一下。」\n\n他不是不在乎健康，而是害怕治療帶來新的麻煩。可是，一直忍著，也讓生活範圍慢慢縮小，連原本喜歡的活動都不敢參加。\n\n【排尿變慢，可能是通道受影響】\n\n攝護腺包圍尿道，增生的組織有時會讓排尿通道變窄，出現尿流變細、起尿困難、頻尿或排不乾淨的感覺。膀胱必須更費力，才能把尿排出去。\n\n但排尿不順並不只和攝護腺有關，仍需由醫師了解病史與檢查。也不是症狀越能忍，就代表問題越輕；生活是否受影響，同樣是評估的一部分。\n\n原報導介紹的治療方向包括生活調整、藥物，以及不同手術或微創方式。它提供的是選項說明，不能取代個別評估，也不表示最新術式人人都適合。\n\n【治療的起點，是先把目標說清楚】\n\n如果症狀較輕，醫師可能先和你討論飲水時間、酒精與咖啡因等習慣，並追蹤變化。需要藥物時，也會考量改善症狀的目的與副作用。\n\n若藥物效果有限，或已出現需要積極處理的情況，才進一步討論其他方式。可以問清楚預期改善、恢復時間，以及排尿和性功能可能受到的影響，不必因為害怕就完全避開討論。\n\n同時，不要為了少上廁所而整天不喝水，也不要自行停用原本藥物。若突然完全尿不出來、下腹脹痛，應立即就醫，不能繼續在家等待。\n\n老林後來在回診單上寫下兩個願望：「晚上睡好一點，敢和朋友出門。」這些很生活的期待，正是值得和醫師一起討論的治療目標。看診不是答應立刻手術，而是先了解自己有哪些路可以走。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依原站醫師衛教改寫；治療需個別評估，不保證微創方式適合所有人。", "character_count": 633, "references": [{"title": "本篇原始來源", "url": "https://talk.ltn.com.tw/article/breakingnews/5610102"}, {"title": "NHS 攝護腺肥大", "url": "https://www.nhs.uk/conditions/enlarged-prostate/"}]}}, {"id": "n2s-0d4c0978d4a9f6554385", "title": "健康網》尿不出來 危險！醫：攝護腺肥大5併發症 需立刻就醫 - 自由健康網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "健康網》尿不出來 危險！醫：攝護腺肥大5併發症 需立刻就醫 - 自由健康網", "publisher": "自由健康網", "published_at": "2026-10-21T13:21:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://health.ltn.com.tw/article/breakingnews/5613691", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:09:46.216944Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "「還尿得出來，應該沒事吧？」有些排尿警訊不能等", "text": "晚餐都快涼了，爸爸還沒從廁所出來。\n\n兒子敲了敲門：「爸，你還好嗎？」裡面傳來一句：「沒事，尿比較慢而已。」\n\n這句話，家人已經聽了好幾個月。爸爸上廁所越來越久，常常才走出來，又折返回去。他卻總覺得，只要最後還尿得出來，就沒有看醫生的必要。\n\n直到某天晚上，他明明很想尿，下腹也越來越脹，站了半天卻完全尿不出來。\n\n【突然完全尿不出來，需要立即就醫】\n\n這可能是急性尿滯留，也就是膀胱裡有尿，卻無法順利排出。尤其合併下腹脹痛時，應直接前往急診，不要等到隔天，也不要靠大量喝水或一直用力，想把尿「逼出來」。\n\n醫療人員可能需要先協助引流尿液，再檢查造成阻塞或排尿困難的原因。\n\n【攝護腺肥大，是可能原因之一】\n\n攝護腺包圍著尿道，當增大的組織壓迫通道，膀胱就得更費力，才能把尿液推出去。\n\n如果長期無法排乾淨，膀胱裡可能一直留著尿液。有些慢性尿滯留甚至不會很痛，因此，「還能尿一點」並不能保證排尿功能沒有問題。\n\n持續的尿液滯留，可能增加感染、膀胱受損或腎臟受影響的風險。這些情況並非每個人都會發生，但值得及早評估。\n\n【除了尿不出來，還有哪些情況要留意？】\n\n如果出現肉眼看得到的血尿、排尿疼痛，或頻繁急尿又伴隨發燒、畏寒，都應及時就醫。血尿也不能直接歸因於攝護腺肥大，仍需要查明原因。\n\n至於尿流變弱、排尿等待變久、常覺得排不乾淨，即使還沒痛到受不了，也可以先安排泌尿科門診，不必等到突然出狀況。\n\n就診時，把症狀持續多久、目前吃哪些藥、生活受到哪些影響說清楚，有助醫師評估。\n\n治療會依症狀與檢查結果決定，可能包括生活調整、藥物或手術。早點看診，才能了解自己的情況與選項。\n\n關心家人，有時可以從一句話開始：「你最近上廁所，是不是比以前辛苦？」給他一個願意說出口的機會，也陪他跨出就醫的第一步。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依原站衛教及所列官方資料改寫；不取代個別醫療評估。", "character_count": 717, "references": [{"title": "NIDDK 尿滯留與併發症", "url": "https://www.niddk.nih.gov/health-information/urologic-diseases/urinary-retention/definition-facts"}, {"title": "NIDDK 攝護腺肥大與就醫警訊", "url": "https://www.niddk.nih.gov/health-information/urologic-diseases/prostate-problems/enlarged-prostate-benign-prostatic-hyperplasia."}]}}, {"id": "n2s-0123eee0f94efb00bd27", "title": "排尿異常、性功能下降別輕忽！男性健康月關注4大疾病 - 健康醫療網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "排尿異常、性功能下降別輕忽！男性健康月關注4大疾病 - 健康醫療網", "publisher": "健康醫療網", "published_at": "2026-10-22T03:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.healthnews.com.tw/article/70112", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:09:43.233226Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "總說「只是累了」？那些不好意思提的男性健康變化", "text": "阿翔最近回家只想躺著。太太發現他晚上常起來上廁所，也越來越少主動親近，問起來，他總回答：「工作忙，休息一下就好。」\n\n其實他也擔心，只是不知道該怎麼開口。怕被笑年紀到了，怕一說性功能有變化，就被貼上不行的標籤，於是把每個困擾都藏在「太累」兩個字裡。\n\n【同樣的表現，可能有不同原因】\n\n男性健康不只有單一器官。這次收錄的男性健康月報導，提醒民眾留意攝護腺癌、攝護腺肥大、勃起功能障礙與睪固酮低下等議題。\n\n排尿變慢或夜尿，可能和攝護腺或膀胱狀況有關；勃起變化需要考量血管、神經、用藥與心理因素；疲倦或性慾下降，也不能直接等同荷爾蒙不足。\n\n身體就像一個彼此連動的團隊，同一個生活困擾，可能有好幾個環節參與。單憑一項症狀，無法自己分辨是哪種疾病，也不能把排尿問題直接當成癌症。\n\n報導屬於衛教與活動消息，不能據此診斷個人疾病，或推論補充某種產品就能解決所有變化。\n\n【別急著補，先把變化記下來】\n\n如果症狀持續，可以整理何時開始、和以前差多少、是否影響睡眠或關係，以及目前的疾病與用藥，帶去和醫師討論。需要哪些檢查，應依個別情況決定。\n\n對於較私密的問題，可以先寫在紙上，或告訴醫師自己不知道怎麼描述。你不必用專業術語，像「最近比較難維持勃起」或「半夜一直醒來」就已經很清楚。\n\n伴侶也可以把責備換成關心，不用「你是不是不在乎我」追問，而是讓對方知道，有需要時可以一起面對。\n\n阿翔後來願意預約門診，並不是因為被嚇到，而是發現這些困擾可以被平常地討論。照顧自己不必等到完全撐不住；願意把真實的變化說出來，就是值得開始的地方。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依男性健康衛教報導改寫；症狀不等於確診，不倡議自行補充荷爾蒙。", "character_count": 639, "references": [{"title": "本篇原始來源", "url": "https://www.healthnews.com.tw/article/70112"}]}}, {"id": "n2s-3ce629060b9fd204b547", "title": "攝護腺菌相與攝護腺癌：MICROPROSTK 研究", "date": "2026-10-23", "status": "pending_review", "warning": "", "revision": 2, "sources": [{"title": "Prostate tissue microbiota dysbiosis associated with prostate cancer: results from the MICROPROSTK multicenter study.", "publisher": "New microbes and new infections", "published_at": "2026-10-08T00:00:00Z", "date_precision": null, "summary": "•The prostate harbors a diverse and previously undercharacterized microbial ecosystem with species-level resolution.•Prostate cancer (PCa) patients exhibit higher microbial richness and α-diversity in prostate tissue than non PCa patients.•Distinct microbial communities are observed across prostate, urinary, and rectal niches, independent of cancer status.•Cutibacterium acnes is enriched in PCa patients' biopsies, Lactobacillus reuteri in non-PCa patients' biopsies.•Findings highlight potential prostate-associated pathobionts and protective commensalssignatures.", "access_scope": "abstract", "pmid": "42904090", "doi": "10.1016/j.nmni.2026.101862", "url": "https://pubmed.ncbi.nlm.nih.gov/42904090/"}], "drafts": [], "editorial": {"title": "看到「好菌」就想買益生菌？攝護腺研究還沒說到那一步", "text": "阿偉滑手機時看到一篇攝護腺菌相研究，剛好又收到保健品廣告，心裡立刻把兩件事接在一起：「既然有好菌，是不是吃一點就能保養攝護腺？」\n\n他把商品放進購物車，結帳前卻停了下來。新聞研究的是攝護腺組織，商品賣的是口服補充品，這中間的關係，真的已經被證明了嗎？\n\n【找到不同的菌，不等於找到治療方法】\n\n微生物相可以簡單理解成一個地方有哪些微生物，以及它們組成的樣貌。不同身體部位的環境不同，研究人員會比較這些差異，希望找到與疾病相關的線索。\n\nMICROPROSTK 研究觀察攝護腺組織及其他採樣部位的微生物，發現攝護腺癌與非癌症族群之間有一些菌相差異。\n\n但這類結果描述的是關聯，無法單靠它決定先後因果。菌相變化可能和疾病、局部環境或其他因素一起出現，不能直接說某種菌造成癌症，或另一種菌可以預防癌症。\n\n更不能因為研究裡出現熟悉的菌名，就認定商店裡的益生菌能到達攝護腺、改變組織菌相，或改善癌症結果。這不是證明口服補充品有效的人體介入試驗。\n\n【購買前，先問研究真正測了什麼】\n\n看到「保護性」「好菌」等字眼時，可以先確認：研究有讓受試者服用產品嗎？有比較疾病或生活品質的變化嗎？商品和研究中的菌株、使用方式是否真的是同一件事？\n\n如果文章只提供觀察結果，就把它當成值得追蹤的新線索，不急著轉成自己的保養清單。也不要因此自行用抗生素，或停止原本的追蹤與治療。\n\n對自己適不適合某項補充品有疑問，可以帶著產品資料和醫療人員討論，尤其正在接受治療或同時使用多種藥物時。\n\n阿偉最後先關掉購物頁，把疑問留下來回診時問。對新研究保持好奇很好；知道它還沒有回答什麼，才能避免把希望太快交給一個尚未證實的承諾。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依菌相研究摘要改寫；相關性不等於因果，不支持自行使用益生菌或抗生素。", "character_count": 674, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42904090/"}]}}, {"id": "n2s-13ca12b27e217a87a30a", "title": "單次 SBRT 文獻回顧（早期流程測試）", "date": "2026-10-23", "status": "blocked", "warning": "禁止發布／流程測試或呼叫結果待釐清；此紀錄僅供稽核。", "revision": 1, "sources": [{"title": "Efficacy and safety of single-fraction stereotactic body radiotherapy (SBRT) for the curative treatment of extracranial primary Tumors: A collaborative systematic review on behalf of the SBRT Focus Group of the European Society for Radiotherapy \u0026 Oncology (ESTRO).", "publisher": "Clinical and translational radiation oncology", "published_at": "2026-10-01T00:00:00Z", "date_precision": null, "summary": "Single-fraction stereotactic body radiotherapy (SF-SBRT) represents one of the most advanced frontiers in modern radiation oncology. While ultra-hypofractionation has entered everyday clinical practice in different fields of the oncological care, curative treatments in one session are increasingly attractive for the potential favorable combination of logistic advantages with safety and clinical outcomes. This collaborative systematic review promoted by the ESTRO SBRT Focus Group in participation with members of different disease-site Focus Groups collects the available data in support of SF-SBRT for the curative treatment of the main extracranial primary tumors. The findings highlight that, for specific anatomical sites, SF-SBRT is both safe and effective though the results emphasize the critical importance of careful patient selection and mandatory technological requirements for treatment planning and delivery. This collaborative work provides a comprehensive overview of current evidence and identifies key knowledge gaps for future investigation and upcoming clinical trials.", "access_scope": "abstract", "pmid": "42898625", "doi": "10.1016/j.ctro.2026.101295", "url": "https://pubmed.ncbi.nlm.nih.gov/42898625/"}], "drafts": [{"platform": "facebook", "text": "大家有沒有想過，癌症放射治療有沒有可能在單一次療程中就完成呢？放射腫瘤學近年來持續發展，單次高劑量全身立體定位放射治療（SF-SBRT）成為其中的前沿技術之一。這種單次治癒性治療因其潛在的便利性、安全性與臨床成效，在癌症照護中受到關注。根據歐洲放射腫瘤學會（ESTRO）相關焦點小組推動的協同系統性文獻回顧，收集了支援主要頭顱外原發腫瘤單次立體定位放射治療的現有資料。研究結果指出，針對特定解剖部位，單次立體定位放射治療是安全且有效的。不過，這項研究也強調了幾個關鍵點： 🎯 必須進行非常審慎的患者選擇 💡 治療計畫與執行需要嚴格的技術要求 🔬 該文獻回顧也指出了未來的知識缺口，有待後續研究與臨床試驗進一步探討。希望今天的醫療新知分享，能讓大家對現代放射治療的進展有更多了解。如果你身邊有親友正在關心相關治療選擇，也歡迎分享給他們喔！\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42898625/"}, {"platform": "instagram", "text": "面對癌症治療，你聽過單次完成的放射治療選項嗎？✨ 近年來放射腫瘤學有許多新進展，其中單次高劑量全身立體定位放射治療（SF-SBRT）備受討論。歐洲放射腫瘤學會（ESTRO）相關焦點小組進行了一項協同系統性文獻回顧，整理了主要頭顱外原發腫瘤接受單次立體定位放射治療的現有資料。研究帶給我們的重點整理： 🌟 針對特定解剖部位，單次立體定位放射治療展現了安全與有效性 🔍 治療效果高度依賴審慎的患者選擇 ⚙️ 治療計畫與執行必須符合嚴格的技術要求 📝 這份合作研究也點出了未來需要繼續填補的知識缺口，期待未來的臨床試驗帶來更多解答。收藏這篇貼文，隨時掌握最新的醫療科技進展！💬\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42898625/"}, {"platform": "threads", "text": "癌症放射治療有可能在單一次療程就完成嗎？輻射腫瘤學界近年持續探討單次高劑量全身立體定位放射治療（SF-SBRT）的應用。根據一項歐洲放射腫瘤學會（ESTRO）相關焦點小組推動的協同系統性文獻回顧，針對特定解剖部位，單次立體定位放射治療在審慎的患者選擇與嚴格技術要求下，被認為是安全且有效的。這項研究也為未來的臨床試驗指引了方向。大家對於這樣的單次治療方式有什麼想法呢？歡迎留言聊聊！\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42898625/"}]}, {"id": "n2s-df2ce02981fa462999d9", "title": "3T、1.5T差在哪？磁場不是越強越好 醫揭MRI適用情境 - 鏡週刊Mirror Media", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "3T、1.5T差在哪？磁場不是越強越好 醫揭MRI適用情境 - 鏡週刊Mirror Media", "publisher": "鏡週刊Mirror Media", "published_at": "2026-10-22T01:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.healthnews.com.tw/article/70093", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:10:20.206818Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "做 MRI 一定要挑 3T？選檢查不是比手機規格", "text": "小林準備做 MRI，朋友聽到醫院安排的是 1.5T，立刻提醒：「現在不是都有 3T 了？數字比較大，應該比較好吧！」\n\n他原本只是想把檢查做好，這下卻開始懷疑自己是不是選錯。打開手機搜尋後，規格越看越多，心裡反而更沒底。\n\n【磁場強度，是影響影像的其中一個條件】\n\nMRI 利用磁場與無線電波取得身體影像；T 是磁場強度的單位。較強的磁場通常能帶來更多訊號，可用來呈現細節，或在合適條件下調整掃描時間。\n\n但取得好影像，就像拍一張清楚的照片，除了器材，也要考量拍攝對象、設定與過程。檢查部位、身體狀況及能否配合不動，都會影響結果。\n\n原報導中的影像醫學醫師說明，3T 與 1.5T 各有適用情境，並非所有檢查都以 3T 較佳。有些情況需要更多細節，有些則需要考量影像干擾或其他條件。\n\n因此，單靠一個數字，不能判斷檢查一定比較準，也不能推論另一種規格就會漏掉問題。\n\n【事先說清楚身體狀況，比自己挑機器更重要】\n\n如果有心律調節器、人工關節、金屬植入物，或不確定曾接受過哪些植入手術，要主動告知團隊，並提供可取得的資料。能不能做 MRI、在什麼條件下做，需要個別確認，不能只憑「有金屬」或「磁場較弱」自行決定。\n\n若容易害怕狹窄空間、難以久躺，或過去檢查曾很不舒服，也可以提早說明，讓團隊討論如何協助配合。\n\n安排檢查時，不妨問：「這次主要要看什麼？為什麼這個設備與掃描方式適合我？」比起追問哪台最新，這些問題更接近真正的需要。\n\n小林最後把朋友的建議帶回醫院討論，沒有急著換院。檢查的目的，是取得能幫助判斷的資訊；適合自己的安排，需要把身體條件和醫療目的放在一起看。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依原站醫師衛教改寫；MRI 規格須依檢查目的與植入物條件評估。", "character_count": 650, "references": [{"title": "本篇原始來源", "url": "https://www.healthnews.com.tw/article/70093"}]}}, {"id": "n2s-d21b4c53238130a0bcfa", "title": "健康醫療網》攝護腺肥大是男性必經之路？「排尿不順」可能不是小問題 醫解析治療策略 - 自由評論網", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "健康醫療網》攝護腺肥大是男性必經之路？「排尿不順」可能不是小問題 醫解析治療策略 - 自由評論網", "publisher": "自由評論網", "published_at": "2026-10-21T00:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://talk.ltn.com.tw/article/breakingnews/5610102", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-23T18:10:18.831560Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "排尿越來越慢，卻怕看診就要開刀？先了解有哪些選擇", "text": "老林出門前總要先確認附近有沒有廁所。朋友約他去郊外走走，他想到路上可能排尿不順，就找理由推掉。太太勸他看診，他卻說：「去了大概就要開刀，我再忍一下。」\n\n他不是不在乎健康，而是害怕治療帶來新的麻煩。可是，一直忍著，也讓生活範圍慢慢縮小，連原本喜歡的活動都不敢參加。\n\n【排尿變慢，可能是通道受影響】\n\n攝護腺包圍尿道，增生的組織有時會讓排尿通道變窄，出現尿流變細、起尿困難、頻尿或排不乾淨的感覺。膀胱必須更費力，才能把尿排出去。\n\n但排尿不順並不只和攝護腺有關，仍需由醫師了解病史與檢查。也不是症狀越能忍，就代表問題越輕；生活是否受影響，同樣是評估的一部分。\n\n原報導介紹的治療方向包括生活調整、藥物，以及不同手術或微創方式。它提供的是選項說明，不能取代個別評估，也不表示最新術式人人都適合。\n\n【治療的起點，是先把目標說清楚】\n\n如果症狀較輕，醫師可能先和你討論飲水時間、酒精與咖啡因等習慣，並追蹤變化。需要藥物時，也會考量改善症狀的目的與副作用。\n\n若藥物效果有限，或已出現需要積極處理的情況，才進一步討論其他方式。可以問清楚預期改善、恢復時間，以及排尿和性功能可能受到的影響，不必因為害怕就完全避開討論。\n\n同時，不要為了少上廁所而整天不喝水，也不要自行停用原本藥物。若突然完全尿不出來、下腹脹痛，應立即就醫，不能繼續在家等待。\n\n老林後來在回診單上寫下兩個願望：「晚上睡好一點，敢和朋友出門。」這些很生活的期待，正是值得和醫師一起討論的治療目標。看診不是答應立刻手術，而是先了解自己有哪些路可以走。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依原站醫師衛教改寫；治療需個別評估，不保證微創方式適合所有人。", "character_count": 633, "references": [{"title": "本篇原始來源", "url": "https://talk.ltn.com.tw/article/breakingnews/5610102"}, {"title": "NHS 攝護腺肥大", "url": "https://www.nhs.uk/conditions/enlarged-prostate/"}]}}, {"id": "n2s-aece9a24639b1e842c2d", "title": "Discovery of 177Lu-PSMA-MN4 as an improved PSMA-targeted radioligand with enhanced antitumor efficacy.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Discovery of 177Lu-PSMA-MN4 as an improved PSMA-targeted radioligand with enhanced antitumor efficacy.", "publisher": "European journal of medicinal chemistry", "published_at": "2026-09-26T00:00:00Z", "date_precision": null, "summary": "Prostate-specific membrane antigen (PSMA)-targeted radioligand therapy with 177Lu-PSMA-617 improves outcomes in metastatic castration-resistant prostate cancer (mCRPC), yet a substantial subset of patients experiences disease progression, underscoring the need for next-generation agents with improved pharmacological profiles. Guided by the PSMA-617/PSMA co-crystal structure (PDB: 8BOW) and molecular dynamics (MD) simulations, the present study rationally designs seven novel PSMA-617 derivatives (PSMA-MN1-7) to enhance target engagement and pharmacokinetic behavior. Among these, 177Lu-PSMA-MN4 demonstrates potent PSMA enzymatic inhibition (IC50 = 1.72 nM), enhanced cellular internalization (110.67 ± 2.60% relative to PSMA-617), and a favorable biodistribution profile marked by sustained tumor retention and rapid renal clearance in LNCaP tumor-bearing mice. In both hormone-sensitive LNCaP and castration-resistant 22RV1 xenograft models, 177Lu-PSMA-MN4 achieves superior tumor growth inhibition and survival prolongation compared with 177Lu-PSMA-617. Single-dose administration at doses up to 0.6 mCi/animal is well tolerated, with no clinically significant hematological changes, renal biochemical abnormalities, or histopathological findings within the observation period of this study. These findings should be interpreted in light of several limitations: absorbed-dose estimates were derived from mouse biodistribution data and require allometric scaling before comparison with clinical organ constraints; therapeutic efficacy was evaluated under a single-dose regimen rather than a fractionated or multi-cycle schedule; and long-term toxicity, including delayed renal and hematopoietic effects, was not assessed. These findings position 177Lu-PSMA-MN4 as a promising candidate for next-generation PSMA-targeted radioligand therapy. Collectively, this work establishes a structure-guided linker-optimization paradigm for PSMA radioligands and identifies 177Lu-PSMA-MN4 as a promising preclinical candidate that warrants further translational evaluation.", "access_scope": "abstract", "pmid": "42810190", "doi": "10.1016/j.ejmech.2026.119381", "url": "https://pubmed.ncbi.nlm.nih.gov/42810190/"}], "drafts": [], "editorial": {"title": "新藥在小鼠身上表現很好，我現在就能用了嗎？", "text": "阿源陪父親治療攝護腺癌，看到一篇新型放射性藥物的研究，標題寫著「更強的抗腫瘤效果」。他忍不住問：「既然更好，為什麼醫院還沒讓爸爸用？」\n\n家人期待多一個選擇很自然，但從實驗室發現走到病人的治療，中間還有許多事情需要確認。讀懂研究進行到哪一步，才能讓期待有合適的位置。\n\n【精準送到目標，是研究方向，不是療效保證】\n\n部分攝護腺癌細胞表面有可供辨識的 PSMA。研究中的放射性配體，可以把它想成帶著放射性載荷的運送工具，利用目標結合的特性，嘗試將作用帶到腫瘤所在的位置。\n\n這篇研究設計新的 PSMA 衍生物，並在細胞與帶有腫瘤的小鼠模型中評估。其中一個候選物顯示值得進一步研究的腫瘤停留與抑制效果。\n\n但新候選物在小鼠身上的結果，不能直接換算成病人的存活改善。研究所觀察的劑量與時間，也不足以回答人體長期安全性、多次治療或不同病情下的結果。\n\n所以，「有前景」代表有繼續研究的理由，不等於已核准可用，更不代表原本的臨床治療已經過時。\n\n【把希望帶進診間，也把問題一起帶進去】\n\n如果看到相關消息，可以問醫療團隊：這是動物研究，還是已有人接受的臨床試驗？和父親目前的疾病階段是否相關？現有照護中有哪些已建立的選項？\n\n若考慮臨床研究，也需要確認資格、風險、追蹤與退出安排，不要只因新聞用詞亮眼，就自行更動治療或付費尋找來路不明的方案。\n\n可以把文章存下來，記錄想問的問題，但繼續按原計畫回診與用藥。讓照護團隊協助判讀，並不會妨礙你關心新進展。\n\n阿源後來明白，研究成果值得期待，也值得耐心確認。陪伴家人的努力，不必變成追逐每一個新名字；知道哪些是眼前可行的選項，哪些仍在探索，才能把力氣用在真正有幫助的地方。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依細胞及小鼠臨床前研究摘要改寫；非人體療效或新藥核准資訊。", "character_count": 678, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42810190/"}]}}, {"id": "n2s-9261464c752b251313e4", "title": "男尿不出來！檢查一脫褲驚見「狼牙棒」 醫嘆：菜花拖10年 - 三立新聞", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "男尿不出來！檢查一脫褲驚見「狼牙棒」 醫嘆：菜花拖10年 - 三立新聞", "publisher": "三立新聞", "published_at": "2026-10-23T05:38:07Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTFAzWEpJQjByeEhraDU5WkZsZ0dUeXFUMmZzOE1rcktGZ0NVYjZfelQtaV81RDhTTFAzUkYwdDBxVXJFNy1FbmRjSEg0NjE?oc=5", "retrieval": {"status": "tool_policy_blocked", "method": "none", "checked_at": "2026-10-28T02:21:35.650605Z", "resolved_by": null, "last_attempt_status": null}}, {"title": "男尿不出來！檢查一脫褲驚見「狼牙棒」 醫嘆：菜花拖10年 - 三立新聞", "publisher": "三立新聞", "published_at": "2026-10-23T05:37:00Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE04b3ZEUnMtZzZYYXhLbHE5RFg5Q095MDFtMTNzY1oxSlhQejBOLVlIT0lvX3BDbUxJUHR4aG1JMC1SeGE4bTVxNDFyUWHSAUxBVV95cUxNOG92RFJzLWc2WGF4S2xxOURYOUNPeTAxbTEzc2NaMUpYUHowTi1ZSE9Jb19wQ21MSVB0eGhtSTAtUnhhOG01cTQxclFh?oc=5", "retrieval": {"status": "tool_policy_blocked", "method": "none", "checked_at": "2026-10-28T02:21:35.650733Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-74820bf271865291a4c9", "title": "醫起看／下體長成「狼牙棒」尿道口都塞住 醫：菜花拖10年 | EBC 東森新聞 - LINE TODAY", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "醫起看／下體長成「狼牙棒」尿道口都塞住 醫：菜花拖10年 | EBC 東森新聞 - LINE TODAY", "publisher": "LINE TODAY", "published_at": "2026-10-23T14:02:59Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9RcF91Si1iMWJUd2pITnh2YUxqNTJpX1o0aU8xbTNCMjRzV3BCSVpoam5VQXVvRUtxOXNNRzB5a3VOaG10VlY0WkdvNlppRGFmbnZGTjRR?oc=5", "retrieval": {"status": "tool_policy_blocked", "method": "none", "checked_at": "2026-10-28T02:21:36.661843Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-6a6e59105d45f65249c8", "title": "An anti-fouling photoelectrochemical-electrochemical sensing platform with a zwitterionic interface and a photocurrent-polarity-switching strategy.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "An anti-fouling photoelectrochemical-electrochemical sensing platform with a zwitterionic interface and a photocurrent-polarity-switching strategy.", "publisher": "Biosensors \u0026 bioelectronics", "published_at": "2026-09-26T00:00:00Z", "date_precision": null, "summary": "In this work, we have developed a photoelectrochemical-electrochemical (PEC-EC) dual-mode sensing platform consisting of a polydopamine (PDA)-poly(sulfobetaine methacrylate) (PSBMA) anti-fouling zwitterionic interface equipped with a photocurrent-polarity-switching strategy. The PSBMA-PDA copolymer anti-fouling layer was attached to a hydrogen bonded organic framework-101 (HOF-101)-Sb2S3 modified indium titanium oxide (ITO) electrode surface using a dopamine mediated coupling reaction. The attachment of the aptamer of the model analyte prostate specific antigen (PSA) was designed to trigger a hybridisation chain reaction that linked the bifunctional factor of thionine-modified hairpin H1 and hairpin H2 to the anti-fouling electrode surface. Thionine then induced a switch from a cathodic to an anodic photocurrent at the PSBMA-PDA-HOF-101-Sb2S3/ITO, while generating a large differential pulse voltammetric current. This PSBMA-PDA interface-based anti-fouling thus acts as a dual-mode sensing platform that not only offers good anti-fouling capability by reducing non-specific adsorption, but also sensitively detects PSA over a 10 fg mL-1 - 100 ng mL-1 linear range and a detection limit of 5.0 fg mL-1 PSA in the PEC mode, and a 50 fg mL-1 - 100 ng mL-1 linear range and a detection limit of 24.6 fg mL-1 in the EC mode. This anti-fouling PEC-EC dual-mode sensing platform is readily applicable to the highly sensitive and selective detection of various disease biomarkers by simply attaching the corresponding DNA aptamer, thereby offering a promising pathway for early clinical diagnosis and point-of-care testing.", "access_scope": "abstract", "pmid": "42810248", "doi": "10.1016/j.bios.2026.119270", "url": "https://pubmed.ncbi.nlm.nih.gov/42810248/"}], "drafts": [], "editorial": {"title": "PSA 檢驗越靈敏，就越能保證抓到癌症嗎？", "text": "阿立收到朋友傳來的檢驗新聞：「這個技術連很少量的 PSA 都能測到，以後癌症是不是藏不住了？」他一邊期待，一邊又擔心自己過去的抽血是不是不夠精準。\n\n其實，能不能測到更低濃度，和能不能替一個人準確診斷癌症，是兩個需要分開回答的問題。檢驗數字漂亮，還不等於臨床判斷已經完整。\n\n【儀器要聽得見，也要分得清背景聲】\n\n這篇研究設計一種感測平台，以 PSA 作為示範目標。研究人員嘗試讓材料表面較不容易黏上無關物質，再結合光電與電化學訊號，提升低濃度偵測的表現。\n\n可以把它想成一支麥克風：除了能放大微弱的聲音，也要減少環境雜音，才不容易把背景干擾當成要找的訊號。\n\n這些是檢驗技術的重要進展，但研究中的分析靈敏度，不能直接等同於在人群中診斷癌症的能力。還需要了解不同病人、不同疾病與實際檢驗條件下的表現。\n\nPSA 本身是與攝護腺相關的指標，升高不只可能出現在癌症，也可能和其他攝護腺狀況有關。因此，即使數值測得很細，也仍需由醫師搭配病史與其他資料解讀。\n\n【看檢驗新聞，可以多問一步】\n\n先確認研究是在測試材料與感測器，還是已完成病人的臨床診斷比較。它有沒有說明誤判的情況？是否真的會改變檢查流程？這些都比單看「最低可測濃度」更接近自己的需要。\n\n如果正在追蹤 PSA，不必因為一篇技術新聞就自行改用未知檢驗，或否定原本的追蹤。可以把資料帶去問醫療團隊，了解目前採用的檢驗與後續安排。\n\n同時，別只拿不同時間、不同條件下的結果自己做結論，讓醫師知道完整背景，才更容易判斷變化。\n\n阿立最後把訊息轉給朋友時，多補了一句：「這是新技術研究，還不能說抽血就能保證抓到癌症。」願意替資訊加上適當的界線，也是在幫自己和身邊的人減少不必要的焦慮。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依感測器技術研究摘要改寫；分析靈敏度不等於臨床診斷效能。", "character_count": 688, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42810248/"}, {"title": "NHS PSA 檢驗說明", "url": "https://www.nhs.uk/tests-and-treatments/psa-test/"}]}}, {"id": "n2s-695c36c136147412e4c5", "title": "坐著尿尿＝攝護腺出問題？醫破解男性「3大迷思」：其實更好放鬆 - 三立新聞", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "坐著尿尿＝攝護腺出問題？醫破解男性「3大迷思」：其實更好放鬆 - 三立新聞", "publisher": "三立新聞", "published_at": "2026-10-22T03:52:29Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE85RXRmZWJWN05VVnpVRnBSQ2ZpZFRwb29LcUZObWg5MXdsb21QLS1xRWJNajhEdTdHOGVxTFBMUU1WamY2VXJDQ25PQlM?oc=5", "retrieval": {"status": "tool_policy_blocked", "method": "none", "checked_at": "2026-10-28T02:21:39.709981Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-659fe163f4b1272aa036", "title": "坐著尿=攝護腺出問題？醫破解男性3大迷思 - 鏡週刊Mirror Media", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "坐著尿=攝護腺出問題？醫破解男性3大迷思 - 鏡週刊Mirror Media", "publisher": "鏡週刊Mirror Media", "published_at": "2026-10-22T03:49:00Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTE5fUlpPZTkzcXF1cUZLOTNTTjl3RjhJWkNmS3JDN1UtMV9EZW1zS3dQM2hqMFJ1QWVMbTdhQ2dGcFEtVkIxZm8tT3dDNThtTkpqNnBzTkhpVkkyZTFXMFI4U2xB0gFiQVVfeXFMTl9SWk9lOTNxcXVxRks5M1NOOXdGOElaQ2ZLckM3VS0xX0RlbXNLd1AzaGowUnVBZUxtN2FDZ0ZwUS1WQjFmby1Pd0M1OG1OSmo2cHNOSGlWSTJlMVcwUjhTbEE?oc=5", "retrieval": {"status": "publisher_url_unresolved", "method": "none", "checked_at": "2026-10-28T02:21:38.684848Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-62728a0414e9b18e49e7", "title": "Localized nanomedicine for urologic cancers: anatomy-guided design and clinical translation.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Localized nanomedicine for urologic cancers: anatomy-guided design and clinical translation.", "publisher": "Materials today. Bio", "published_at": "2026-10-08T00:00:00Z", "date_precision": null, "summary": "Bladder, prostate, and renal cancers differ in their anatomical locations, tissue structures, and routes of clinical intervention. Conventional systemic treatments are often limited by nonspecific biodistribution, insufficient tumor accumulation, and toxicity. Localized nanomedicine delivery offers an alternative strategy by using organ-specific anatomical access to increase exposure at the tumor site and reduce systemic distribution. Its success depends on the compatibility of nanomedicine delivery systems with the physiological environment, anatomical characteristics, and procedural requirements of the organ. Here, we compare local nanomedicine strategies for these three cancers and discuss how anatomy can guide their design. We therefore define five design criteria for localized nanomedicines: retention, penetration, responsiveness, targeting, and synergy. For each criterion, describe relevant engineering approaches and applications in individual cancers. We also consider barriers to clinical use, including formulation reproducibility and compatibility with clinical workflows. An approach that combines anatomy, nanomedicine design, and delivery procedures may support their clinical translation for more precise diagnosis and treatment.", "access_scope": "abstract", "pmid": "42898651", "doi": "10.1016/j.mtbio.2026.103740", "url": "https://pubmed.ncbi.nlm.nih.gov/42898651/"}], "drafts": [], "editorial": {"title": "藥能直接送到腫瘤旁邊，副作用就一定比較少嗎？", "text": "阿芬陪家人討論泌尿系統癌症治療時，聽到「局部奈米送藥」的研究，心裡浮現一個很直覺的畫面：像寄包裹一樣，把藥送到病灶，不就不用讓全身都受影響？\n\n這個想法很吸引人，但真正的身體不是一張平面的配送地圖。藥送到了之後，能停留多久、走進哪些組織，又會不會影響其他地方，都需要研究。\n\n【同樣是泌尿系統，不同器官的環境也不同】\n\n奈米藥物的概念，是利用微小的載體協助攜帶或釋放藥物。局部給藥則希望利用器官可接近的途徑，增加病灶附近的藥物接觸，減少不必要的全身分布。\n\n這篇回顧比較膀胱、攝護腺與腎臟癌的相關策略，強調設計必須配合器官的構造、生理環境與醫療操作。\n\n可以把它想成不同地址有不同的收件條件：有的容易送達，有的需要特殊路徑；送到門口，也不代表包裹能順利進入需要的房間。\n\n回顧討論的方向包括如何留住藥物、穿透組織與辨識目標，也提醒製程穩定及配合臨床流程等問題。它不是證明所有局部奈米療法都更安全的治療比較試驗。\n\n【聽到新療法，先確認它是哪一個階段】\n\n如果有人推薦相關方案，可以問：這個特定產品或做法，是實驗室研究、臨床試驗，還是已建立的治療？用於哪個器官和病況？有哪些已知風險與不確定性？\n\n「局部」不等於完全沒有全身影響，「奈米」也不等於效果一定更好。不要只憑一個技術名稱，就自行停掉原本治療或接受來源不明的注射與產品。\n\n將資訊交給照護團隊一起討論，可以幫忙辨認研究想解決的問題，和眼前可用選項之間的距離。\n\n阿芬後來把期待整理成幾個問題，而不是急著尋找神奇配送工具。好的醫療進展需要一步步驗證；理解技術的可能性，也理解它還沒回答的事，才能讓希望走得更踏實。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依局部奈米醫學文獻回顧摘要改寫；非特定產品的安全或療效證明。", "character_count": 661, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42898651/"}]}}, {"id": "n2s-547dd94bb7c8468fdf3f", "title": "Atorvastatin improves hyperlipidemia-induced erectile dysfunction via PKA-associated eNOS phosphorylation at the Ser633 site.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Atorvastatin improves hyperlipidemia-induced erectile dysfunction via PKA-associated eNOS phosphorylation at the Ser633 site.", "publisher": "Sexual medicine", "published_at": "2026-10-18T00:00:00Z", "date_precision": null, "summary": "INTRODUCTION: Hyperlipidemia contributes to vasculogenic erectile dysfunction (ED) by reducing endothelial nitric oxide bioavailability. Although atorvastatin has been reported to improve ED, the upstream mechanism by which it restores endothelial nitric oxide synthase (eNOS) activity remains unclear. This study aimed to evaluate the therapeutic effect of atorvastatin in hyperlipidemia-induced erectile dysfunction (HLED) and to determine whether protein kinase A (PKA)-associated phosphorylation of eNOS at Ser633 contributes to this effect.\nMETHODS: Hyperlipidemia-induced erectile dysfunction was induced in rats by a high-fat diet. Animals received low- or high-dose atorvastatin, with tadalafil as a positive control. Erectile function, serum lipid profiles, oxidative stress, penile fibrosis, and cavernosal eNOS signaling were assessed. In parallel, oxidized low-density lipoprotein (ox-LDL)-injured rat corpus cavernosum endothelial cells (RCECs) were treated with atorvastatin in the presence or absence of the PKA inhibitor H89.\nRESULTS: Atorvastatin improved dyslipidemia, reduced systemic oxidative stress, attenuated penile fibrosis, and partially restored erectile function in HLED rats. Hyperlipidemia-induced erectile dysfunction was associated with decreased eNOS phosphorylation at Ser1177 and Ser633 and increased phosphorylation at Thr495. Atorvastatin enhanced PKA activation and eNOS Ser633 phosphorylation while reducing inhibitory Thr495 phosphorylation in penile tissue. In ox-LDL-treated RCECs, atorvastatin reduced intracellular lipid and ROS accumulation and improved endothelial function, accompanied by increased PKA Thr197 and eNOS Ser633 phosphorylation. These effects were largely blunted by H89.\nDISCUSSION: These findings suggest that atorvastatin ameliorates HLED by restoring endothelial function through a PKA-associated increase in eNOS Ser633 phosphorylation. This upstream endothelial mechanism may complement the action of phosphodiesterase type 5 inhibitors and provide additional benefit for hyperlipidemia-associated vasculogenic ED. The combined in vivo and in vitro design supports mechanistic relevance, although pathway inference relies partly on pharmacological inhibition with H89 and limited time-point analyses. Collectively, our results identify PKA-associated eNOS Ser633 activation as an important mechanism underlying the endothelial-protective effect of atorvastatin in HLED.", "access_scope": "abstract", "pmid": "42894824", "doi": "10.1093/sexmed/qfag094", "url": "https://pubmed.ncbi.nlm.nih.gov/42894824/"}], "drafts": [], "editorial": {"title": "降血脂藥也能改善勃起？別把動物研究當成自己的處方", "text": "阿強最近對勃起狀況有點在意，剛好看到一篇談降血脂藥的研究。他心想：「家裡有人也在吃這個，是不是借來試試看就好？」\n\n可是一想到自己還有其他用藥，他又有些猶豫。新聞裡的實驗結果，和自己該吃什麼藥，中間究竟差了哪些步驟？\n\n【勃起和血管有關，但研究對象要先看清楚】\n\n勃起需要血液流入陰莖，血管內皮的功能是其中一環。血脂異常可能影響血管環境，但勃起困擾也可能涉及神經、荷爾蒙、用藥或心理因素，不能只用一個原因概括。\n\n這篇研究使用高脂飲食造成的勃起障礙大鼠模型，以及大鼠細胞，探討 atorvastatin 的作用。研究觀察到血管訊號與部分勃起功能的變化，提供可能機制的線索。\n\n可以把血管內皮想成協調交通的工作人員，研究想了解某些訊號是否有助維持流量。但在大鼠與細胞看到的反應，不能直接證明人吃同一種藥，就能得到相同改善。\n\n它也不是人體用藥比較試驗，不能拿來決定自行加藥、改劑量，或把降血脂藥當成助勃藥使用。\n\n【自己的狀況，值得做完整評估】\n\n如果勃起問題持續或已造成困擾，可以向醫師說明何時開始、是否突然改變、有哪些慢性疾病，以及目前使用的藥物。不同原因，處理方向也可能不一樣。\n\n已有降血脂處方的人，應依原醫囑使用；沒有處方的人，也不要借家人的藥試效果。若懷疑用藥帶來不適，先和開藥團隊討論，不自行停藥。\n\n生活習慣與心血管風險，也可以納入討論，例如活動、吸菸與飲酒情況。這些需要個別評估，而不是保證只改一項習慣就會恢復。\n\n阿強最後沒有打開家人的藥盒，而是把疑問記下來預約門診。關心研究可以帶來新問題，但照顧自己的第一步，是找到適合自己的判斷，而不是照著別人的藥單嘗試。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依大鼠與細胞機制研究摘要改寫；不能推定人體療效，不支持自行服藥。", "character_count": 665, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42894824/"}, {"title": "NIDDK 勃起功能障礙治療", "url": "https://www.niddk.nih.gov/health-information/urologic-diseases/erectile-dysfunction/treatment"}]}}, {"id": "n2s-448755f3a74887d2ca68", "title": "Exonuclease III-Proofread high-fidelity primer exchange reaction enables ultrasensitive analysis of prostate cancer MicroRNA.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Exonuclease III-Proofread high-fidelity primer exchange reaction enables ultrasensitive analysis of prostate cancer MicroRNA.", "publisher": "Biosensors \u0026 bioelectronics", "published_at": "2026-10-01T00:00:00Z", "date_precision": null, "summary": "The primer exchange reaction (PER) has emerged as a versatile isothermal amplification technique for biosensing, yet its practical application is severely hampered by non-specific hybridization-induced background signals. Here, we report a high-fidelity PER (Hf-PER) strategy that overcomes this limitation through a rationally designed template architecture integrating exonuclease III (Exo III)-mediated target recycling, blocked primer binding, and self-priming amplification. In this design, Exo III strictly discriminates perfectly matched targets from mismatched sequences, while the absence of free primers and magnetic bead separation effectively suppress spurious amplification. Using miR-21, a prostate cancer-associated biomarker, as a model, the Hf-PER assay achieves a remarkable limit of detection of 0.15 fM with a wide dynamic range spanning five orders of magnitude and single-base discrimination capability. The method demonstrates excellent recovery (95.6%-101.2%) in spiked serum samples, high repeatability (CV \u003c 4.5%), and strong concordance with qPCR (R2 > 0.99). Moreover, it successfully distinguishes prostate cancer cells from normal cells and accurately identifies miR-21 elevation in clinical serum samples from prostate cancer patients. By simply reprogramming the recognition domain, this platform can be readily adapted for other nucleic acid biomarkers; as a proof of concept, we further applied the Hf-PER strategy to detect miR-155, achieving a limit of detection of 0.21 fM and comparable specificity, demonstrating excellent versatility. The Hf-PER strategy offers a robust, sensitive, specific, and programmable tool for early cancer diagnosis, liquid biopsy, and point-of-care testing, addressing a critical need for reliable isothermal amplification in complex biological matrices.", "access_scope": "abstract", "pmid": "42830000", "doi": "10.1016/j.bios.2026.119288", "url": "https://pubmed.ncbi.nlm.nih.gov/42830000/"}], "drafts": [], "editorial": {"title": "一小段分子訊號，就能知道有沒有癌症？先看懂新檢驗在研究什麼", "text": "阿哲拿著健檢報告上網查資料，看見一篇提到「超靈敏偵測攝護腺癌相關分子」的研究，心裡又期待又緊張：「是不是只要驗到它，就能知道自己有沒有癌症？」\n\n他把文章反覆看了幾次，才發現裡面談的是一種放大與辨識訊號的方法。檢驗能看得多細，和最後能做出什麼醫療判斷，仍需要分開理解。\n\n【放大訊號，也得避免把雜音一起放大】\n\nmicroRNA 是細胞裡很小的 RNA 分子，其中一些會被研究作為疾病相關線索。這篇研究使用 miR-21 作為示範目標，設計更精確的辨識與放大程序，減少不相關反應造成的背景訊號。\n\n可以把它想成抄寫一段很短的文字：除了讓字變大，也要確認沒有把相似但不一樣的字抄進去，否則越放大，反而越容易誤讀。\n\n研究在實驗樣本與部分臨床血清樣本中評估方法，得到值得進一步探討的分析表現。但能量出分子的差異，不代表已證明可用它單獨診斷所有人的癌症。\n\n從實驗室工具走到常規檢驗，還需要了解不同族群、其他疾病與實際流程中的表現。不能僅憑低偵測極限，就宣稱已能保證早期發現或取代既有診斷。\n\n【別讓新名詞變成新的檢查焦慮】\n\n看到相關商品或檢查時，可以問清楚：它和論文裡的方法是否相同？目前在哪些情況下使用？結果有沒有可能誤判？陽性或陰性之後，會如何安排下一步？\n\n如果已在追蹤攝護腺健康，仍應按照原本計畫回診，不因技術新聞自行取消抽血、影像或其他必要檢查。\n\n也不必因為自己沒做過最新檢驗，就認為照護一定不完整。醫療團隊會依病史、症狀與風險，討論目前有助於決策的工具。\n\n阿哲後來把「我是不是漏做了什麼」改成「這個檢驗能替我回答什麼」。新方法值得關注，但讓每一項檢查都有清楚用途，才是把科技進展用在生活中的方式。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依分子偵測技術研究摘要改寫；未證實可單獨用作常規癌症診斷。", "character_count": 678, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42830000/"}]}}, {"id": "n2s-4329ebeac403ffca12da", "title": "頻繁夜醒尿尿恐非正常老化 醫揭攝護腺4迷思「長期忽略影響大」 - 觸mii", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "頻繁夜醒尿尿恐非正常老化 醫揭攝護腺4迷思「長期忽略影響大」 - 觸mii", "publisher": "觸mii", "published_at": "2026-10-23T03:57:23Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://truemii.chinatimes.com/content/20261023001785-265003", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-26T11:47:50.334832Z", "resolved_by": "curated_registry", "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "半夜一直跑廁所，連好好睡一覺都變成奢望？", "text": "「你昨晚是不是又沒睡好？」\n\n早餐桌上，太太看著阿明打了第三個哈欠。他笑著說：「年紀大了嘛，晚上起來尿尿很正常。」\n\n其實，阿明昨晚才剛睡著，就被尿意叫醒。回到床上，好不容易有了睡意，沒多久又想上廁所。天亮後，他整個人昏沉沉，連最期待的晨間散步都懶得出門。\n\n他最困擾的，已經不只是跑廁所，而是每天都像沒充飽電。\n\n【晚上常起床排尿，是值得留意的身體訊號】\n\n攝護腺位在膀胱下方，包圍著尿液排出的通道，也就是尿道。可以把它想成套在水管外的一圈組織；當它逐漸增大，有時會擠壓通道，讓尿液排出不那麼順暢。\n\n因此，有些人除了夜尿，還會發現尿流變弱、站了一會兒才尿得出來，或上完廁所仍覺得沒有排乾淨。\n\n不過，光憑夜尿，不能直接認定是攝護腺肥大。膀胱問題、飲水習慣等因素，也可能影響排尿，需要一起評估。\n\n同樣地，攝護腺比較大，也不一定代表症狀比較嚴重。醫師會關心的，是你實際怎麼排尿，以及生活受到多少影響。\n\n【想改善，可以先從觀察自己的習慣開始】\n\n睡前是不是習慣喝一大杯茶？白天忙到忘記喝水，晚上才一次補足？試著把水分分散到白天，避免睡前大量飲用，也留意咖啡、茶與酒精是否讓症狀更明顯。\n\n但別為了少跑廁所，就整天不敢喝水。調整飲水時間，和過度限制水分，是兩回事。\n\n也可以記下幾天的飲水時間、排尿次數，以及夜裡起床的情況，就診時帶給醫師參考，比一句「最近比較常尿」更容易說清楚困擾。\n\n如果已經反覆影響睡眠，就值得安排泌尿科評估。治療可能從生活調整開始，也可能需要藥物，並非一看診就得開刀。\n\n下次家人再說「老了就是這樣」，不妨多問一句：「是不是已經讓你睡不好了？」這個小問題，可能就是開始照顧自己的第一步。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依原站衛教及所列官方資料改寫；不取代個別醫療評估。", "character_count": 677, "references": [{"title": "NHS 攝護腺肥大衛教", "url": "https://www.nhs.uk/conditions/enlarged-prostate/"}, {"title": "NIDDK 攝護腺肥大說明", "url": "https://www.niddk.nih.gov/health-information/urologic-diseases/prostate-problems/enlarged-prostate-benign-prostatic-hyperplasia."}, {"title": "觸mii 原始報導", "url": "https://truemii.chinatimes.com/content/20261023001785-265003"}]}}, {"id": "n2s-26612eef7c7eff1146af", "title": "余天跟上洋流！與沈伯洋同場現身 挺友勤跑造勢「復出內情」曝光 - 四季線上4gTV", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "余天跟上洋流！與沈伯洋同場現身 挺友勤跑造勢「復出內情」曝光 - 四季線上4gTV", "publisher": "四季線上4gTV", "published_at": "2026-10-22T04:10:46Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBtOXo3UFd4REttT096S1FNTXNjb2hkQWNTcW4wZFoyU0JmV3Q4MXpwcy1ncXU4ckNMR3JVNmpMVDVwcEdyR0ZEWEV2ek5LdG5PXzhJTHBiOA?oc=5", "retrieval": {"status": "out_of_scope", "method": "none", "checked_at": "2026-10-28T02:21:37.652259Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-01fe58f4e18dd40f2a36", "title": "A novel multiplex digital PCR assay for simultaneous quantification of androgen receptor amplification, mutations, and splice variants in cell-free nucleic acids from metastatic castration-resistant prostate cancer.", "date": "2026-10-23", "status": "blocked", "warning": "禁止發布／流程測試或呼叫結果待釐清；此紀錄僅供稽核。", "revision": 1, "sources": [{"title": "A novel multiplex digital PCR assay for simultaneous quantification of androgen receptor amplification, mutations, and splice variants in cell-free nucleic acids from metastatic castration-resistant prostate cancer.", "publisher": "The journal of liquid biopsy", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "Somatic androgen receptor (AR) alterations including gene amplification, point mutations, and the AR-V7 splice variant occur in 50-70% of patients with metastatic castration-resistant prostate cancer (mCRPC) and drive resistance to AR-pathway inhibitors (ARPIs) in metastatic castration-resistant prostate cancer (mCRPC). However, current liquid biopsy approaches typically require separate cell-free DNA (cfDNA) and cfRNA workflows to evaluate these distinct alteration classes, increasing sample input requirements, assay complexity, and cost. Because plasma cell-free nucleic acid yield is often limited, an integrated assay capable of interrogating DNA and RNA-derived biomarkers from a single blood draw remain an unmet clinical need. Here we describe the development and proof-of-concept validation of a novel multiplex multimodal digital PCR (dPCR) assay that co-detects AR copy-number amplification, somatic point mutations (T878A), and the AR-V7 splice variant from plasma cell-free nucleic acids (cfNAs) in a single streamlined reaction. The assay employs RNase H-dependent PCR (rhPCR) primers with ultra-short amplicons (≤68 bp) that simultaneously interrogate both cfDNA and cfRNA, enabling multimodal detection without separate DNA and RNA workflows. Using prostate cancer cell lines with defined AR alteration status, the assay detected AR amplification at 2% of tumor DNA, quantified T878A mutations at a mutant allele frequency as low as 0.024%, and AR-V7 splicing variant with a sensitivity of 0.096% tumor cell fraction. In two mCRPC patient plasma samples, the assay tracked dynamic changes of these AR variants during ARPI therapy, revealing distinct patterns of clonal evolution that are consistent with treatment pressure and clinical outcomes. This multimodal dPCR platform provides a cost-effective, highly sensitive liquid biopsy tool for detection of clinically significant AR alterations and represents a foundation for a laboratory-developed test (LDT) to guide personalized therapy in mCRPC.", "access_scope": "abstract", "pmid": "42893057", "doi": "10.1016/j.jlb.2026.100672", "url": "https://pubmed.ncbi.nlm.nih.gov/42893057/"}], "drafts": []}];

function editorialCard(e){return e?`<section class="np-card editorial"><button class="np-external-link copy" data-copy="editorial">複製完整文案</button><h3>故事改寫版</h3><p class="meta">更新：${esc(e.updated_at)}｜本文 ${esc(e.character_count)} 字（不含空白）｜待醫療審核</p><p class="np-callout warning">${esc(e.notice)}</p>${storyBody(e.text)}<h4>證據範圍</h4><p class="meta">${esc(e.evidence_note)}</p><h4>醫療查核資料</h4><ul>${e.references.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a></li>`).join('')}</ul></section>`:''}
function retrievalInfo(s){const r=s.retrieval;if(!r)return '';const labels={read:'已取得正文',publisher_url_unresolved:'尚未定位到已核對的原站網址',publisher_not_allowed:'來源尚未加入取文支援',tool_policy_blocked:'平台存取限制，保留來源待處理',robots_blocked:'網站限制自動存取',out_of_scope:'非醫療選題，未擷取正文',publisher_title_mismatch:'原文標題未通過核對',publisher_body_invalid:'未取得可驗證的正文',http_403:'原站拒絕自動讀取',http_429:'原站要求降低讀取頻率'};const methods={publisher_html:'原站正文區塊',publisher_jsonld:'原站結構化正文',pmc_xml:'PMC 官方 XML'};return `<p class="meta">取文：${esc(labels[r.status]||'尚未取得正文，待進一步確認')}${methods[r.method]?'｜'+esc(methods[r.method]):''}${r.resolved_by==='verified_local_import'?'｜本機已核對資料（雲端最近取文未成功）':''}</p>`}

 const drafts=a.drafts.map(d=>`<div class="np-card"><button class="np-external-link copy" data-copy="${esc(d.platform)}">複製文案</button><h3>${({facebook:'FB · Facebook',instagram:'IG · Instagram',threads:'Threads'})[d.platform]||esc(d.platform)} 生成內容</h3><p>${esc(d.text)}</p></div>`).join('');

}
function render(){
 $('np-nav').innerHTML=months.map((m,i)=>`<button class="np-nav-button" data-month="${m}" aria-current="${m===month}"><span class="np-nav-index">${String(i+1).padStart(2,'0')}</span><span>${m.replace('-',' 年 ')} 月</span></button>`).join('');
 const q=$('query').value.trim().toLowerCase(),day=$('date').value;
 visible=records.filter(a=>a.date.startsWith(month)&&(!day||a.date===day)&&(!$('draft-only').checked||hasContent(a))&&(!q||JSON.stringify([a.title,a.sources,a.editorial]).toLowerCase().includes(q)));
 if(!visible.some(a=>a.id===selected))selected=visible[0]?.id;
 $('np-tabs').innerHTML=visible.map(a=>`<button role="tab" id="tab-${a.id}" aria-controls="article-${a.id}" tabindex="${a.id===selected?0:-1}" class="np-tab" data-id="${a.id}" aria-selected="${a.id===selected}">${esc(displayTitle(a))}</button>`).join('');
 renderContent(visible.find(a=>a.id===selected));
 const i=visible.findIndex(a=>a.id===selected);
 $('np-prev').disabled=i<=0;$('np-next').disabled=i<0||i>=visible.length-1;
 $('np-page-count').textContent=`${i+1} / ${visible.length} 題`;
 $('np-progress').style.width=visible.length?`${(i+1)/visible.length*100}%`:'0%';
 $('counts').textContent=`共 ${records.length} 題來源・${records.filter(hasContent).length} 題有文案・故事改寫 ${records.filter(a=>a.editorial).length} 題・目前 ${visible.length} 題`;
 if(selected)history.replaceState(null,'','#'+selected);
}
function dates(){const days=[...new Set(records.filter(a=>a.date.startsWith(month)).map(a=>a.date))].sort().reverse();$('date').innerHTML='<option value="">全部日期</option>'+days.map(d=>`<option>${d}</option>`).join('')}
function jump(){const a=records.find(a=>a.id===location.hash.slice(1));if(a){month=a.date.slice(0,7);selected=a.id;$('query').value='';$('draft-only').checked=false;dates()}render()}
$('np-nav').addEventListener('click',e=>{const b=e.target.closest('[data-month]');if(b){month=b.dataset.month;dates();render()}});
$('np-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){selected=b.dataset.id;render();$('tab-'+selected).focus()}});
for(const id of ['date','draft-only'])$(id).addEventListener('change',render);
$('query').addEventListener('input',render);
function move(delta){const i=visible.findIndex(a=>a.id===selected),a=visible[i+delta];if(a){selected=a.id;render()}}
$('np-prev').onclick=()=>move(-1);$('np-next').onclick=()=>move(1);
$('np-tabs').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();if(e.key==='Home')selected=visible[0]?.id;else if(e.key==='End')selected=visible.at(-1)?.id;else move(e.key==='ArrowRight'?1:-1);render();$('tab-'+selected)?.focus()}});
$('np-stage').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const a=records.find(a=>a.id===selected);const d=b.dataset.copy==='editorial'?{text:a.editorial.title+'\n\n'+a.editorial.notice+'\n\n'+a.editorial.text+'\n\n證據範圍：'+a.editorial.evidence_note+'\n\n醫療查核資料：\n'+a.editorial.references.map(r=>r.title+'：'+r.url).join('\n')}:a.drafts.find(d=>d.platform===b.dataset.copy);try{await navigator.clipboard.writeText(d.text);b.textContent='已複製'}catch{b.textContent='請選取下方文字複製'}});
window.addEventListener('hashchange',jump);dates();jump();
</script>
</body></html>
