<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="男性泌尿科新聞與研究來源，及 FB、IG、Threads 待審草稿資料庫。">
<title>男性泌尿科｜新聞與社群衛教資料庫</title>
<style>

.np-root,
.np-root * {
  box-sizing: border-box;
}

.np-root {
  --np-navy: #2f4f9f;
  --np-blue: #536df5;
  --np-blue-2: #6d83ff;
  --np-ink: #18305f;
  --np-muted: #64759a;
  --np-sky: #eaf2ff;
  --np-paper: #fbfcff;
  --np-line: #c9d7f4;
  --np-soft-line: #e1e9fa;
  --np-coral: #ff755f;
  --np-green: #2f8a5b;
  --np-red-soft: #fff0ed;
  --np-shadow: 0 18px 46px rgba(28, 53, 111, 0.14);

  width: calc(100% - 32px);
  max-width: 1800px;
  margin: 16px auto;

  position: relative;
  overflow: hidden;

  border: 1px solid rgba(47, 79, 159, 0.14);
  border-radius: 28px;

  background:
    radial-gradient(circle at 8% 7%, rgba(83,109,245,.12), transparent 25rem),
    linear-gradient(145deg, #f5f8ff 0%, #fbfcff 52%, #eef3ff 100%);

  color: var(--np-ink);

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  box-shadow: var(--np-shadow);
  line-height: 1.7;
}

.np-root button,
.np-root input,
.np-root select,
.np-root textarea {
  font: inherit;
}

.np-root img,
.np-root iframe {
  max-width: 100%;
}

.np-root a {
  color: var(--np-blue);
}

.np-root a:hover {
  color: var(--np-navy);
}

/* Header */

.np-root .np-masthead {
  position: relative;
  min-height: 122px;

  display: flex;
  align-items: center;
  gap: 20px;

  padding: 22px 30px;

  color: #fff;

  background:
    linear-gradient(
      112deg,
      var(--np-navy) 0 57%,
      #3e60c8 57% 72%,
      var(--np-blue) 72% 100%
    );

  overflow: hidden;
}

.np-root .np-masthead::after {
  content: "";
  position: absolute;
  right: 10%;
  top: -20%;
  width: 160px;
  height: 140%;
  border-left: 7px solid rgba(255,255,255,.9);
  border-right: 7px solid rgba(255,255,255,.9);
  transform: skewX(-38deg);
  opacity: .88;
  pointer-events: none;
}

.np-root .np-brand-icon {
  flex: 0 0 auto;
  width: 72px;
  height: 72px;

  display: grid;
  place-items: center;

  border: 2px solid rgba(255,255,255,.75);
  border-radius: 20px 5px 20px 5px;

  background: rgba(255,255,255,.12);

  font-size: max(20px, 2rem);
}

.np-root .np-titleblock {
  position: relative;
  z-index: 1;
  min-width: 0;
}

.np-root .np-titleblock h1 {
  margin: 0;
  font-size: max(20px, clamp(1.5rem, 3vw, 2.45rem));
  line-height: 1.25;
  letter-spacing: .06em;
}

.np-root .np-titleblock p {
  margin: 8px 0 0;
  font-size: max(20px, clamp(.82rem, 1.4vw, 1rem));
  font-weight: 700;
  letter-spacing: .14em;
  opacity: .86;
}

/* Layout */

.np-root .np-layout {
  display: grid;
  grid-template-columns: clamp(230px, 17vw, 300px) minmax(0, 1fr);
  min-height: calc(100vh - 170px);
}

.np-root .np-sidebar {
  padding: 20px 14px 26px;

  border-right: 1px solid var(--np-line);

  background:
    linear-gradient(
      180deg,
      rgba(234,242,255,.94),
      rgba(247,250,255,.98)
    );
}

.np-root .np-sidebar-title {
  margin: 0 8px 12px;
  color: var(--np-muted);
  font-size: max(20px, .73rem);
  font-weight: 900;
  letter-spacing: .18em;
}

.np-root .np-nav {
  display: grid;
  gap: 6px;
}

.np-root .np-nav-button {
  width: 100%;
  min-height: 44px;

  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  align-items: center;
  gap: 8px;

  padding: 7px 9px;

  border: 0;
  border-radius: 14px 5px 14px 5px;

  color: #294274;
  background: transparent;

  text-align: left;
  cursor: pointer;

  transition:
    transform .18s ease,
    background .18s ease,
    color .18s ease,
    box-shadow .18s ease;
}

.np-root .np-nav-button:hover {
  background: #fff;
  transform: translateX(3px);
}

.np-root .np-nav-button[aria-current="true"] {
  color: #fff;
  background: linear-gradient(110deg, var(--np-navy), #4565cb);
  box-shadow: 0 9px 20px rgba(47,79,159,.2);
}

.np-root .np-nav-index {
  width: 29px;
  height: 29px;

  display: grid;
  place-items: center;

  border: 1px solid currentColor;
  border-radius: 9px 3px 9px 3px;

  font-size: max(20px, .72rem);
  font-weight: 900;
}

.np-root .np-nav-label {
  overflow: hidden;
  font-size: max(20px, .83rem);
  font-weight: 800;
  line-height: 1.25;
  text-overflow: ellipsis;
}

.np-root .np-main {
  min-width: 0;
  padding: 20px 22px 28px;
}

/* Tabs */

.np-root .np-tabs-wrap {
  margin-bottom: 15px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--np-line);
}

.np-root .np-tabs {
  display: flex;
  gap: 8px;

  padding: 1px 1px 8px;

  overflow-x: auto;
  scrollbar-width: thin;
}

.np-root .np-tab {
  flex: 0 0 auto;

  min-height: 39px;
  padding: 8px 14px;

  border: 1px solid var(--np-line);
  border-radius: 14px 5px 14px 5px;

  color: #395181;
  background: #fff;

  font-size: max(20px, .82rem);
  font-weight: 800;

  cursor: pointer;
}

.np-root .np-tab:hover {
  border-color: #95aae4;
  color: var(--np-navy);
}

.np-root .np-tab[aria-selected="true"] {
  color: #fff;
  border-color: var(--np-blue);
  background: var(--np-blue);
}

/* Stage */

.np-root .np-stage {
  position: relative;

  padding: clamp(14px, 2.2vw, 24px);

  border: 1px solid rgba(47,79,159,.14);
  border-radius: 24px 7px 24px 7px;

  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(
      135deg,
      rgba(83,109,245,.30),
      rgba(47,79,159,.04)
    ) border-box;

  min-height: clamp(560px, 68vh, 920px);
}

.np-root .np-page {
  display: none;
}

.np-root .np-page.is-active {
  display: block;
  animation: npFade .25s ease;
}

@keyframes npFade {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.np-root .np-page-head {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  margin-bottom: 20px;
}

.np-root .np-page-number {
  flex: 0 0 auto;

  min-width: 48px;
  height: 48px;

  display: grid;
  place-items: center;

  padding: 0 10px;

  border-radius: 15px 4px 15px 4px;

  color: #fff;
  background: linear-gradient(135deg, var(--np-navy), var(--np-blue));

  font-weight: 900;
  font-size: max(20px, .86rem);
}

.np-root .np-page-head h2 {
  margin: 0;
  color: var(--np-ink);
  font-size: max(20px, clamp(1.35rem, 2.7vw, 2rem));
  line-height: 1.3;
}

.np-root .np-page-head p {
  margin: 4px 0 0;
  color: var(--np-muted);
  font-size: max(20px, .9rem);
}

.np-root .np-section {
  scroll-margin-top: 16px;
}

.np-root .np-section h3 {
  margin: 0 0 13px;
  padding-bottom: 9px;

  border-bottom: 2px solid var(--np-sky);

  color: var(--np-navy);

  font-size: max(20px, clamp(1.05rem, 2vw, 1.3rem));
}

.np-root .np-section h4 {
  margin: 18px 0 8px;
  color: var(--np-ink);
}

/* Cards */

.np-root .np-card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.np-root .np-card {
  min-width: 0;
  padding: 18px;

  border: 1px solid var(--np-soft-line);
  border-radius: 18px 5px 18px 5px;

  background: #fff;

  box-shadow: 0 9px 24px rgba(29,52,103,.07);
}

.np-root .np-card h4 {
  margin: 0 0 7px;
  color: var(--np-navy);
}

.np-root .np-callout {
  margin: 16px 0;
  padding: 16px 18px;

  border-left: 5px solid var(--np-blue);
  border-radius: 4px 14px 14px 4px;

  background: var(--np-sky);

  font-weight: 700;
}

.np-root .np-callout.warning {
  border-left-color: var(--np-coral);
  background: var(--np-red-soft);
}

.np-root .np-callout.success {
  border-left-color: var(--np-green);
  background: #edf9f3;
}

.np-root .np-quote {
  margin: 16px 0;
  padding: 16px 20px;

  border-left: 5px solid var(--np-coral);

  background: linear-gradient(135deg, #fff7f4, #fff);

  color: #6f3f36;

  font-size: max(20px, 1.04rem);
  font-weight: 800;
}

.np-root .np-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;

  margin: 15px 0;
}

.np-root .np-keyword {
  padding: 8px 13px;

  border: 1px solid #b8c9f4;
  border-radius: 999px;

  background: #f7f9ff;

  color: var(--np-navy);

  font-weight: 800;
}

/* Message */

.np-root .np-message {
  overflow: hidden;

  border: 1px solid var(--np-line);
  border-radius: 18px 5px 18px 5px;

  background: #fff;
}

.np-root .np-message-head {
  padding: 10px 14px;

  color: #fff;
  background: linear-gradient(110deg, var(--np-navy), #4e6bd2);

  font-size: max(20px, .82rem);
  font-weight: 800;
}

.np-root .np-message-body {
  padding: 18px;
  white-space: pre-line;
}

.np-root .np-fake-action {
  display: inline-block;
  margin-top: 10px;
  padding: 9px 15px;

  border-radius: 8px;

  background: var(--np-coral);
  color: #fff;

  font-weight: 900;
}

/* Images */

.np-root .np-image-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 15px;
}

.np-root .np-image-card {
  margin: 0;
  padding: 10px;

  border: 1px solid var(--np-line);
  border-radius: 18px 5px 18px 5px;

  background: #fff;
}

.np-root .np-image-card img {
  width: 100%;
  height: auto;
  display: block;

  border-radius: 12px 4px 12px 4px;

  object-fit: contain;
}

.np-root .np-image-card figcaption {
  padding: 9px 5px 2px;

  color: var(--np-muted);
  font-size: max(20px, .8rem);
  font-weight: 800;
  text-align: center;
}

/* Embedded media */

.np-root .np-embed-box {
  margin: 15px 0;

  overflow: hidden;

  border: 1px solid var(--np-line);
  border-radius: 18px 5px 18px 5px;

  background: #f5f8ff;
}

.np-root .np-embed-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  padding: 10px 14px;

  border-bottom: 1px solid var(--np-line);

  background: #edf3ff;
}

.np-root .np-embed-title {
  min-width: 0;

  color: var(--np-ink);
  font-weight: 900;
  font-size: max(20px, .88rem);
}

.np-root .np-external-link {
  flex: 0 0 auto;

  display: inline-flex;
  align-items: center;
  gap: 5px;

  padding: 6px 10px;

  border: 1px solid #aabce9;
  border-radius: 9px 3px 9px 3px;

  color: var(--np-navy) !important;
  background: #fff;

  font-size: max(20px, .75rem);
  font-weight: 900;
  text-decoration: none;
}

.np-root .np-video {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;

  background: #0c1630;
}

.np-root .np-video iframe {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  display: block;

  border: 0;
}

.np-root .np-site-frame {
  width: 100%;
  height: clamp(520px, 70vh, 900px);

  display: block;

  border: 0;

  background: #fff;
}

.np-root .np-site-note {
  padding: 10px 14px;

  border-top: 1px solid var(--np-line);

  color: var(--np-muted);

  background: #fbfcff;

  font-size: max(20px, .75rem);
}

/* Tables */

.np-root .np-table-wrap {
  width: 100%;
  overflow-x: auto;

  margin: 15px 0;

  border: 1px solid var(--np-line);
  border-radius: 15px 5px 15px 5px;
}

.np-root .np-table {
  width: 100%;
  min-width: 720px;

  border-collapse: collapse;

  background: #fff;
}

.np-root .np-table th,
.np-root .np-table td {
  padding: 11px 12px;

  border-bottom: 1px solid #e2e9f7;

  vertical-align: top;
  text-align: left;
}

.np-root .np-table th {
  color: #fff;
  background: var(--np-navy);

  font-size: max(20px, .82rem);
}

.np-root .np-table td {
  font-size: max(20px, .86rem);
}

.np-root .np-table tr:last-child td {
  border-bottom: 0;
}

.np-root .np-table tr:nth-child(even) td {
  background: #f8faff;
}

/* Attack chain */

.np-root .np-chain {
  display: grid;
  grid-template-columns:
    minmax(0,1fr) auto
    minmax(0,1fr) auto
    minmax(0,1fr) auto
    minmax(0,1fr) auto
    minmax(0,1fr);

  align-items: center;
  gap: 8px;

  margin: 25px 0;
}

.np-root .np-chain-step {
  min-height: 94px;

  display: grid;
  place-items: center;

  padding: 12px;

  border: 1px solid #b9c9ee;
  border-radius: 17px 5px 17px 5px;

  background: linear-gradient(145deg, #fff, #edf3ff);

  color: var(--np-navy);

  font-weight: 900;
  text-align: center;
}

.np-root .np-chain-arrow {
  color: var(--np-coral);
  font-size: max(20px, 1.4rem);
  font-weight: 900;
}

/* Stop Check Verify */

.np-root .np-scv {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 14px;

  margin: 18px 0;
}

.np-root .np-scv-card {
  padding: 18px;

  border: 1px solid var(--np-line);
  border-radius: 19px 5px 19px 5px;

  background: #fff;
}

.np-root .np-scv-letter {
  width: 48px;
  height: 48px;

  display: grid;
  place-items: center;

  margin-bottom: 10px;

  border-radius: 14px 4px 14px 4px;

  color: #fff;
  background: var(--np-blue);

  font-size: max(20px, 1.2rem);
  font-weight: 900;
}

.np-root .np-scv-card:nth-child(1) .np-scv-letter {
  background: var(--np-coral);
}

.np-root .np-scv-card:nth-child(3) .np-scv-letter {
  background: var(--np-green);
}

/* Puzzle */

.np-root .np-puzzle {
  display: grid;
  gap: 10px;
}

.np-root .np-puzzle-step {
  position: relative;

  padding: 14px 15px 14px 56px;

  border: 1px solid var(--np-line);
  border-radius: 15px 5px 15px 5px;

  background: #fff;
}

.np-root .np-puzzle-step::before {
  content: attr(data-step);

  position: absolute;
  left: 13px;
  top: 13px;

  width: 29px;
  height: 29px;

  display: grid;
  place-items: center;

  border-radius: 9px 3px 9px 3px;

  color: #fff;
  background: var(--np-blue);

  font-size: max(20px, .75rem);
  font-weight: 900;
}

/* Checklist */

.np-root .np-check-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;

  padding: 0;
  margin: 0;

  list-style: none;
}

.np-root .np-check-list li {
  position: relative;

  padding: 12px 14px 12px 42px;

  border: 1px solid var(--np-soft-line);
  border-radius: 13px 4px 13px 4px;

  background: #fff;
}

.np-root .np-check-list li::before {
  content: "✓";

  position: absolute;
  left: 13px;
  top: 10px;

  color: var(--np-green);

  font-weight: 900;
}

/* Prompt */

.np-root .np-prompt {
  position: relative;

  margin: 15px 0;
  padding: 18px;

  overflow-x: auto;

  border-radius: 14px 4px 14px 4px;

  color: #eaf2ff;
  background: #17264b;

  font-family:
    "JetBrains Mono",
    Consolas,
    "Microsoft JhengHei",
    monospace;

  white-space: pre-wrap;
}

/* Controls */

.np-root .np-controls {
  display: grid;
  grid-template-columns: 48px minmax(0,1fr) 48px;
  align-items: center;
  gap: 12px;

  margin-top: 17px;
}

.np-root .np-control {
  width: 48px;
  height: 42px;

  display: grid;
  place-items: center;

  border: 1px solid var(--np-line);
  border-radius: 14px 5px 14px 5px;

  color: var(--np-navy);
  background: #fff;

  font-size: max(20px, 1.2rem);
  font-weight: 900;

  cursor: pointer;
}

.np-root .np-control:hover:not(:disabled) {
  color: #fff;
  background: var(--np-navy);
}

.np-root .np-control:disabled {
  opacity: .3;
  cursor: default;
}

.np-root .np-progress {
  height: 8px;

  overflow: hidden;

  border-radius: 999px;
  background: #e4ebfa;
}

.np-root .np-progress-bar {
  width: 0;
  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      var(--np-navy),
      var(--np-blue),
      var(--np-coral)
    );

  transition: width .22s ease;
}

.np-root .np-page-count {
  grid-column: 2;
  justify-self: center;

  margin-top: -6px;

  color: var(--np-muted);

  font-size: max(20px, .74rem);
  font-weight: 900;
  letter-spacing: .12em;
}

/* Footer */

.np-root .np-footer {
  padding: 16px 22px;

  border-top: 1px solid var(--np-line);

  color: var(--np-muted);
  background: #f0f5ff;

  font-size: max(20px, .76rem);
  text-align: center;
}

/* Accessibility */

.np-root .np-nav-button:focus-visible,
.np-root .np-tab:focus-visible,
.np-root .np-control:focus-visible,
.np-root .np-external-link:focus-visible {
  outline: 3px solid rgba(255,117,95,.5);
  outline-offset: 2px;
}

/* Wide desktop / 16:9 classroom displays */

@media (min-width: 1440px) {

  .np-root {
    width: calc(100% - 48px);
    max-width: 1800px;
  }

  .np-root .np-main {
    padding: 24px 28px 32px;
  }

  .np-root .np-stage {
    padding: clamp(20px, 1.8vw, 32px);
  }

  .np-root .np-page-head h2 {
    font-size: max(20px, clamp(1.55rem, 2vw, 2.2rem));
  }
}


/* Tablet */

@media (max-width: 980px) {

  .np-root {
    border-radius: 20px;
  }

  .np-root .np-layout {
    grid-template-columns: 190px minmax(0,1fr);
  }

  .np-root .np-main {
    padding: 15px;
  }

  .np-root .np-card-grid {
    grid-template-columns: 1fr;
  }

  .np-root .np-chain {
    grid-template-columns: 1fr;
  }

  .np-root .np-chain-arrow {
    transform: rotate(90deg);
    text-align: center;
  }
}

/* Mobile */

@media (max-width: 720px) {

  .np-root {
    width: 100%;
    margin: 0 auto;
    border-radius: 14px;
  }

  .np-root .np-masthead {
    min-height: 92px;
    padding: 15px;
  }

  .np-root .np-brand-icon {
    width: 52px;
    height: 52px;

    border-radius: 14px 4px 14px 4px;

    font-size: max(20px, 1.4rem);
  }

  .np-root .np-titleblock h1 {
    letter-spacing: .02em;
  }

  .np-root .np-titleblock p {
    display: none;
  }

  .np-root .np-layout {
    display: block;
    min-height: 0;
  }

  .np-root .np-sidebar {
    padding: 10px;

    border-right: 0;
    border-bottom: 1px solid var(--np-line);
  }

  .np-root .np-sidebar-title {
    display: none;
  }

  .np-root .np-nav {
    display: flex;
    gap: 6px;

    overflow-x: auto;

    padding-bottom: 5px;
  }

  .np-root .np-nav-button {
    flex: 0 0 auto;

    width: auto;
    max-width: 170px;
  }

  .np-root .np-nav-label {

'use strict';
const records=[{"id": "n2s-d80d985433e7b1359f2c", "title": "Early and late CTCAE and patient-reported outcomes following breast radiotherapy in the REQUITE cohort.", "date": "2026-10-28", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Early and late CTCAE and patient-reported outcomes following breast radiotherapy in the REQUITE cohort.", "publisher": "Clinical and translational radiation oncology", "published_at": "2026-10-07T00:00:00Z", "date_precision": null, "summary": "PURPOSE: The international REQUITE study and its follow-up studies (RADprecise/REQUITEplus) prospectively collected longitudinal data from patients undergoing radiotherapy for breast, prostate, or lung cancer. We present data from 2057 women with breast cancer, describing patient-reported outcomes and acute and late adverse effects.\nMETHODS: Patients were recruited between April 2014 and October 2016. Eligible patients received external-beam photon radiotherapy after breast-conserving surgery, had no metastasis at inclusion, no other malignancy within the previous five years, and no prior breast irradiation. Blood samples were collected before radiotherapy for genotyping, molecular analysis, and biobanking. Standardised assessments included CTCAE v4, EORTC QLQ-C30 and BR23, MFI, GPAQ, and DICOM/DVH data. Follow-up continued annually for two years, extending to eight years at eligible sites.\nRESULTS: Acute side effects peaked at end of radiotherapy, with erythema in 83-89% of patients. Grade ≥ 2 acute effects, including pain (11% versus 4.3%) and skin ulceration (4.8% versus 0.8%), were more frequent with normofractionation than hypofractionation. Grade ≥ 2 late effects affected between 0.6% and 16.8% of patients; skin induration was the most frequent late effect. Patient-reported outcome scores varied over time, with functional scale scores at two years similar to or higher than at baseline.\nCONCLUSION: REQUITE provides real-world evidence of acute and late outcomes following normo- and hypofractionation, broadly consistent with published randomised trials. The dataset, combining clinical adverse effects, quality of life, dosimetric, and genetic data, is a resource for personalised radiotherapy research (www.requite.eu).", "access_scope": "abstract", "pmid": "42935767", "doi": "10.1016/j.ctro.2026.101307", "url": "https://pubmed.ncbi.nlm.nih.gov/42935767/"}], "drafts": [{"platform": "facebook", "text": "乳癌治療後的生活品質與副作用一直是大家關心的話題。近期一項國際研究關注接受放射治療的乳癌患者，探討療程中的急性與長期反應。✨\n\n這項研究納入了 2057 名接受乳房保留手術及放射治療的女性乳癌患者，追蹤其真實世界的健康狀況與副作用。研究發現：\n\n📌 急性副作用通常在放射治療結束時達到高峰，其中紅斑發生率約在 83% 到 89% 之間。\n📌 與常規分割放射治療相比，大分割放射治療在部分 2 級以上的急性反應（如疼痛與皮膚潰瘍）發生率相對較低。\n📌 追蹤至兩年時，患者回報的功能量表分數與治療前相似或更高。\n\n這類真實世界的數據有助於醫學界更了解不同療程的副作用表現。大家身邊也有正在經歷治療或在陪伴患者的朋友嗎？歡迎在底下留言分享你的看法。💙\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42935767/"}, {"platform": "instagram", "text": "乳癌放射治療後會有什麼樣的身體反應呢？💡 國際大型研究追蹤了兩千多名女性乳癌患者，帶大家看看真實世界的觀察記錄：\n\n✨ 急性副作用觀察\n・急性副作用多在治療結束時達到高峰\n・紅斑發生率約為 83% 至 89%\n・常規分割治療在 2 級以上的急性疼痛與皮膚潰瘍發生率，高於大分割放射治療\n\n✨ 長期追蹤表現\n・2 級以上的長期副作用發生率在 0.6% 到 16.8% 之間，其中以皮膚硬結較為常見\n・兩年時的生活品質與功能分數與治療前相當或更好\n\n醫療數據能幫助我們對療程有更多認識。點進主頁連結或分享給需要的朋友，一起關注健康知識吧！🌟\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42935767/"}, {"platform": "threads", "text": "乳癌放射治療後的身體反應是許多人的疑問。一項針對兩千多名乳癌患者的國際研究指出，急性副作用多在治療結束時達到高峰，其中紅斑最為常見。研究也比較了不同療程的 2 級以上急性反應，並發現追蹤到兩年時，患者的功能量表分數與治療前相似或更高。大家平時會關注這類的醫療研究新知嗎？💬\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42935767/"}]}, {"id": "n2s-8170c976d47485a5bcbf", "title": "Understanding patient perspectives and preferences on sildenafil orodispersible formulation: a survey-based evaluation of men using erectile dysfunction medications.", "date": "2026-10-28", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Understanding patient perspectives and preferences on sildenafil orodispersible formulation: a survey-based evaluation of men using erectile dysfunction medications.", "publisher": "Sexual medicine", "published_at": "2026-10-26T00:00:00Z", "date_precision": null, "summary": "BACKGROUND: Erectile dysfunction (ED) is a common disease condition with major psychosocial and clinical consequences. Over 50% of men aged 40 years and above are estimated to experience some level of ED. Phosphodiesterase type 5 inhibitors (PDE5Is) remain the mainstay of ED treatment. Sildenafil citrate orodispersible film (ODF) is a novel formulation designed to improve convenience and patient satisfaction. This study explored real-world perspectives and patient preferences regarding the use of sildenafil citrate ODF.\nMETHODS: A cross-sectional, web-based survey was conducted in Italy (September-November 2024) in adult men using prescription ED medications. Data on demographics, lifestyle, clinical condition, treatment experiences, and patient perceptions about PDE5Is with a focus on sildenafil ODF were collected.\nRESULTS: The survey included 276 men (mean age 47 years; 43.5% Viagra users, 25% Cialis users, 13.4% other branded ED medication users, and 18.1% generic ED medication users). Most were married (51%), employed (78%), and reported at least one comorbidity (75%), predominantly cardiovascular (53%). Film-coated tablets of PDE5 inhibitors were the most used formulation (72%), while 5% reported sildenafil ODF use.Awareness of sildenafil ODF was high, with valued attributes including water-free administration, portability, discretion, and faster perceived onset of action. Among overall ED medication users, 79% expressed willingness to adopt sildenafil ODF with 33% citing liking of the formulation and 28% citing perceived difference from already using medication. The main barrier to adoption was high cost compared to other ED medications, cited by 37% of the 21% participants who did not express willingness to adopt sildenafil ODF.\nCONCLUSION: Sildenafil ODF was widely perceived by patients as a discreet and practical alternative to conventional film-coated tablets, with high willingness for adoption. Aligning treatment choices with patient preferences may enhance adherence, satisfaction, and overall quality of life in ED management.", "access_scope": "abstract", "pmid": "42936858", "doi": "10.1093/sexmed/qfag095", "url": "https://pubmed.ncbi.nlm.nih.gov/42936858/"}], "drafts": [{"platform": "facebook", "text": "每次談到男性的健康話題，總让人觉得有些难以开口，但其实這在日常生活中非常普遍。😊 根據一項針對義大利成年男性用藥者的橫斷面網路調查發現，勃起功能障礙（ED）的治療與患者的真實生活體驗息息相關。研究顯示，在受訪的兩百七十六位男性中，多數人對於新型的西地那非口溶膜（ODF）有相當高的認知度，並看重其不需要配水服用、方便攜帶、具隱蔽性以及感受上較快的起效特點。 💊 在這次調查中，有高達百分之七十九的整體用藥者表達了願意嘗試口溶膜的意願，主要原因包含喜歡這種劑型或感受到與以往用藥的不同。不過，也有部分受訪者指出，相較於其他藥品，較高的花費是主要的考量因素。 💡 這項研究提醒我們，了解患者在日常生活中的真實偏好與考量，有助於在醫療討論中選擇最適合的選項。大家平時在閱讀這類醫療健康資訊時，通常最重視便利性還是其他考量呢？歡迎留言分享你的看法！💬\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42936858/"}, {"platform": "instagram", "text": "身邊有男性朋友或自己曾默默關心過男性健康問題嗎？🤔 其實這是一個很常見的健康狀況，多數人都可能在生活中面臨類似困擾。這篇來自義大利的網路調查分享了患者對於不同劑型選擇的真實看法！ 📊 ✨ 關於新型口溶膜（ODF）調查的幾個亮點： 🔹 高認知度與便利性：受訪者認為其具備不用配水服用、方便攜帶、隱蔽性高以及感受上較快起效的特點。 🔹 意願與考量：多數受訪的用藥者表示願意嘗試此劑型，但也有些朋友提到較高的價格是主要的考量門檻。 💬 每個人的生活習慣與需求都不同，醫療選擇也需要多方考量。你在選擇相關健康產品時，最看重的是哪一項特點呢？快把這篇收藏起來，和朋友一起關注男性健康話題吧！🌟\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42936858/"}, {"platform": "threads", "text": "大家平時在關注男性健康資訊時，會特別注意用藥的便利性與隱蔽性嗎？🧐 最近有一項針對義大利成年男性的網路調查發現，多數受訪者對於不用配水服用、方便攜帶的口溶膜劑型有高度的認知與嘗試意願，但也指出價格是主要的考量點之一。了解不同劑型的特點與患者需求，有助於在日常生活中找到最適合的應對方式。大家怎麼看呢？👇💬\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42936858/"}]}, {"id": "n2s-63344fe0f3c9a3260567", "title": "別補過頭！醫推「保養攝護腺」3飲食 預防肥大、改善排尿障礙 - TVBS新聞網", "date": "2026-10-28", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "別補過頭！醫推「保養攝護腺」3飲食 預防肥大、改善排尿障礙 - TVBS新聞網", "publisher": "TVBS新聞網", "published_at": "2026-10-25T07:51:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://news.tvbs.com.tw/health/4041050", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-26T11:47:15.778006Z", "resolved_by": "curated_registry", "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "天冷就想喝補湯？先留意餐桌上的酒精與排尿困擾", "text": "天氣一涼，阿德最期待的就是週末和朋友吃薑母鴨。湯一碗接一碗，回家卻開始一直跑廁所，晚上也睡不安穩。太太提醒他少喝一點，他還笑說：「這是在補身體，應該越補越好吧？」\n\n其實，他平常就有排尿變慢的困擾，只是一直沒認真處理。這頓飯讓他開始想，自己需要的到底是多喝一碗湯，還是先了解身體在發生什麼事？\n\n【飲食習慣可能影響症狀，食物卻不能代替治療】\n\n攝護腺位在膀胱下方，增大時可能壓迫尿道，讓人尿流變弱、容易頻尿，或夜裡常起床。每個人的症狀不同，也不能只憑聚餐後上廁所變多，就認定是攝護腺肥大。\n\n本次補讀的新聞提醒民眾不要過度進補，並提到番茄、豆製品與堅果等飲食選擇。但這是一篇醫師衛教報導，不是證明吃某種食物就能縮小攝護腺的人體試驗。\n\n因此，可以把這些食物當成日常飲食的選項，卻不必相信「吃了就能預防肥大」的保證。原報導對食物成分的描述，也不等於個別患者已獲證實的治療效果。\n\n【比起拚命補，先觀察哪些習慣讓自己不舒服】\n\n酒精和咖啡因可能讓排尿症狀更明顯。聚餐時，可以留意湯品是否含酒、自己喝了多少，以及睡前是否又大量補水；有變化時，把情況記下來和醫師討論。\n\n白天仍要適當補充水分，不要為了少跑廁所就整天不喝水。如果因心臟或腎臟疾病有飲水限制，則依原照護團隊的建議安排，不自行套用別人的方法。\n\n若排尿困擾持續影響睡眠或出門活動，值得安排門診評估。突然完全尿不出來、血尿或明顯疼痛，更不能只靠忌口或補品處理。\n\n阿德後來還是會和朋友聚餐，只是願意放慢喝湯的速度，也把一直沒說的症狀帶進診間。照顧身體不必靠某一道神奇料理，從留意自己的反應、找出合適做法開始，就很實際。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依 TVBS 與中天公開原站正文及 NHS 衛教改寫；飲食報導不是食物治療攝護腺肥大的臨床證明。", "character_count": 665, "references": [{"title": "TVBS 原始報導", "url": "https://news.tvbs.com.tw/health/4041050"}, {"title": "中天原始報導", "url": "https://ctinews.com/news/items/KwnKLE0YWY"}, {"title": "NHS 攝護腺肥大衛教", "url": "https://www.nhs.uk/conditions/enlarged-prostate/"}]}}, {"id": "n2s-ecc9799ca2646cdbcc92", "title": "男性無性行為精液卻溢出？醫師：恐是攝護腺發炎| 生活 - 三立新聞", "date": "2026-10-28", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "男性無性行為精液卻溢出？醫師：恐是攝護腺發炎| 生活 - 三立新聞", "publisher": "三立新聞", "published_at": "2026-10-26T18:25:04Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiR0FVX3lxTE8xQ3RraHFfX0JpN2k1RWgzUktTd2h5VzZDVGVQUzI3TXFvci1JNk5FOEdrUXdVbE5EZXhmZVpfMUtHTERHX2xR?oc=5", "r d": null, "doi": null, "url": "https://www.cdns.com.tw/articles/1479312", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-26T11:33:20.408236Z", "resolved_by": "verified_local_import", "last_attempt_status": "http_403"}}], "drafts": [], "editorial": {"title": "癌症治療期間背痛越來越明顯，別只當作姿勢不好", "text": "阿芬正在接受癌症追蹤，最近常覺得背痛。她原本以為是坐太久，換了椅墊、調整睡姿，卻還是三不五時痛醒。家人問她要不要提早回診，她怕大家擔心，總說：「可能休息一下就好。」\n\n直到她發現走路也比以前吃力，才願意把這些變化一起說出來。對正在治療或追蹤癌症的人來說，新的疼痛型態與功能變化，值得讓照護團隊及早知道。\n\n【背痛有很多原因，病史是重要的判斷背景】\n\n多數人都曾經腰痠背痛，但不能只靠疼痛感覺，自己分辨是不是腫瘤。脊椎附近有重要神經，如果病變影響骨骼或壓迫神經，除了痛，也可能出現麻木、無力與走路困難。\n\n本次補讀的中華新聞雲報導，描述一名癌症病人在持續背痛及下肢功能變化後，檢查發現脊椎轉移。醫療團隊提醒，癌症患者若疼痛持續惡化，不能一直當作一般痠痛處理。\n\n這是個案新聞，不表示背痛就等於癌症轉移，也不能由一個人的治療方式，推論所有人都需要同樣手術。實際原因與處理，仍要依檢查結果評估。\n\n【合併無力或大小便改變，應立即尋求協助】\n\n如果有癌症病史，又出現新的手腳無力、感覺異常、走路困難，或排尿排便功能改變，應立即聯絡照護團隊或前往急診評估，不要等到下次例行門診。\n\n這些變化可能涉及需要緊急處理的神經壓迫。即使還不確定原因，也應先讓醫療人員判斷，而不是在家反覆推拿、硬撐活動或自行增加止痛藥。\n\n若是新的背痛持續不退，尤其夜裡痛醒或越來越痛，也要盡快向團隊反映，說清楚開始時間、疼痛位置，以及生活功能受到哪些影響。\n\n阿芬後來把怕麻煩家人的想法放下，和家人一起整理症狀。主動說出變化，不是在製造恐慌，而是讓需要處理的問題有機會被及時發現，也讓照護更貼近自己的生活。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依中華新聞雲原站個案衛教及 NHS 脊髓壓迫資訊改寫；背痛不等於癌症，癌症病史合併神經功能異常須緊急評估。", "character_count": 665, "references": [{"title": "中華新聞雲原始報導", "url": "https://www.cdns.com.tw/articles/1479312"}, {"title": "NHS 癌症相關脊髓壓迫", "url": "https://www.nth.nhs.uk/resources/metastatic-spinal-cord-compression-mscc/"}]}}, {"id": "n2s-23b9fbb097138f9dacba", "title": "一直頻尿、排尿不順「不一定是感染」！泌尿醫揭5大原因 久坐也上榜 - Yahoo新聞", "date": "2026-10-27", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "一直頻尿、排尿不順「不一定是感染」！泌尿醫揭5大原因 久坐也上榜 - Yahoo新聞", "publisher": "常春月刊（原站；原收錄：Yahoo新聞）", "published_at": "2026-10-24T01:06:24Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.ttvc.com.tw/a-57546.html", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-26T11:47:40.028721Z", "resolved_by": "curated_registry", "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "一直想尿又悶悶不舒服，是不是一定要吃抗生素？", "text": "阿凱最近開會時總坐不住。不是想上廁所，就是覺得會陰悶悶的，明明剛尿完，沒多久又有尿意。他上網查了一圈，看到「發炎」兩個字，就想找以前剩下的抗生素來吃。\n\n太太問他有沒有先看醫師，他卻說：「上次不舒服也是吃藥，這次應該差不多。」可是，看起來很像的症狀，真的都能用同一個方法解決嗎？\n\n【有發炎或疼痛，不一定就代表找到細菌】\n\n攝護腺位在膀胱下方。相關問題可能讓人排尿不舒服、頻尿，或在會陰與下腹出現疼痛。但這些表現也可能來自其他狀況，需要檢查才能釐清。\n\n本次補讀的常春月刊報導，提醒慢性攝護腺相關不適可能涉及感染、身體反應、生活習慣與壓力等多重因素，不是每一個人都能找到明確細菌來源。\n\n可以把持續的不舒服想成一個需要找出原因的警報。警報響了，代表值得處理，卻不能只憑聲音就認定是哪裡著火，更不能自己決定要用哪種藥。\n\n這篇是醫師衛教，不是單憑生活調整就能治好所有人的研究，也不表示確有感染的人不需要抗生素。\n\n【把症狀說清楚，避免自己反覆試藥】\n\n可以記下不適的位置、何時開始、是否和久坐或排尿有關，以及有沒有發燒、疼痛加劇等變化。就診時，也把使用過的藥與過往檢查結果一起帶去。\n\n若醫師開立抗生素，應依處方完成療程；如果症狀惡化，則及時聯絡醫療團隊。不要自行借藥、延長服藥時間，或吃剩藥來猜測原因。\n\n針對持續的慢性困擾，團隊也可能依情況討論其他藥物、復健或心理支持。這不是說疼痛只是想太多，而是讓照護涵蓋身體與生活受到的影響。\n\n突然尿不出來或出現明顯急性不適，應立即就醫。阿凱最後把舊藥放回去，先預約門診。比起自己反覆嘗試，讓問題被好好理解，才更有機會找到適合的方向。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依常春月刊原站正文及 NHS 攝護腺炎衛教改寫；原收錄為 Yahoo 轉載，已核對同標題原站。", "character_count": 666, "references": [{"title": "常春月刊原始報導", "url": "https://www.ttvc.com.tw/a-57546.html"}, {"title": "NHS 攝護腺炎衛教", "url": "https://www.nhs.uk/conditions/prostatitis/"}]}}, {"id": "n2s-066563085a0046f224c7", "title": "余天走路不再腳抖！曾小中風、攝護腺癌 醫揭步態不穩原因與中風警訊 - TVBS 健康2.0", "date": "2026-10-27", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "余天走路不再腳抖！曾小中風、攝護腺癌 醫揭步態不穩原因與中風警訊 - TVBS 健康2.0", "publisher": "TVBS 健康2.0", "published_at": "2026-10-23T16:02:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://health.tvbs.com.tw/bone/bone-celebrity/366938", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-26T11:47:42.471906Z", "resolved_by": "curated_registry", "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "爸爸走路突然怪怪的，別只用「年紀大」帶過", "text": "阿慧陪爸爸去市場，發現他最近走得比較慢，轉身時還要扶一下攤位。爸爸笑著說：「老了，本來就這樣。」她一開始也沒多想，直到發現他連從椅子站起來，都比以前吃力。\n\n她想起一篇談走路不穩的新聞，卻沒有急著替爸爸對號入座，而是先問：這個變化是慢慢出現的，還是突然發生？有沒有其他不一樣的地方？\n\n【走得穩，需要很多環節一起配合】\n\n走路除了肌力，還需要神經、平衡與身體其他功能協調。肌肉流失、神經或腰椎問題，以及部分代謝狀況，都可能影響步態，不能只看腳抖就確定是哪一種病。\n\n本次補讀的健康2.0報導，從人物近況帶出步態變化的多種可能原因。人物的改善經驗並不能證明某種飲食讓疾病痊癒，也不能讓每個有類似症狀的人照做就好。\n\n如果是逐漸變慢、常跌倒或起身吃力，值得安排醫療評估，再依個別情況討論復健、營養與運動方式。不要還沒弄清楚原因，就勉強長者做難以負荷的動作。\n\n【突然單側無力或說話不清楚，不能等】\n\n需要特別注意的是，症狀如果突然發生，尤其一側手腳無力、臉部歪斜，或說話變得不清楚，可能是中風警訊，應立即尋求急救協助。\n\n即使症狀過一會兒似乎改善，也不能自行認定沒事。記下最後正常的時間與發現症狀的時間，交給醫療人員評估，不要讓當事人自己開車就醫。\n\n對於較長時間的變化，家人則可以記錄何時開始、哪些活動特別困難，以及是否伴隨麻木、疼痛或近期用藥改變，讓門診討論更具體。\n\n阿慧後來陪爸爸把生活中的小變化說清楚，也一起整理家裡容易絆倒的地方。關心長輩，不需要每次都先想到最嚴重的病；分清楚需要立即處理的警訊，以及值得持續評估的困擾，才能在合適的時候給對幫助。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依健康2.0原站正文及 NHS 中風警訊改寫；屬一般神經／高齡衛教，不推論人物疾病因果。", "character_count": 657, "references": [{"title": "健康2.0原始報導", "url": "https://health.tvbs.com.tw/bone/bone-celebrity/366938"}, {"title": "NHS 中風症狀", "url": "https://www.nhs.uk/conditions/stroke/symptoms/"}]}}, {"id": "n2s-f93ec21159764170c93c", "title": "一晚狂尿4次竟是攝護腺肥大！醫靠2招得救 - 鏡週刊Mirror Media", "date": "2026-10-27", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "一晚狂尿4次竟是攝護腺肥大！醫靠2招得救 - 鏡週刊Mirror Media", "publisher": "鏡週刊Mirror Media", "published_at": "2026-10-25T08:51:00Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMidEFVX3lxTFAwUkFuSk1lR0ctRE1LbjlmRDAySWRuM2xZcnVnbmlZek5mSWRrWWgwY25CZWdUSEIySVhtYktZNHFkVUpFcmhyR292LVdHQTU3SEhZRWV0ZUtNMUdTZV9ERUlLVUowUW5KVi1BZGo5MHdmcWhC0gFiQVVfeXFMUEU1Vk5lVWZqaDVhTzBUaWVHSGhaM21qbVh6eEFadlIxRHpBc0lrVWJLMHl4Zms0RDh5S0M0NmZ6SktCS2gxaEQ1TVJJV2JxWEVZY0txMV9mcFUwR1lhY09PMkE?oc=5", "retrieval": {"status": "publisher_url_unresolved", "method": "none", "checked_at": "2026-10-28T02:21:23.272263Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-f1b48aeee07067376240", "title": "男人越老攝護腺越肥大！不是細胞變大 頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://health.tvbs.com.tw/bone/bone-celebrity/366938", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-27T02:07:55.999474Z", "resolved_by": "curated_registry", "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-fb702f8b673217e25d9d", "title": "Clinical phenotypes and multidomain sexual function in men with ejaculatory and orgasmic dysfunction: a cross-sectional analysis of the CLIMAX Registry.", "date": "2026-10-26", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Clinical phenotypes and multidomain sexual function in men with ejaculatory and orgasmic dysfunction: a cross-sectional analysis of the CLIMAX Registry.", "publisher": "Sexual medicine", "published_at": "2026-10-23T00:00:00Z", "date_precision": null, "summary": "INTRODUCTION: Delayed ejaculation (DE) and anorgasmia/anejaculation are frequently grouped together, yet whether they represent distinct clinical phenotypes or points along a shared spectrum remains unclear. Relationships between erectile function and other sexual function domains have been characterized primarily in men with erectile dysfunction rather than ejaculatory or orgasmic dysfunction. We sought to characterize clinical phenotypes and multidomain sexual function among men with ejaculatory or orgasmic dysfunction using baseline data from the CLIMAX Registry.\nMETHODS: We performed a cross-sectional secondary analysis of baseline data from 43 participants enrolled in the prospective, multi-institutional CLIMAX Registry. The phenotype analysis included isolated DE (n = 14) and isolated anorgasmia/anejaculation (n = 13), defined as selection of these diagnoses without another ejaculatory/orgasmic diagnosis. These groups were compared using clinical, psychosocial, and sexual function characteristics. A separate analysis of the broader registry cohort evaluated relationships between erectile function and other sexual function domains. Participants with complete International Index of Erectile Function erectile function domain (IIEF-EF) scores were stratified by erectile function severity (IIEF-EF ≥17 [none/mild erectile dysfunction] vs IIEF-EF ≤16 [moderate/severe erectile dysfunction]). Continuous variables were compared using Mann-Whitney U tests, categorical variables using Fisher exact tests, and erectile function and orgasmic function were evaluated using Pearson correlation.\nRESULTS: The overall cohort included 43 participants (mean age, 56.4 ± 15.7 years). Participants with isolated anorgasmia/anejaculation were significantly older than those with isolated DE (67.6 ± 14.6 vs 53.3 ± 12.8 years; P = .004). Beck Depression Inventory scores were higher among participants with DE (14.3 ± 12.3 vs 4.8 ± 4.1; P = .013), whereas standardized sexual function domains did not differ significantly between phenotypes. Notably, 6 of 13 participants (46.2%) in the combined anorgasmia/anejaculation category reported ability to achieve orgasm. Erectile and orgasmic function were not significantly correlated (r = -0.03; P = .84; n = 37), and 7 of 22 participants (31.8%) with unassisted erections sufficient for penetration reported inability to achieve orgasm. Moderate/severe erectile dysfunction was associated with lower intercourse satisfaction (P = .017) but not orgasmic function.\nCONCLUSIONS: Diagnostic phenotype and erectile function alone incompletely characterized sexual function in this exploratory cohort. These findings support multidimensional phenotyping of uncommon ejaculatory and orgasmic disorders and highlight the value of prospective registries for clinical characterization.", "access_scope": "abstract", "pmid": "42921230", "doi": "10.1093/sexmed/qfag097", "url": "https://pubmed.ncbi.nlm.nih.gov/42921230/"}], "drafts": [], "editorial": {"title": "明明能勃起，為什麼還是覺得親密時刻少了什麼？", "text": "阿傑最近有個說不出口的煩惱。和伴侶親近時，身體明明有反應，卻常常遲遲沒有高潮。對方擔心是不是自己不夠有吸引力，他也開始懷疑，是不是只要買點「助興」的東西，就能把問題解決。\n\n兩個人越想把表現做好，氣氛反而越緊繃。原本期待的親密時刻，慢慢變成一場怕失敗的考試。\n\n【勃起、射精和高潮，是不同的事情】\n\n可以把性反應想成幾個互相配合的環節：勃起和陰莖充血有關，射精是精液排出的過程，高潮則是主觀的愉悅感受。它們常一起出現，卻不能畫上等號；勃起沒有明顯問題，不代表其他環節一定順利。\n\n一項分析男性射精與高潮困擾的登錄資料研究發現，光靠勃起狀況或單一診斷名稱，無法完整描述每個人的性功能。研究中也有人雖能達到足以性交的勃起，仍有無法高潮的困擾。\n\n這是小規模、探索性的橫斷面分析，可以提醒我們問得更全面，不能據此判定某個人的病因，更不能證明哪一種治療一定有效。\n\n【把困擾說具體，才能找到合適的協助】\n\n如果這種情況反覆發生，可以先想想：是很難達到高潮、沒有精液排出，還是時間比自己期待的久？是一直如此，或最近才改變？不同情境下是否一樣？這些描述都比一句「我不行」更有幫助。\n\n就診時，也可以帶上目前使用的藥物清單，和醫師討論身體疾病、用藥、壓力與伴侶互動等可能因素，不自行停藥或購買來路不明的產品。\n\n伴侶之間不妨先把「你是不是不喜歡我」換成「我們一起了解發生什麼事」。性功能不是只有硬度，也不是用來替一個人打分數。當困擾已經影響心情或關係，尋求泌尿科或相關專業協助，就是照顧彼此的一種方式。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依研究摘要改寫；小型橫斷面探索分析，非治療試驗。", "character_count": 626, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42921230/"}, {"title": "NHS 射精問題", "url": "https://www.nhs.uk/conditions/ejaculation-problems/"}]}}, {"id": "n2s-c243669459a5e28eeec7", "title": "Peripheral and selective venous liquid biopsy profiling in localized prostate cancer: A pilot feasibility study.", "date": "2026-10-26", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Peripheral and selective venous liquid biopsy profiling in localized prostate cancer: A pilot feasibility study.", "publisher": "The journal of liquid biopsy", "published_at": "2026-10-01T00:00:00Z", "date_precision": null, "summary": "BACKGROUND: Liquid biopsy profiling via next-generation sequencing (NGS) is increasingly being used in prostate cancer to identify actionable genomic alterations, monitor disease dynamics, and provide prognostic information. However, the circulating tumor DNA (ctDNA) fraction correlates with disease burden, often remaining near the analytical limit of detection in localized disease. Accordingly, strategies to enhance the molecular characterization in earlier-stage disease represent a clinically relevant priority.\nMETHODS: We conducted a retrospective, single-center observational analysis in a cohort of patients with localized prostate cancer undergoing liquid biopsy. Patients underwent peripheral venous sampling for genomic profiling. When peripheral testing failed to identify genomic alterations or was non-informative, patients proceeded to selective venous blood sampling within the cavo-iliac venous compartment. The primary outcome was the detection rate of reportable genomic alterations in peripheral blood, while exploratory outcomes included findings from selective sampling.\nRESULTS: Thirty-one patients were enrolled. Peripheral blood liquid biopsy was evaluable in 28 patients. Genomic alterations were detected in 20 of them (20/28, 71.4%; 95% CI, 51.3-86.8%). Patients most frequently harbored mutations in ATM (21.4%), RB1 (14.3%), and BRCA1 or BRCA2 (7.1% each). Eight patients underwent selective venous sampling, with 4 out of 8 (50.0%) demonstrating the presence of at least one genomic alteration. Conversion to mutation-positive occurred in two patients (50.0%) who initially lacked detectable alterations in peripheral blood sampling. Across all available peripheral and selective samples, at least one reportable genomic alteration was identified in 23 of the 31 enrolled patients (74.2%).\nCONCLUSIONS: Our findings demonstrate a high prevalence of genomic mutations in localized prostate cancer. Selective venous sampling was feasible and safe in this small exploratory cohort and provided additional molecular findings in selected patients. These hypothesis-generating data support selective sampling as a potential complementary approach for molecular profiling in localized prostate cancer, deserving prospective validation.", "access_scope": "abstract", "pmid": "42927017", "doi": "10.1016/j.jlb.2026.100499", "url": "https://pubmed.ncbi.nlm.nih.gov/42927017/"}], "drafts": [], "editorial": {"title": "抽血就能看清攝護腺癌？先認識液態切片的能力與限制", "text": "阿宏陪爸爸回診，在手機上看到「液態切片」四個字，立刻問：「以後是不是抽一管血，就不用做其他檢查了？」爸爸聽了很期待，畢竟誰都希望檢查能簡單一點。\n\n可是，一份檢驗報告裡的資訊，到底能回答哪些問題？如果沒有找到異常，又能不能放心說疾病沒有變化？這些，才是看懂新技術時需要一起問的事。\n\n【血液可能帶著線索，但線索不等於全貌】\n\n液態切片是從血液等體液中尋找與腫瘤有關的分子資訊。其中一種做法，是分析可能來自腫瘤的 DNA 碎片，幫助研究人員了解基因變化。\n\n可以把它想成在河流下游找上游留下的紙屑。紙屑多不多、檢驗能不能辨認，都會影響結果。局限在攝護腺的癌症，血中腫瘤 DNA 可能很少，所以沒有測到變化，不等於已證明沒有癌症。\n\n一項小型、單一中心的回顧性研究，探討一般周邊抽血，以及特定靜脈位置取樣能否提供額外基因資訊。部分受試者在後者找到更多線索，顯示這個方向值得繼續研究。\n\n但特定靜脈取樣並不是日常手臂抽血的同一件事。這項研究也沒有證明，所有人都應接受這種檢查，或它可以取代既有診斷流程。\n\n【做檢查前，先問它會如何改變下一步】\n\n如果醫療團隊建議基因或液態切片檢查，可以詢問：這次主要想回答什麼？結果有可能改變用藥或追蹤安排嗎？如果結果不明確，還需要哪些資料？取樣方式和風險又有哪些？\n\n把原本的病理、影像、抽血紀錄放在一起討論，比單看一項新檢驗更能理解自己的情況。不要因為廣告寫得方便，就自行取消已安排的檢查。\n\n阿宏真正想替爸爸爭取的，是少一點不必要的折騰。讓每一項檢查都有清楚目的，並了解它回答不了的問題，才能讓新技術成為幫手，而不是新的誤會。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依研究摘要改寫；單中心回顧性先導研究，尚需前瞻性驗證。", "character_count": 656, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42927017/"}]}}, {"id": "n2s-3e54b54d3475280bd22e", "title": "Axonemal dynein gene dysfunction as a cause of male infertility: insights from DNAH family mutations.", "date": "2026-10-26", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Axonemal dynein gene dysfunction as a cause of male infertility: insights from DNAH family mutations.", "publisher": "Gene", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "Male infertility is a complex disorder and defective sperm motility is one of the most common reasons for impaired fertility. The dynein axonemal heavy chain (DNAH) gene family encode molecular motors that form the structure of cilia and sperm flagella. Abnormalities in several DNAH genes have already been confirmed to be causative factors responsible for male infertility conditions, mainly including asthenozoospermia, multiple morphological abnormalities of the sperm flagella (MMAF), and reproductive failure related to primary ciliary dyskinesia (PCD). Here, this review illustrates the current evidence regarding the involvement of members of the DNAH family in male infertility, along with summarizing their biological functions, genotypic and phenotypic correlations and clinical significance. Due to the breakthroughs of the technologies of whole-exome and whole-genome sequencing along with research with animal models and functional investigations, the diversity of reported causative DNAH mutations and their implications for the organization and function of sperm axonemes are currently better understood. DNAH1, DNAH8 and DNAH17 are the DNAH genes most frequently described as being involved in male infertility, though growing evidence also indicated that DNAH3, DNAH11, DNAH12 and DNAH14 also contribute to the male reproductive disorders. Implementation of testing DNAH genes into molecular diagnostics enhances the assessment of genes causing severe sperm motility disorders and aids genetic counseling of the affected families. Together with the genomic and functional data, further research will elucidate additional details for disease mechanisms and will bring benefit to more precise diagnosis and treatments of DNAH-associated male infertility.", "access_scope": "abstract", "pmid": "42838247", "doi": "10.1016/j.gene.2026.150435", "url": "https://pubmed.ncbi.nlm.nih.gov/42838247/"}], "drafts": [], "editorial": {"title": "備孕一直沒消息，是不是精子「游不動」了？", "text": "家族聚餐時，又有人笑著問阿凱：「你們什麼時候要有好消息？」他跟太太相視一笑，回家卻都沉默了。兩人已經很努力調整生活，仍遲遲沒有懷孕。\n\n阿凱看著精液檢查上的「活動力」，心裡冒出好多問題：是不是自己不夠健康？多吃補品會不會比較有用？他最怕的，是讓太太失望。\n\n【精子要前進，也需要能正常運作的尾巴】\n\n精子不是只要存在就好，還需要合適的數量、外形與活動能力。尾巴裡有幫助擺動的精細結構，可以把其中的分子馬達想成小小的划槳裝置，配合運作，才能幫助精子往前游。\n\n一篇文獻回顧整理了 DNAH 基因家族與男性不孕的關係。這些基因參與精子尾部馬達的組成，部分變異可能和嚴重活動力障礙或尾巴形態異常有關。\n\n但這不表示活動力較差，就一定是某個基因出了問題。這篇是整理既有證據的回顧，也不是證明某項基因療法已能讓人恢復生育能力的試驗。\n\n【先找原因，別把壓力全扛在自己身上】\n\n備孕不順需要把雙方的情況一起了解。男性可以依醫療人員安排接受精液分析，必要時複查，並討論病史、生活習慣及其他檢查。單看一張報告，往往還不足以描述完整的生育狀況。\n\n若結果顯示嚴重或持續的活動力異常，再由專業團隊評估是否需要基因檢查與遺傳諮詢。基因資訊的用途，是協助理解原因、討論生育選項與家族意義，不是替誰貼上「不夠好」的標籤。\n\n與其看到網路推薦就一直加買保健品，不如把報告帶到泌尿科或生殖醫學門診，問清楚下一步要確認什麼，以及各種選項的限制。\n\n也可以和伴侶約定，面對親友追問時由兩人一起回應，不讓其中一人獨自承受。懷孕不是努力程度的考試；願意共同面對，已經是很重要的一步。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依文獻回顧摘要改寫；不能由活動力異常直接推定基因診斷。", "character_count": 650, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42838247/"}, {"title": "NHS 不孕原因", "url": "https://www.nhs.uk/conditions/infertility/causes/"}]}}, {"id": "n2s-ab94b9d76d6c1909fcd8", "title": "一晚狂起身4次「確診攝護腺肥大」！醫靠2招得救了：不再夜尿 - 三立新聞", "date": "2026-10-26", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "一晚狂起身4次「確診攝護腺肥大」！醫靠2招得救了：不再夜尿 - 三立新聞", "publisher": "三立新聞", "published_at": "2026-10-25T08:51:00Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE1wamN2OGZmWVFGck5kd216azE2UVpxbW9rVEhzbVYxRHVJOUg5cFMxNkUwYXZPRWsydHIwU1JhM256ZG83QU8zalNxel_SAUxBVV95cUxNcGpjdjhmZllRRnJOZHdtemsxNlFacW1va1RIc21WMUR1STlIOXBTMTZFMGF2T0VrMnRyMFNSYTNuemRvN0FPM2pTcXpf?oc=5", "retrieval": {"status": "tool_policy_blocked", "method": "none", "checked_at": "2026-10-28T02:21:29.427544Z", "resolved_by": null, "last_attempt_status": null}}, {"title": "一晚狂起身4次「確診攝護腺肥大」！醫靠2招得救了：不再夜尿 - 三立新聞", "publisher": "三立新聞", "published_at": "2026-10-25T08:53:59Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTFBzOHZURnd4TUZIQ1VoaU05SHM3eHlPcnk5QXgyZDZabkxsQTVZT3ZEa09MT2lUa0h3NmtYUTgxUnhnb0xSNnhjM3dpcjA?oc=5", "retrieval": {"status": "tool_policy_blocked", "method": "none", "checked_at": "2026-10-28T02:21:29.427574Z", "resolved_by": null, "last_attempt_status": null}}], "drafts": []}, {"id": "n2s-92b298053b28aae0e091", "title": "美國嬌生前列腺癌口服藥JNJ-6143早期試驗報捷，69%患者腫瘤縮小 - BigGo 財經", "date": "2026-10-26", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "美國嬌生前列腺癌口服藥JNJ-6143早期試驗報捷，69%患者腫瘤縮小 - BigGo 財經", "publisher": "BigGo 財經", "published_at": "2026-10-25T10:25:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://finance.biggo.com.tw/news/f2ac73ef-7e98-4e5e-90e3-c80e38e44075", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-26T11:47:09.614502Z", "resolved_by": "curated_registry", "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "看到攝護腺癌新藥消息，先分清楚腫瘤縮小與治癒", "text": "阿成陪爸爸回診前，看到一篇口服新藥的新聞，標題提到腫瘤縮小，立刻把手機拿給爸爸看：「是不是又有新希望了？」爸爸也很期待，第一個問題卻是：「這個藥現在適合我嗎？」\n\n家人想多找一個選擇的心情很自然。但一則令人振奮的消息，要變成自己的治療方案，還需要了解研究對象、進行階段，以及目前仍不知道的事情。\n\n【腫瘤有反應，不等於已經治好癌症】\n\n本次補讀的 BigGo 報導談到 JNJ-6143 的早期研究。這是一種正在研究的口服藥物，研究希望利用特定蛋白質的結合方式，干擾癌細胞維持生存的功能。\n\n不過，早期研究觀察到的腫瘤縮小，不能直接等同延長存活，也不能證明每位病人都適用。病人過去接受過哪些治療、疾病目前狀態如何，都會影響資料能否套用。\n\n另外，本次核對發現，原報導與公司同日公告列出的反應比例不同。由於差異原因尚未釐清，這篇文案不沿用那些比例，也不把不同樣本數混在一起解讀。\n\n即使公司公告描述的結果值得繼續研究，它仍是早期試驗與公司發布的資訊，不能當成已證實治癒、已普遍核准，或應立即取代目前治療的保證。\n\n【把新聞變成回診問題，比急著找藥更有幫助】\n\n可以先問照護團隊：這個研究和自己的癌症階段相近嗎？目前屬於什麼研究階段？有哪些風險與不確定性？若考慮臨床試驗，又需要符合什麼條件？\n\n同時，持續依原計畫用藥與回診。不要因為一篇新聞就自行停藥、延後療程，或接受來源不明的購藥與代辦安排。\n\n看見不同來源的數字不一致，也不必自己急著選一個相信。保留完整連結與刊登日期，交給團隊一起核對，才能知道哪些資訊足以支持決定。\n\n阿成後來把手機裡的期待整理成幾個問題，陪爸爸帶進診間。新的研究可以帶來希望，而了解證據的界線，能讓這份希望更貼近眼前真正需要的照護。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "已讀 BigGo 正文；原媒體與同日公司公告比例不一致，未釐清原因，本文不採用比例。早期試驗不等於治癒或核准。", "character_count": 702, "references": [{"title": "BigGo 原始報導", "url": "https://finance.biggo.com.tw/news/f2ac73ef-7e98-4e5e-90e3-c80e38e44075"}, {"title": "Johnson \u0026 Johnson 同日公司公告", "url": "https://www.jnj.com/media-center/press-releases/johnson-johnson-reports-75-tumor-response-rate-in-advanced-prostate-cancer-with-jnj-6143-a-first-in-class-riptac-molecule"}]}}, {"id": "n2s-8d6ed70f8fd6c93d71e0", "title": "Erratum: [Corrigendum] Androgen deprivation therapy has no effect on Pim-1 expression in a mouse model of prostate cancer.", "date": "2026-10-26", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Erratum: [Corrigendum] Androgen deprivation therapy has no effect on Pim-1 expression in a mouse model of prostate cancer.", "publisher": "Oncology letters", "published_at": "2026-10-19T00:00:00Z", "date_precision": null, "summary": "[This corrects the article DOI: 10.3892/ol.2017.6010.].", "access_scope": "abstract", "pmid": "42923627", "doi": "10.3892/ol.2026.15911", "url": "https://pubmed.ncbi.nlm.nih.gov/42923627/"}], "drafts": [], "editorial": {"title": "論文出了更正通知，我的攝護腺癌治療要立刻改嗎？", "text": "阿福正在接受攝護腺癌治療，家人傳來一則英文論文通知，標題裡有「雄性素抑制治療」和「更正」幾個字。他一看就緊張：「是不是我現在做的治療沒有用了？」\n\n手機上的文字很短，他卻越想越多。還沒弄清楚更正了什麼，就已經開始擔心下一次治療要不要去。這種時候，先把資訊放回原來的脈絡，往往比立刻做決定更重要。\n\n【更正通知，不等於一項新的治療結論】\n\n這次收錄的是一篇已發表文章的更正通知，原文章題目涉及攝護腺癌小鼠模型與 Pim-1 表現。PubMed 的簡短摘要只標示它更正了哪一篇文章，沒有提供足夠的更正內容。\n\n因此，僅依目前資訊，不能說它修改了哪張圖、哪個數據或主要結論，也不能把更正直接解讀成整篇研究撤回。更不能由一個分子在小鼠模型中的表現，推論所有病人的荷爾蒙治療都有效或都無效。\n\n可以把更正通知想成書本附上的勘誤提示。要了解影響，必須知道究竟改了什麼，並回到完整內容；不能只看到「有更正」，就替整本書下結論。\n\n【研究消息，不能代替自己的治療評估】\n\n如果新聞或通知讓你不安，可以把完整標題、連結與疑問帶給照護團隊，詢問它是否和自己的病情、治療方式或追蹤有關。\n\n目前正在接受的治療，是依個人疾病狀態與既有證據安排，不能只靠一則資訊有限的通知自行停藥、延後回診或取消療程。\n\n也可以請家人分享訊息時，同時保留來源與文章類型，不要把「更正」轉述成「治療沒用」。遇到資料不足，說清楚還不知道什麼，比急著給答案更負責任。\n\n阿福後來把手機收起來，先照原計畫回診。關心醫療新知不必變成獨自承受的焦慮；讓專業團隊一起判讀，才能把一則令人不安的消息，轉成可以好好討論的問題。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "僅依更正通知的書目與簡短摘要撰寫閱讀提醒；更正細節未取得，不推測原研究結論變動。", "character_count": 660, "references": [{"title": "本篇原始來源", "url": "https://pubmed.ncbi.nlm.nih.gov/42923627/"}]}}, {"id": "n2s-79b7c8a72ebf7666924b", "title": "攝護腺保養從飲食開始！進補須留意 吃錯恐害排尿不適 - 中天新聞網", "date": "2026-10-26", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "攝護腺保養從飲食開始！進補須留意 吃錯恐害排尿不適 - 中天新聞網", "publisher": "中天新聞網", "published_at": "2026-10-25T07:24:17Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://ctinews.com/news/items/KwnKLE0YWY", "retrieval": {"status": "read", "method": "publisher_html", "checked_at": "2026-10-26T11:47:18.322653Z", "resolved_by": "curated_registry", "last_attempt_status": null}}], "drafts": [], "editorial": {"title": "天冷就想喝補湯？先留意餐桌上的酒精與排尿困擾", "text": "天氣一涼，阿德最期待的就是週末和朋友吃薑母鴨。湯一碗接一碗，回家卻開始一直跑廁所，晚上也睡不安穩。太太提醒他少喝一點，他還笑說：「這是在補身體，應該越補越好吧？」\n\n其實，他平常就有排尿變慢的困擾，只是一直沒認真處理。這頓飯讓他開始想，自己需要的到底是多喝一碗湯，還是先了解身體在發生什麼事？\n\n【飲食習慣可能影響症狀，食物卻不能代替治療】\n\n攝護腺位在膀胱下方，增大時可能壓迫尿道，讓人尿流變弱、容易頻尿，或夜裡常起床。每個人的症狀不同，也不能只憑聚餐後上廁所變多，就認定是攝護腺肥大。\n\n本次補讀的新聞提醒民眾不要過度進補，並提到番茄、豆製品與堅果等飲食選擇。但這是一篇醫師衛教報導，不是證明吃某種食物就能縮小攝護腺的人體試驗。\n\n因此，可以把這些食物當成日常飲食的選項，卻不必相信「吃了就能預防肥大」的保證。原報導對食物成分的描述，也不等於個別患者已獲證實的治療效果。\n\n【比起拚命補，先觀察哪些習慣讓自己不舒服】\n\n酒精和咖啡因可能讓排尿症狀更明顯。聚餐時，可以留意湯品是否含酒、自己喝了多少，以及睡前是否又大量補水；有變化時，把情況記下來和醫師討論。\n\n白天仍要適當補充水分，不要為了少跑廁所就整天不喝水。如果因心臟或腎臟疾病有飲水限制，則依原照護團隊的建議安排，不自行套用別人的方法。\n\n若排尿困擾持續影響睡眠或出門活動，值得安排門診評估。突然完全尿不出來、血尿或明顯疼痛，更不能只靠忌口或補品處理。\n\n阿德後來還是會和朋友聚餐，只是願意放慢喝湯的速度，也把一直沒說的症狀帶進診間。照顧身體不必靠某一道神奇料理，從留意自己的反應、找出合適做法開始，就很實際。", "updated_at": "2026-10-26", "notice": "人物與故事均為虛構情境示例，非真實病人經歷。故事改寫版尚待醫療專業審核。", "evidence_note": "依 TVBS 與中天公開原站正文及 NHS 衛教改寫；飲食報導不是食物治療攝護腺肥大的臨床證明。", "character_count": 665, "references": [{"title": "TVBS 原始報導", "url": "https://news.tvbs.com.tw/health/4041050"}, {"title": "中天原始報導", "url": "https://ctinews.com/news/items/KwnKLE0YWY"}, {"title": "NHS 攝護腺肥大衛教", "url": "https://www.nhs.uk/conditions/enlarged-prostate/"}]}}, {"id": "n2s-7116e108ad606714ded8", "title": "無懼薔琵颱風！高橋洋子、工藤靜香台北演唱會照唱不誤 - 噓！星聞", "date": "2026-10-26", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "無懼薔琵颱風！高橋洋子、工藤靜香台北演唱會照唱不誤 - 噓！星聞", "publisher": "噓！星聞", "published_at": "2026-10-23T13:15:20Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiWkFVX3lxTFBGamhqXzQ3Q2pKZmVGQUt0ZWVFWTlBYWdaRGN3WEZpUGMxanhzanVVbk9NT0paaUVHX20ybkFKMDVlaDdoTW5lTTJwU0VjZXJzMkhMSS0ydFNmd9IBX0FVX3lxTFBtZjZKTExuNk5xWnQxQ21UcUEwY000cHpGTUdyZVVzNE1ZUFFjUzZpRXdTOTl5cjMyLXU4NmlsNFRyaEZIUUhtRDdqRWtfMkhBSWhCZU5uMGFOeWl3WkZj?oc=5", "retrieval": {"status": "out_of_scope", "method": "none",
