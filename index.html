<script>
'use strict';
const records=[{"id": "n2s-cb6fc1a788d2c89bc18d", "title": "碳離子放射治療：全球收案研究總覽", "date": "2026-10-24", "status": "pending_review", "warning": "選題待退回：內容偏一般腫瘤；工作紀錄建議退回，尚未變更原審核狀態。", "revision": 1, "sources": [{"title": "Global Landscape of Clinical Studies Open to Enrollment in Carbon Ion Radiotherapy: A PTCOG Review.", "publisher": "International journal of particle therapy", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "BACKGROUND: Radiotherapy with high linear energy transfer (LET) has shown promise for improving cancer outcomes. Carbon ion radiotherapy (CIRT) combines charged-particle dose conformality with enhanced biological effectiveness. However, clinical development remains constrained by limited center availability, modest trial accrual, and few randomized studies. We reviewed the global landscape of CIRT studies open to enrollment to identify current priorities and gaps.\nMETHODS: This Particle Therapy Cooperative Group (PTCOG)-sanctioned project, conducted within the CIRT Guidelines Subcommittee, identified studies through registry review and institutional verification. ClinicalTrials.gov and the Japan Registry of Clinical Trials were searched from December 2025 through February 2026. We included interventional CIRT trials and prospective registries open to new enrollment and excluded studies not open to enrollment, retrospective cohorts, proton-only studies, and preclinical studies.\nRESULTS: Thirty-six studies were identified: 35 interventional trials in 6 countries and 1 North American registry-based comparative-effectiveness study. Japan had the largest share, followed by Germany, China, Italy, Austria, and France. Three centers (SPHIC, QST, and HIT) accounted for 21 of 36 studies. The portfolio included 7 phase I, 23 phase II, 5 phase III, and 1 registry study. Pancreatic cancer and sarcoma-related tumors each accounted for 7 studies; head and neck cancers, 5; prostate and breast cancers, 3 each; glioblastoma, lung cancer, and gynecologic malignancies, 2 each; and mucosal melanoma, mixed solid tumors, kidney cancer, esophageal cancer, and hepatocellular carcinoma, 1 each. Most studies were conducted at a single institution and emphasized feasibility, toxicity, local control, progression-free survival, or overall survival.\nCONCLUSIONS: This expert-verified inventory shows that CIRT studies open to enrollment remain concentrated by center, disease site, and phase. Future progress may depend more on shared outcome definitions, transparent biological dose reporting, and registry-enabled or multicenter comparative designs than on additional isolated single-institution studies.", "access_scope": "abstract", "pmid": "42893060", "doi": "10.1016/j.ijpt.2026.101968", "url": "https://pubmed.ncbi.nlm.nih.gov/42893060/"}], "drafts": [{"platform": "facebook", "text": "大家身邊有親友正在關注癌症治療的新進展嗎？醫療科技不斷向前，放射治療的選擇也越來越多元，其中碳離子放射治療（CIRT）近年受到許多討論。不過，這類研究目前在全球的發展現況究竟如何呢？✨\n\n根據一項國際專家審查的全球現況調查，研究人員檢視了開放收案中的碳離子放射治療試驗與前瞻性登錄研究。結果發現，目前全球有 36 項相關研究正在進行，包含 35 項介入性試驗與 1 項登錄研究，分布在 6 個國家中，其中以日本最多，其次為德國、中國、義大利、奧地利與法國。📊\n\n在這些研究中，我們也可以看到幾個特點：\n• 研究分布較為集中：有過半數的研究由特定幾家中心進行，多數為單一機構執行。\n• 疾病型態多元：涵蓋了胰臟癌、肉瘤、頭頸癌、攝護腺癌與乳癌等多種不同的腫瘤類型。\n• 試驗階段分布：包含第一期、第二期、第三期試驗以及登錄研究。\n\n專家指出，未來的發展可能需要依賴更一致的療效定義、透明的劑量報告，以及多中心或跨國的合作設計，來幫助累積更多實證。您對於癌症治療的新技術有什麼看法或疑問嗎？歡迎在底下留言跟我們分享交流。👇\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42893060/"}, {"platform": "instagram", "text": "身邊有關心癌症治療新知的朋友嗎？來看看目前全球碳離子放射治療（CIRT）研究的最新調查發現！🔍\n\n一項由專家審查的全球現況分析，針對開放收案中的碳離子放射治療試驗進行了盤點。一起來看看這 36 項研究的重點分佈：\n\n🌍 分布國家：涵蓋 6 個國家，其中以日本數量最多，其次為德國、中國、義大利、奧地利與法國。\n🏥 執行單位：多數研究為單一機構進行，且有超過半數集中在特定的三家中心。\n🎯 疾病類別：包含胰臟癌、肉瘤、頭頸癌、攝護腺癌、乳癌等多種不同的腫瘤部位。\n📈 試驗期別：包含 7 項第一期、23 項第二期、5 項第三期試驗及 1 項登錄研究。\n\n專家認為，未來的研究方向或許更需要統一的療效定義與多中心合作設計，來持續推動領域發展。💡\n\n你對這類醫療新技術有什麼想法呢？歡迎留言跟我們討論！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42893060/"}, {"platform": "threads", "text": "大家平時會關注癌症治療的新技術發展嗎？碳離子放射治療（CIRT）近年備受討論，但它的全球研究現況到底如何呢？🤔\n\n根據一項針對全球開放收案研究的最新調查，目前共有 36 項研究正在進行，分布在 6 個國家中，其中以日本最多，其次為德國、中國等地。研究類型涵蓋了胰臟癌、肉瘤、頭頸癌等多種疾病，且多數為單一機構執行的第一至三期試驗或登錄研究。\n\n專家提醒，未來的發展可能需要更多跨機構合作與一致的評估標準來累積寶貴經驗。大家覺得未來癌症治療還需要突破哪些挑戰呢？歡迎留言聊聊！💬\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42893060/"}]}, {"id": "n2s-c88707022636f3a56cb3", "title": "OAB治療迎新趨勢 新一代口服藥物提供不同用藥選擇 - 健康醫療網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "OAB治療迎新趨勢 新一代口服藥物提供不同用藥選擇 - 健康醫療網", "publisher": "健康醫療網", "published_at": "2026-10-22T02:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.healthnews.com.tw/article/70122"}], "drafts": [{"platform": "facebook", "text": "出門前總是得先確認廁所在哪裡嗎？深夜頻頻因為尿意醒來，許多人常把這些情況默默歸咎於「年紀大了本來就會這樣」。不過，泌尿科醫師指出，這些困擾不一定只是自然老化，也可能與膀胱過動症（OAB）有關。不論男女，都可能面臨這樣的狀況。若頻尿、急尿、夜尿或漏尿已經開始干擾睡眠、工作甚至社交生活，就不應盲目忍耐。 醫師說明，OAB 的常見症狀包含頻尿、急尿、夜尿與急迫性尿失禁。男性的排尿困擾也不一定全是因為攝護腺肥大，仍需交由專業醫師透過檢查釐清。針對 OAB 的處理，通常會先從調整生活習慣、檢視飲水量與作息開始；若症狀持續影響生活，醫師會再進一步評估藥物治療。 隨著醫學發展，臨床治療選擇也更加多元。醫師在選擇治療方式時，不僅關注症狀的改善，也會將患者的整體健康狀況納入考量，例如是否合併高血壓、心血管疾病、認知功能或多重用藥等背景，為每位患者找出合適的個人化策略。當排尿問題已經影響到日常生活品質時，建議尋求專業醫療評估，與醫師一同討論適合的應對方式。\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.healthnews.com.tw/article/70122"}, {"platform": "instagram", "text": "總是要先找廁所、晚上頻繁起床嗎？小心這可能是膀胱過動症（OAB）在影響生活。 💡 常見狀況別輕忽： 👉 頻尿、急尿與夜尿 👉 急迫性尿失禁 👉 出門前總要先找廁所、減少社交活動 👉 睡眠反覆中斷影響精神 醫師提醒，這些情況不分男女，也不一定只是單純的老化現象。如果狀況已經實質干擾到日常作息，建議尋求專業評估。目前的治療會先從生活習慣調整開始，若有需要再由醫師評估不同的藥物選項，並綜合考量年齡、共病與用藥背景，找出最適合的個人化照護方式。 覺得這篇資訊實用嗎？歡迎分享給身邊需要的親友！\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.healthnews.com.tw/article/70122"}, {"platform": "threads", "text": "出門旅行或看電影前，你也會習慣先找廁所嗎？很多人把頻尿、夜尿當成自然老化，但其實這也可能是膀胱過動症（OAB）造成的困擾。當這些狀況已經影響到睡眠和日常生活時，建議交由專業醫師評估，找出適合自己的應對方式。今天你有特別注意自己的排尿狀況嗎？\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.healthnews.com.tw/article/70122"}]}, {"id": "n2s-b0c77b0c3c60d2c0ef73", "title": "攝護腺癌主動監測：MRI 與重複切片（PRIAS）", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Can We Omit Systematic Biopsies in Men with a Positive MRI During Repeat Biopsies for Active Surveillance for Prostate Cancer? Results from the PRIAS Study.", "publisher": "European urology open science", "published_at": "2026-10-13T00:00:00Z", "date_precision": null, "summary": "BACKGROUND AND OBJECTIVE: This study evaluated the added value of systematic biopsies (SBx) in addition to targeted biopsies (TBx) for detecting upgrading during repeat biopsies on active surveillance (AS) using data from the Prostate Cancer Research International Active Surveillance study.\nMETHODS: We analyzed repeat biopsies of men who underwent magnetic resonance imaging (MRI) and SBx at diagnosis, with or without TBx depending on the presence of an MRI lesion, had at least one positive (Prostate Imaging Reporting and Data System 3-5) follow-up MRI, and received both SBx + TBx at subsequent repeat biopsy. Upgrading compared with diagnostic biopsy was assessed for TBx only, SBx only, and both, using three definitions: any upgrading, upgrading to grade group (GG) ≥2 with cribriform growth or intraductal carcinoma (≥GG2+), and upgrading to ≥GG3. Cumulative incidences were calculated using each detection method as competing events. For upgrading ≥GG2+ detected by SBx only, the laterality relative to the MRI lesion was determined.\nKEY FINDINGS AND LIMITATIONS: We analyzed 650 repeat biopsies in 568 patients with a median follow-up of 3.0 yr (interquartile range = 1.8-4.3) for men still on AS. During available follow-up, any upgrading occurred in 238 biopsies (37%), of which 47 (7.2%) were detected by SBx only. Upgrading to ≥GG2+ and ≥GG3 was observed in 100 biopsies (16%) and 78 biopsies (12%), respectively, with SBx alone identifying 19 (3.0%) and 15 (2.3%) of these patients. At 6 yr, the cumulative incidence of ≥GG2+ upgrading was 27% (95% confidence interval [CI] = 21-32%), with 5.4% (95% CI = 2.9-9.1%) for upgrading detected exclusively by SBx. Three of the 19 cases with upgrading to ≥GG2+ detected by SBx only were located contralateral to the MRI lesion (0.5% of all biopsies). Limitations include the retrospective design, which may introduce selection and registration biases.\nCONCLUSIONS AND CLINICAL IMPLICATIONS: In men on AS who underwent diagnostic MRI with SBx (with or without TBx) and a positive follow-up MRI, SBx has limited added value during repeat biopsies, particularly for contralateral sampling, supporting a targeted and perilesional biopsy approach.", "access_scope": "abstract", "pmid": "42909178", "doi": "10.1016/j.euros.2026.09.006", "url": "https://pubmed.ncbi.nlm.nih.gov/42909178/"}], "drafts": [{"platform": "facebook", "text": "定期追蹤攝護腺健康時，醫師的檢查方式總是讓人好奇又擔心。當醫師建議進行再次切片檢查時，傳統的全面性系統性切片，是否真的每次都需要呢？🩺\n\n近期一項針對主動監測中男性患者的研究指出，在追蹤磁振造影呈現陽性的情況下，若再次切片時同時進行標靶切片與全面性系統性切片，系統性切片所帶來的額外幫助其實相當有限。研究分析了 650 次再次切片結果，發現僅靠系統性切片額外發現惡性度升高的比例偏低。\n\n💡 了解更多研究重點：\n▪️ 研究追蹤了 568 位患者，中位追蹤時間為 3.0 年。\n▪️ 在再次切片中，任何惡性度升高的情況發生在 37% 的切片中，其中僅有部分是由系統性切片單獨發現。\n▪️ 研究限制包含這是一項回顧性研究，可能存在選擇與登記偏誤。\n\n這項結果支持了未來在特定條件下，或許可以更偏向採用針對性的切片與病灶周圍採樣方式。您平時會關注這類的男性健康與醫療新知嗎？歡迎留言跟我們分享您的想法！💬\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42909178/"}, {"platform": "instagram", "text": "攝護腺健康追蹤又多了一個新視角！當醫師安排再次切片檢查時，全面性的系統性切片扮演什麼角色呢？一起來看看相關的研究觀察 📊\n\n這項研究分析了主動監測中的男性患者，在追蹤磁振造影陽性後接受再次切片的結果。研究發現，在搭配標靶切片的情況下，系統性切片在再次切片時的額外價值相對有限，特別是對對側病灶的採樣。\n\n📌 重點摘要：\n▫️ 納入分析包含 650 次再次切片與 568 位患者，中位追蹤時間 3.0 年。\n▫️ 研究指出系統性切片單獨發現惡性度升高的比例較低。\n▫️ 提醒大家，此研究設計為回顧性，可能存在選擇與登記偏誤等限制。\n\n這支持了未來能更聚焦於標靶與病灶周圍的採樣方式。大家平時都是如何關注男性的健康資訊呢？歡迎留言分享交流！👇\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42909178/"}, {"platform": "threads", "text": "攝護腺追蹤檢查又有新發現！當進行再次切片時，全面性的系統性切片真的每次都不可或缺嗎？🤔\n\n根據近期一項針對主動監測患者的研究顯示，在追蹤磁振造影呈現陽性時，若再次切片同時搭配標靶與系統性切片，系統性切片所帶來的額外幫助其實相當有限，特別是在對側採樣的部分，這支持了更具針對性的採樣方式。\n\n不過研究團隊也提到，這是一項回顧性研究，可能存在一些選擇與登記偏誤。大家平時看到這類醫療新知時，通常會留心哪些細節呢？一起來聊聊吧！💬\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42909178/"}]}, {"id": "n2s-94e9f401294ab093226c", "title": "3T、1.5T差在哪？磁場不是越強越好 醫揭MRI適用情境 - 健康醫療網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "3T、1.5T差在哪？磁場不是越強越好 醫揭MRI適用情境 - 健康醫療網", "publisher": "健康醫療網", "published_at": "2026-10-22T01:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.healthnews.com.tw/article/70093"}], "drafts": [{"platform": "facebook", "text": "每次去醫院看到磁振造影（MRI）設備上面寫著 1.5T 或 3T，心裡是不是也曾冒出過這個疑問：「數字越大，檢查是不是就越好？」🤔 其實，T 代表的是磁場強度的單位 Tesla（特斯拉），而 3T 與 1.5T 之間各有不同的特性與考量，並不是所有檢查情境都一定以 3T 較佳喔！💡\n\n根據永越健康管理中心影像醫學部主任李潤川的說明，3T 的磁場強度較高，能取得較充足的訊號來提升影像解析度，或是在維持相同解析度下縮短掃描時間。不過，MRI 的選擇其實需要綜合評估多項條件：\n\n✨ 檢查部位與組織特性：像是腦部神經退化評估、體積較小的攝護腺或是腕關節、肘關節等小關節，3T 能較好地呈現細微結構；但如果是腹部脹氣、鄰近含氣腔室的部位，或是腹腔有大量腹水、腰圍較寬廣的情況，醫療團隊可能會評估使用 1.5T 來協助。\n✨ 受檢感受與時間：3T 的噪音通常較明顯，且部分敏感的受檢者可能較易感到身體發熱，但目前可透過專用耳機等方式降低影響。若遇到較難長時間保持不動的兒童，在條件合適下也可將 3T 納入評估。\n✨ 金屬植入物與身體狀況：若檢查部位鄰近人工關節、骨釘、心律調節器等金屬植入物，較高磁場可能會加劇假影。因此檢查前務必主動告知病史、職業史及植入物資訊。\n\nMRI 不是磁場越強就一定越好，最重要的是由醫療團隊依據您的檢查目的與個別身體狀況來做最適當的評估喔！大家做檢查前也有留意過這些規格嗎？歡迎留言分享你的經驗👇\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.healthnews.com.tw/article/70093"}, {"platform": "instagram", "text": "做磁振造影（MRI）時，看到 1.5T 和 3T 的規格，你也會覺得數字越大越厲害嗎？🧐 其實 MRI 不是磁場越強就絕對越好喔！一起來看看它們有什麼不一樣吧 🔍\n\n根據永越健康管理中心影像醫學部主任李潤川的解說，T 代表磁場強度單位（Tesla），3T 雖然磁場較高、能提供較高解析度或縮短掃描時間，但實際選擇還要看以下幾個關鍵：\n\n📌 適合的檢查部位\n腦部結構、體積較小的攝護腺或小關節（如腕、肘關節）等，較能發揮 3T 的高訊號特性；但若遇到腹部氣體干擾、腹水較多或腰圍較寬廣的情況，則可能由醫療團隊評估使用 1.5T。\n\n📌 受檢感受與時間\n3T 的噪音與熱感通常較明顯，檢查時也需要長時間保持不動。若是不易配合的兒童，在合適條件下也可將 3T 納入評估選項。\n\n📌 植入物與個人史\n身上若有金屬植入物、人工關節、骨釘或曾從事金屬加工等，高磁場可能會增加假影。檢查前一定要完整告知醫療團隊喔！\n\nMRI 的選擇需要依檢查目的與個別條件綜合評估，下次安排檢查前，不妨和醫師聊聊最適合你的設備是什麼吧 💬 你曾做過哪一種規格的檢查呢？\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.healthnews.com.tw/article/70093"}, {"platform": "threads", "text": "做 MRI 磁振造影時，看到 1.5T 跟 3T 的差別，是不是常讓人好奇數字大是不是就比較好？🤔 永越健康管理中心影像醫學部主任李潤川指出，3T 磁場較高、解析度好，但其實 MRI 不是磁場越強就一定最適合所有人！\n\n選擇哪種規格，主要會受到檢查部位、體內是否有金屬植入物，以及受檢者的身體狀況來綜合評估。像是腦部與攝護腺等檢查較能發揮 3T 特性，但如果有腹部氣體干擾或人工關節等植入物，醫師也可能會評估使用 1.5T 喔！\n\n檢查前完整告知醫師職業史、病史與植入物資訊是最重要的。大家去檢查時會特別注意是 1.5T 還是 3T 嗎？👇\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.healthnews.com.tw/article/70093"}]}, {"id": "n2s-6a7cbbcadcd23c51d50c", "title": "健康網》排尿滴滴答答又頻尿 醫點名男性健檢別漏這3項 - 自由健康網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "健康網》排尿滴滴答答又頻尿 醫點名男性健檢別漏這3項 - 自由健康網", "publisher": "自由健康網", "published_at": "2026-10-21T07:42:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://health.ltn.com.tw/article/breakingnews/5612727"}], "drafts": [{"platform": "facebook", "text": "大家上廁所時，有沒有覺得最近小便變慢、滴滴答答，或是晚上老是要起來跑廁所呢？💦 許多男性朋友常覺得「只是小便慢一點，應該不用特別檢查吧？」總是等到症狀影響到生活了，才第一次走進泌尿科。泌尿科醫師張英傑透過衛教提醒，其實不少泌尿系統問題在早期並沒有明顯不適，若能透過健康檢查提早了解，更能及早掌握身體變化。 健檢時不妨留意以下3個項目： 🔹 尿流速檢查：透過排尿速度與型態等數據，了解膀胱排尿功能，也是評估攝護腺肥大或排尿阻塞的重要參考。 🔹 男性荷爾蒙檢查：如果最近常覺得容易疲倦、睡不好、體力下降、性慾降低或情緒起伏變大，除了生活壓力外，也可能與睪固酮濃度有關，可透過抽血進一步評估。 🔹 攝護腺健康檢查：隨著年齡增長，攝護腺肥大、發炎及相關風險也會提高，可依照個人狀況與醫師討論是否安排PSA抽血或肛門指診等檢查。 醫師叮嚀，配合年齡、家族病史與個人風險安排檢查，比等到症狀加劇才處理讓人更安心。大家平常做健康檢查時，也會特別關注泌尿系統或攝護腺的狀況嗎？歡迎留言分享你的看法！\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://health.ltn.com.tw/article/breakingnews/5612727"}, {"platform": "instagram", "text": "排尿滴滴答答、夜尿變多，或是最近總覺得體力和精神不如以往嗎？許多男性常把這些情況歸咎於年紀大或壓力大，等到不舒服才去就醫。泌尿科醫師張英傑提醒，許多泌尿問題早期沒有明顯症狀，透過健檢提早了解，能更安心照顧自己！ 💡 男性健檢可以留意的3個方向： 1️⃣ 尿流速檢查 透過排尿速度與型態等數據，了解膀胱排尿功能，作為評估攝護腺肥大或排尿阻塞的參考。 2️⃣ 男性荷爾蒙檢查 若近期容易疲倦、睡不好、體力下降或性慾降低，可能與睪固酮濃度有關，可透過抽血評估。 3️⃣ 攝護腺健康檢查 隨著年齡增加，攝護腺相關風險也跟著提高，可依年齡與家族病史評估安排PSA抽血或肛門指診。 預防勝於治療，別等到症狀明顯才處理。你身邊的男性親友有關心過這些健康指標嗎？趕快把這篇收藏起來提醒家人吧！ 📌\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://health.ltn.com.tw/article/breakingnews/5612727"}, {"platform": "threads", "text": "「醫師，我只是小便慢一點，應該不用檢查吧？」尿尿滴滴答答、夜尿變多，或是最近常常覺得精神體力大不如前，你或身邊的男性也有這種情況嗎？ 泌尿科醫師張英傑提醒，男性健檢其實可以把這3項納入評估： 尿流速檢查、男性荷爾蒙抽血，以及攝護腺健康檢查。很多狀況早期沒有明顯不適，別等到影響生活才去面對！大家做健檢時，也會特別注意這些項目嗎？👇\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://health.ltn.com.tw/article/breakingnews/5612727"}]}, {"id": "n2s-3d55b5638576a4946e44", "title": "HoLEP 與 Mini-HoLEP：長期追蹤隨機試驗", "date": "2026-10-24", "status": "pending_review", "warning": "原生成稿中的術式中文譯名須由醫療人員核對；保留原稿，尚未核准。", "revision": 1, "sources": [{"title": "HoLEP Versus Mini-HoLEP: A Long-term Follow-up Prospective Randomized Controlled Trial.", "publisher": "European urology open science", "published_at": "2026-10-08T00:00:00Z", "date_precision": null, "summary": "BACKGROUND AND OBJECTIVE: Holmium laser enucleation of the prostate (HoLEP) is increasingly performed with miniaturized instruments, aiming to reduce postoperative urinary incontinence (UI). Evidence for mini-HoLEP (MiLEP) using a 22-Fr resectoscope remains largely retrospective or nonrandomized. We aimed to compare MiLEP with a standard 26 Fr HoLEP in a prospective randomized trial.\nMETHODS: Ninety men were randomized to MiLEP (n = 45) or HoLEP (n = 45). All procedures were performed by one surgeon using a standardized technique. The prespecified primary end point was UI, defined as any reported loss of urine, at 1 mo. Key secondary end points included UI at 2 mo and at the end of follow-up.\nKEY FINDINGS AND LIMITATIONS: Median follow-up was 828 days. UI at 1 mo was lower after MiLEP than HoLEP (22.2% vs 51.1%; odds ratio [OR] 0.27; 95% confidence interval [CI] = 0.11-0.67; p = 0.004). UI at 2 mo was also lower (8.9% vs 24.4%; OR 0.30; 95% CI = 0.09-0.99; p = 0.048), whereas long-term UI did not differ significantly (2.2% vs 6.7%; p = 0.61). MiLEP also lowered the need for meatal dilation (15% vs 51%; p \u003c 0.001), irrigation volume (16 vs 24 l; p \u003c 0.001), and improved core temperature maintenance (+0.1 °C vs -0.1 °C; p \u003c 0.001), with higher median enucleation efficiency (1.22 vs 1.0; p = 0.003) and not statistically different operative time, complications, and functional improvement. Limitations include the inability to blind the surgeon and limited power for uncommon events.\nCONCLUSIONS AND CLINICAL IMPLICATIONS: MiLEP seems to improve early continence recovery, supporting miniaturization as a strategy to enhance patient-centered outcomes after HoLEP.", "access_scope": "abstract", "pmid": "42892994", "doi": "10.1016/j.euros.2026.09.010", "url": "https://pubmed.ncbi.nlm.nih.gov/42892994/"}], "drafts": [{"platform": "facebook", "text": "大家身邊是不是也有男性長輩，常為攝護腺肥大困擾，甚至擔心手術後會面臨漏尿的問題呢？近期一項針對九十位男性進行的前瞻性隨機試驗，探討了微型化手術的成效。💡研究將患者分為兩組，分別接受微型銩雷射攝護腺剜除術（MiLEP）與標準銩雷射攝護腺剜除術（HoLEP）。追蹤結果發現：\n\n🔹術後一個月內，微型化手術組的回報漏尿比例較低（22.2% 比 51.1%）。\n🔹術後兩個月，微型化手術組的漏尿比例也較低（8.9% 比 24.4%）。\n🔹不過在長期追蹤下，兩組的漏尿情形則沒有明顯差異。\n\n這項研究提醒我們，手術器械的微型化或許有助於改善早期的排尿控制恢復。不過研究也提到一些限制，例如無法對醫師進行盲化，且對於少見事件的統計樣本有限。大家對於這類攝護腺手術的新進展有什麼看法呢？歡迎留言分享你的想法！💬\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42892994/"}, {"platform": "instagram", "text": "身邊有男性親友正在關心攝護腺手術嗎？手術後最怕遇到的排尿控制問題，醫療研究又有新發現囉！🩺這是一項前瞻性隨機試驗，針對九十位接受手術的男性進行觀察，比較微型化與標準手術的差異：\n\n✨ 術後一個月漏尿比例：微型組 22.2%，標準組 51.1%\n✨ 術後兩個月漏尿比例：微型組 8.9%，標準組 24.4%\n✨ 長期追蹤漏尿情形則沒有顯著差異\n\n研究顯示，器械微型化似乎能提升術後早期的排尿控制恢復。不過這項研究也有其限制，像是無法對手術醫師進行盲化。你身邊也有人關注這類醫療新知嗎？快分享給需要的朋朋吧！🌱\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42892994/"}, {"platform": "threads", "text": "男性攝護腺手術後，總是擔心會面臨漏尿困擾嗎？最近一項針對九十位男性的前瞻性隨機試驗發現，採用微型化手術（MiLEP）的患者，在術後一個月與兩個月的漏尿比例，均低於標準手術組。不過長期追蹤下來，兩組則沒有明顯差異。這項觀察也提醒我們，器械微型化或許能有助於早期的排尿控制恢復，但研究仍有無法盲化醫師等限制。大家平時都會怎麼閱讀這類醫療新聞呢？👇\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42892994/"}]}, {"id": "n2s-2a6a97466a54d7fdb0e3", "title": "守護攝護腺健康! 童綜合醫院「攝立健康新目標」互動登場 - 優活健康網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "守護攝護腺健康! 童綜合醫院「攝立健康新目標」互動登場 - 優活健康網", "publisher": "優活健康網", "published_at": "2026-10-21T03:50:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.uho.com.tw/article-70536.html"}], "drafts": [{"platform": "facebook", "text": "大家身邊的男性長輩或另一半，最近是否常在夜裡頻繁起床上廁所呢？許多人都以為這只是正常的老化現象，但其實可能跟攝護腺健康有關喔！根據醫師的衛教解說，男性在特定年齡後，攝護腺細胞可能開始增生肥大，進而壓迫尿道影響排尿。如果經常感覺排尿無力、尿流變弱、解不乾淨或是頻尿、急尿，建議及早就醫檢查，避免長期下來引起其他泌尿道問題。日常生活也可以透過調整習慣來幫助保健，例如避免西式飲食、紅肉過度攝取、過量飲酒、吸菸以及維持適當體重。大家平時會關心自己或家人的排尿狀況嗎？歡迎留言聊聊。 🌱\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.uho.com.tw/article-70536.html"}, {"platform": "instagram", "text": "夜裡總是頻繁跑廁所嗎？小心可能是攝護腺發出的小信號！今天一起來了解男性常見的攝護腺健康大小事。 📝 💡 常見排尿狀況： 💧 排尿無力或尿流變弱 💧 排尿後感覺解不乾淨 💧 過程中突然中斷或需用力 💧 頻尿、急尿、夜尿多次 💡 日常護理小貼士： 🥗 避免西式飲食與紅肉過度攝取 🍷 減少過量飲酒與吸菸 🏃‍♂️ 維持良好生活習慣與體重 若發現身體有任何不適症狀，記得尋求專業醫師協助，建立正確就醫心態唷！快把這篇實用資訊分享給身邊的男性朋友吧！ 💙\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.uho.com.tw/article-70536.html"}, {"platform": "threads", "text": "你有注意到身邊男性家人晚上常起床上廁所嗎？這可能是攝護腺肥大引起的現象喔！如果出現排尿無力、尿流變弱或是解不乾淨的感覺，別害羞，及早就醫檢查才是對健康最好的照顧。平常少吃紅肉、戒除菸酒、維持好體重，也能降低發生機率。你身邊也有人默默在忍耐排尿問題嗎？ 👇\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.uho.com.tw/article-70536.html"}]}, {"id": "n2s-290793ea1e9b1175a5b5", "title": "健康網》晚上起床尿尿好幾次別當老化！ 醫揭攝護腺肥大4迷思 - 自由健康網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "健康網》晚上起床尿尿好幾次別當老化！ 醫揭攝護腺肥大4迷思 - 自由健康網", "publisher": "自由健康網", "published_at": "2026-10-22T12:01:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://health.ltn.com.tw/article/breakingnews/5614002"}], "drafts": [{"platform": "facebook", "text": "晚上總是起來上好幾次廁所，或是覺得排完尿還是不太乾淨嗎？許多男性常把這些改變當成是正常的身體老化，直到頻繁影響睡眠與日常生活才開始注意 🌙\n\n長庚醫院泌尿科醫師黃英哲指出，排尿習慣的改變往往是最早的警訊。當攝護腺體積逐漸增大時，會影響排尿效率，常見表現包含尿流變弱、排尿等待時間變長，以及排完仍覺得沒排乾淨。長期忽略不只影響排尿，也可能逐漸干擾膀胱功能。\n\n關於攝護腺健康，醫師歸納了幾個常見的觀念：\n\n🔹 症狀與大小不一定成正比：有些人變化不大但排尿受影響，也有人數值增加卻幾乎沒感覺，因此需要評估實際生活狀態。\n🔹 治療不等於一定要開刀：核心目標是改善排尿、降低生活干擾與保護膀胱功能，醫師會依照狀況搭配生活調整、藥物或手術。\n🔹 生活習慣會放大困擾：像是晚間大量喝水、久坐或刺激性飲食，都可能讓夜尿與頻尿更明顯。\n\n及早留意身體的小變化並尋求專業評估，才能找到最適合自己的應對方式，找回舒適的生活品質。大家身邊也有長輩常提起夜尿的困擾嗎？歡迎留言分享你的觀察 💬\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://health.ltn.com.tw/article/breakingnews/5614002"}, {"platform": "instagram", "text": "晚上頻頻起床上廁所，真的是正常老化嗎？ 🛌\n\n很多男性遇到排尿變慢或夜尿增加時，總覺得是老了難免。泌尿科醫師提醒，這其實可能是攝護腺在發出訊號！長期下來不只影響排尿，還可能干擾膀胱功能與生活品質。\n\n一起來看看關於攝護腺健康的重點觀念：\n\n✔️ 視為最早警訊：攝護腺增大時會影響排尿效率，出現尿流變弱、排尿等待或排不乾淨的感覺。\n✔️ 大小不等於症狀：有些人攝護腺變化不大但影響很明顯，評估實際症狀與生活影響更重要。\n✔️ 治療方式多元：核心目標是改善排尿與保護膀胱，不一定要開刀，可能透過生活調整或藥物來協助。\n✔️ 調整生活節奏：晚間大量喝水、久坐或刺激性飲食，都可能讓夜尿與頻尿變得更明顯。\n\n越早理解身體的變化，越能及早找到適合的處理方式。趕快把這篇實用資訊分享給身邊需要的家人朋友吧 📌\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://health.ltn.com.tw/article/breakingnews/5614002"}, {"platform": "threads", "text": "半夜總是得起來上好幾次廁所，出門也總是先找廁所嗎？別把排尿變慢通通當成正常老化 🚻\n\n泌尿科醫師提醒，這可能是攝護腺肥大帶來的影響。當排尿出現尿流變弱、排完覺得沒排乾淨時，就應該多加留意。\n\n其實治療不一定等於開刀，重點在於改善排尿與保護膀胱功能，醫師會依狀況評估生活調整、藥物或手術。晚間喝水習慣或久坐也可能讓困擾更明顯。你或身邊的家人也有過這樣的困擾嗎？\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://health.ltn.com.tw/article/breakingnews/5614002"}]}, {"id": "n2s-18e85484b4da97c446bb", "title": "Beyond pairwise comparisons of androgen receptor signaling inhibitors in nonmetastatic castration-resistant prostate cancer.", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Beyond pairwise comparisons of androgen receptor signaling inhibitors in nonmetastatic castration-resistant prostate cancer.", "publisher": "ESMO real world data and digital oncology", "published_at": "2026-10-12T00:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": "42903688", "doi": "10.1016/j.esmorw.2026.100805", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC13682055/"}], "drafts": [{"platform": "facebook", "text": "大家在關注攝護腺相關的醫療資訊時，是不是常好奇不同口服藥物之間的差異呢？最近有醫學文獻針對非轉移性去勢抗性攝護腺癌（nmCRPC）的患者治療進行了探討與追蹤 🩺\n\n根據獨立研究團隊對日本患者的回顧性分析與跨機構數據，我們來看看這些討論的重點：\n\n• 療效與數據解讀：研究指出，不同藥物在攝護腺特異抗原（PSA）反應、疾病進展或轉移風險上，各個分析模型與統計方法的結果可能存在差異，目前的資料並未直接確立哪一種藥物具備絕對優勢或完全等同的療效 📊\n\n• 安全性與副作用追蹤：不同研究中觀察到的不良反應發生率與因副作用停藥的比率各有不同，這也反映出回顧性資料在紀錄與評估上的特性。除了疾病本身的控制，患者的用藥持續性與安全性數據同樣需要被全面追蹤 🛡️\n\n• 個別化治療的重要性：由於每位患者的身體狀況、追蹤時間與風險因子不同，醫師通常會依據綜合評估來協助擬定合適的治療策略。\n\n大家在閱讀這類臨床研究與新藥討論時，通常會特別關注哪些面向呢？歡迎在底下留言跟我們分享你的看法！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://pmc.ncbi.nlm.nih.gov/articles/PMC13682055/"}, {"platform": "instagram", "text": "關心攝護腺健康的朋友們，最近有關於非轉移性去勢抗性攝護腺癌（nmCRPC）口服藥物比較的醫學討論，帶大家一起來看看 💡\n\n這類回顧性研究探討了不同藥物在實際臨床應用中的表現，主要可以留意幾個重點：\n\n📌 療效比較的複雜性\n不同研究與統計方法顯示，藥物間在疾病進展或轉移風險上的差異並非絕對，現有數據尚無法直接下定論說某一藥物完全優於另一種，或是療效完全等同。\n\n📌 安全性與不良反應\n不同族群與研究中，不良反應的發生率與因副作用而停藥的比率存在差異。這提醒我們，除了療效之外，用藥的持續性與安全性也相當重要。\n\n📌 個體化評估的價值\n每位患者的身體狀況與病程進展不同，臨床上需要考量多項因素來做綜合評估。\n\n💬 閱讀醫療資訊時，你覺得哪一個部分最需要被釐清？歡迎留言跟我們討論！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://pmc.ncbi.nlm.nih.gov/articles/PMC13682055/"}, {"platform": "threads", "text": "大家在看醫療新聞時，常看到不同口服藥物的比較研究嗎？最近針對非轉移性去勢抗性攝護腺癌（nmCRPC）的治療文獻就提醒大家，研究數據受到分析方法與追蹤時間的影響，未達到統計顯著差異並不代表藥物療效完全等同 🔍\n\n同時，不良反應的發生率與用藥持續性也是評估時的重要考量。每位患者的狀況都不同，這也支持了個別化治療選擇的重要性。\n\n大家平時閱讀這類健康新知時，最想了解哪一部分的資訊呢？\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://pmc.ncbi.nlm.nih.gov/articles/PMC13682055/"}]}, {"id": "n2s-13452cf169e700990e75", "title": "健康醫療網》攝護腺肥大是男性必經之路？「排尿不順」可能不是小問題醫解析治療策略- 股市爆料同學會 - CMoney", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "健康醫療網》攝護腺肥大是男性必經之路？「排尿不順」可能不是小問題醫解析治療策略- 股市爆料同學會 - CMoney", "publisher": "CMoney", "published_at": "2026-10-21T00:13:47Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://talk.ltn.com.tw/article/breakingnews/5610102"}], "drafts": [{"platform": "facebook", "text": "大家身邊有沒有長輩常覺得「年紀大，解尿有點狀況是正常的」而選擇默默忍耐呢？其實，男性隨著年紀增加及荷爾蒙變化，攝護腺可能逐漸增生。常見的困擾包含尿流變細、頻尿、夜尿增加、解尿不乾淨，甚至需要用力排尿。如果長期置之不理，當膀胱出口持續阻塞，可能讓膀胱壁變得肥厚，嚴重時甚至會完全無法排尿，進一步影響腎功能。醫師提醒，面對排尿不順，千萬不要自行過度限制水分或習慣性憋尿，以免增加泌尿道感染或結石等風險。目前的治療策略相當多元，主要包含以下幾個方向：\n\n✨ 生活型態調整：適度調整晚間飲水量，幫助改善夜尿狀況。\n✨ 藥物治療：透過藥物協助改善排尿症狀，但若有姿勢性低血壓、頭暈等副作用或改善幅度有限，可再與醫師討論。\n✨ 傳統與微創手術：包含傳統切除、汽化或剜除手術，以及近年發展的微創治療如水蒸氣消融與攝護腺拉開術等選項。\n\n每位患者的身體狀況、攝護腺條件與生活期待都不同，並沒有一體適用的標準答案。如果發現自己或家人有相關困擾，建議前往泌尿科尋求專業評估，和醫師共同討論出最適合的照顧方式喔！\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://talk.ltn.com.tw/article/breakingnews/5610102"}, {"platform": "instagram", "text": "上廁所變慢、晚上要跑好幾次，真的是年紀大了就只能忍耐嗎？💦 許多男性朋友面對攝護腺肥大造成的排尿困擾，常擔心手術風險或影響性功能而選擇默默忍耐。醫師指出，如果阻塞持續惡化，不僅會影響膀胱功能，嚴重時甚至可能影響腎功能。一起來看看醫師解析的幾項重點：\n\n📌 常見症狀：尿流變細、頻尿、夜尿增加、解尿不乾淨、需用力排尿。\n📌 應對誤區：不建議長期過度限制水分或習慣性憋尿，以免增加泌尿道感染與結石風險。\n📌 多元治療選項：包含生活型態調整、藥物治療，以及傳統手術與微創治療（如水蒸氣消融、攝護腺拉開術等）。\n\n每個人的身體狀況與治療期待都不同，治療策略也可以隨著人生階段調整。身邊也有長輩常默默忍耐排尿問題嗎？歡迎留言分享你的看法，或把這篇實用資訊分享給需要的朋友！\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://talk.ltn.com.tw/article/breakingnews/5610102"}, {"platform": "threads", "text": "「年紀大了，解尿不順或頻尿是正常的嗎？」許多男性朋友常因為擔心手術或影響性功能而選擇默默忍耐，但長期置之不理可能會造成膀胱與腎功能的負擔喔！醫師指出，攝護腺肥大的治療方式其實很多元，包含生活型態調整、藥物，以及水蒸氣消融或攝護腺拉開術等微創治療選項。治療並不是一次定案，也可以根據不同人生階段與個人需求來調整。你有聽過或身邊長輩正困擾於這些問題嗎？一起來聊聊吧！\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://talk.ltn.com.tw/article/breakingnews/5610102"}]}, {"id": "n2s-0d4c0978d4a9f6554385", "title": "健康網》尿不出來 危險！醫：攝護腺肥大5併發症 需立刻就醫 - 自由健康網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "健康網》尿不出來 危險！醫：攝護腺肥大5併發症 需立刻就醫 - 自由健康網", "publisher": "自由健康網", "published_at": "2026-10-21T13:21:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://health.ltn.com.tw/article/breakingnews/5613691"}], "drafts": [{"platform": "facebook", "text": "大家身邊有沒有長輩常說「雖然尿很慢、感覺排不乾淨，但還能忍，先不用看醫生啦」？泌尿科醫師曲元正指出，其實大部分的排尿小毛病，透過調整生活作息或藥物就能慢慢改善。但如果攝護腺肥大已經引發特定的併發症，也就是醫學上稱為「絕對適應症」，醫師就會強烈建議立刻就醫或積極治療。根據美國泌尿學會指引，如果自己或家人出現以下情況，請務必尋求專業協助：\n\n📌 急性尿滯留：突然完全尿不出來，肚子脹痛，通常需要急診插導尿管。\n📌 反覆尿路感染：尿液長期排不乾淨，導致反覆發炎、疼痛或發燒。\n📌 肉眼可見血尿：血管增生破裂導致出血，需要進一步處理。\n📌 膀胱結石：尿液滯留過久讓礦物質結塊，加劇疼痛與血尿。\n📌 腎功能受損：尿液逆流回腎臟造成腎水腫，影響腎功能。\n\n平時多留意自己與家人的身體狀況，如果出現排尿不適，別忘了及早跟專業醫師聊聊喔！你身邊也有常忽略身體小狀況的家人嗎？留言跟我們分享一下吧！\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://health.ltn.com.tw/article/breakingnews/5613691"}, {"platform": "instagram", "text": "排尿變慢、感覺排不乾淨，真的只要忍耐就好嗎？泌尿科醫師曲元正提醒，當攝護腺肥大引發特定併發症時，可不能再拖囉！趕快把這 5 個需要立刻就醫的狀況收起來，隨時提醒自己和家人：\n\n💧 急性尿滯留：突然完全尿不出來、肚子脹痛，需要緊急處理。\n💧 反覆尿路感染：餘尿太多導致細菌孳生，引發反覆發炎與發燒。\n💧 肉眼可見血尿：血管破裂出血，需排除腫瘤並止血。\n💧 膀胱結石：尿液滯留過久形成結石，加重疼痛感。\n💧 腎功能受損：尿液逆流造成腎水腫，影響腎臟健康。\n\n大部分的輕微排尿問題可以透過調整作息或藥物改善，但出現上述症狀就得馬上交給專業醫師評估！你平常會關心家人上廁所的狀況嗎？底下留言告訴我們！\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://health.ltn.com.tw/article/breakingnews/5613691"}, {"platform": "threads", "text": "家裡的長輩是不是也常常覺得尿慢一點沒關係，能忍就忍呢？泌尿科醫師曲元正提醒，如果攝護腺肥大引發了像突然完全尿不乾淨、急性尿滯留、反覆尿路感染、血尿、膀胱結石甚至腎功能受損等狀況，可千萬不能再忍耐，要立刻就醫處理！平時的小毛病或許靠作息或藥物能調整，但出現這些危險訊號就要特別小心。大家平常會不會關心自己或另一半的排尿狀況呢？\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://health.ltn.com.tw/article/breakingnews/5613691"}]}, {"id": "n2s-0123eee0f94efb00bd27", "title": "排尿異常、性功能下降別輕忽！男性健康月關注4大疾病 - 健康醫療網", "date": "2026-10-24", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "排尿異常、性功能下降別輕忽！男性健康月關注4大疾病 - 健康醫療網", "publisher": "健康醫療網", "published_at": "2026-10-22T03:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.healthnews.com.tw/article/70112"}], "drafts": [{"platform": "facebook", "text": "身為家中的頂樑柱，你身邊的男性或是你自己，是不是也常常覺得工作忙碌，即使身體有點小狀況也總是默默忍耐呢？💪 根據台灣男性學暨性醫學醫學會的資訊，許多男性常因排尿、性功能或荷爾蒙相關問題比較私密，而延後尋求專業協助。為了提升國人對男性健康的重視，學會特別呼籲大家關注四大常見的男性健康議題：\n\n1️⃣ 攝護腺相關：包含攝護腺癌與攝護腺肥大。由於早期攝護腺癌可能沒有明顯症狀，若有家族史或出現排尿異常、血尿應及早檢查；而中高齡常見的攝護腺肥大則可能出現頻尿、夜尿、排尿不順等狀況，影響生活品質。\n2️⃣ 勃起功能障礙：這不只是單純的性生活困擾，也可能是心血管疾病的早期警訊，因為陰莖血管較細，硬化或阻塞可能比心臟血管更早出現症狀。\n3️⃣ 睪固酮低下症：常伴隨容易疲倦、體力下滑、性慾降低等變化，常被誤認為只是單純老化。\n\n專家提醒，面對身體發出的警訊，及早尋求泌尿科或專業醫師評估，才能把握黃金治療期。大家平常會不會定期關心自己或家人的身體變化呢？歡迎留言聊聊你的看法！\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.healthnews.com.tw/article/70112"}, {"platform": "instagram", "text": "工作壓力大、體力變差，你以為只是老了累了，還是默默忽略了身體的小警訊呢？🤔 台灣男性學暨性醫學醫學會提醒大家，別把健康問題留到症狀嚴重才處理！\n\n🎯 帶你快速了解四大男性健康關注重點：\n\n🔹 攝護腺健康：攝護腺癌早期常無明顯症狀，若有家族史或排尿異常、血尿務必及早檢查；中高齡常見的攝護腺肥大則會帶來頻尿、夜尿、尿流變細等困擾。\n🔹 血管健康警訊：勃起功能障礙不只是性生活問題，也可能是心血管疾病的早期訊號，建議尋求專業醫師並同步評估心血管狀況。\n🔹 荷爾蒙變化：睪固酮低下可能導致體力下滑、容易疲倦與性慾降低，若持續出現應尋求專業評估。\n🔹 避免來路不明產品：網路上許多宣稱能改善排尿或性功能的產品成分不明，切勿自行購買使用以免延誤病情。\n\n面對身體變化，主動關心並尋求專業醫師診斷才是守護健康的不二法門。你身邊的男性朋友平常會注意這些健康小細節嗎？趕快分享給他們看！✨\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.healthnews.com.tw/article/70112"}, {"platform": "threads", "text": "身邊的男性家人或另一半，是不是常常喊累、體力變差，或是排尿習慣改變卻總是害羞不敢去看醫生呢？🏃‍♂️\n\n台灣男性學暨性醫學醫學會提醒，像是攝護腺肥大、勃起功能障礙、睪固酮低下，甚至隱匿性高的攝護腺癌，都是需要被重視的男性健康議題。其中勃起功能障礙更可能是心血管健康的早期警訊，千萬別因為害羞而延誤就醫時機！\n\n大家平常會提醒身邊的男性家人注意健康檢查嗎？留言分享一下你的看法吧！👇\n\n🔎 研究閱讀提醒：本稿依已取得的原站正文整理；新聞報導或來函不等於臨床試驗，仍需醫療專業審閱，不取代個別醫療評估。\n\n資料來源：https://www.healthnews.com.tw/article/70112"}]}, {"id": "n2s-3ce629060b9fd204b547", "title": "攝護腺菌相與攝護腺癌：MICROPROSTK 研究", "date": "2026-10-23", "status": "pending_review", "warning": "", "revision": 2, "sources": [{"title": "Prostate tissue microbiota dysbiosis associated with prostate cancer: results from the MICROPROSTK multicenter study.", "publisher": "New microbes and new infections", "published_at": "2026-10-08T00:00:00Z", "date_precision": null, "summary": "•The prostate harbors a diverse and previously undercharacterized microbial ecosystem with species-level resolution.•Prostate cancer (PCa) patients exhibit higher microbial richness and α-diversity in prostate tissue than non PCa patients.•Distinct microbial communities are observed across prostate, urinary, and rectal niches, independent of cancer status.•Cutibacterium acnes is enriched in PCa patients' biopsies, Lactobacillus reuteri in non-PCa patients' biopsies.•Findings highlight potential prostate-associated pathobionts and protective commensalssignatures.", "access_scope": "abstract", "pmid": "42904090", "doi": "10.1016/j.nmni.2026.101862", "url": "https://pubmed.ncbi.nlm.nih.gov/42904090/"}], "drafts": [{"platform": "facebook", "text": "大家有沒有想過，我們的攝護腺裡其實也有微小生態系呢？最新研究發現，攝護腺中存在著過去較少被了解的多樣化微生物生態，而且在不同部位如攝護腺、泌尿道和直腸，都有各自獨特的微生物群落。🔬這項研究指出，攝護腺癌患者在攝護腺組織中的微生物豐富度和多樣性，會比非攝護腺癌患者來得更高。此外，研究人員也發現了一些有趣的細菌線索：\n\n• 痤瘡丙酸桿菌（Cutibacterium acnes）在攝護腺癌患者的切片檢體中較為豐富。\n• 羅伊氏乳酸桿菌（Lactobacillus reuteri）則在非攝護腺癌患者的切片檢體中較為顯著。\n\n這些發現幫助我們更深入認識可能與攝護腺相關的特定致病菌或具保護作用的共生菌特徵。不過，科學探索仍在持續中，我們也期待未來有更多研究能釐清這些微生物與健康的實際關聯。大家平時會關注身體的微生態保養嗎？歡迎留言跟我們分享你的想法唷！💬\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。不能據此自行使用益生菌或保健品預防、治療疾病。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42904090/"}, {"platform": "instagram", "text": "你知道我們的攝護腺也有自己的微小生態系嗎？菌相的多樣性可能比想像中更豐富！🌟 根據研究摘要指出，攝護腺組織中存在著具備物種解析度的多樣化微生物生態。來看看研究中發現的幾個重點吧：\n\n• 攝護腺癌患者的攝護腺組織，展現出較高的微生物豐富度與多樣性。\n• 不同部位如攝護腺、泌尿道與直腸，都擁有各自獨立且獨特的微生物社群。\n• 痤瘡丙酸桿菌在攝護腺癌患者切片中較多，而羅伊氏乳酸桿菌則在非攝護腺癌患者切片中較多。\n\n這些線索有助於科學界尋找潛在的共生菌與相關菌群特徵。覺得實用別忘了按讚收藏，並分享給關心健康的朋友！👇\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。不能據此自行使用益生菌或保健品預防、治療疾病。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42904090/"}, {"platform": "threads", "text": "平時常聽說腸道有益生菌，但你知道攝護腺裡也有獨特的微生物生態系嗎？🦠 最新研究發現，攝護腺癌患者的攝護腺組織中，微生物的豐富度與多樣性比非攝護腺癌患者更高。研究也指出，兩者檢體中的特定菌種如痤瘡丙酸桿菌與羅伊氏乳酸桿菌的分布也有所不同，帶領我們看見潛在的保護與致病菌群特徵。你有聽過身體各部位的微生態差異嗎？一起來留言聊聊吧！👇\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。不能據此自行使用益生菌或保健品預防、治療疾病。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42904090/"}]}, {"id": "n2s-13ca12b27e217a87a30a", "title": "單次 SBRT 文獻回顧（早期流程測試）", "date": "2026-10-23", "status": "blocked", "warning": "禁止發布／流程測試或呼叫結果待釐清；此紀錄僅供稽核。", "revision": 1, "sources": [{"title": "Efficacy and safety of single-fraction stereotactic body radiotherapy (SBRT) for the curative treatment of extracranial primary Tumors: A collaborative systematic review on behalf of the SBRT Focus Group of the European Society for Radiotherapy \u0026 Oncology (ESTRO).", "publisher": "Clinical and translational radiation oncology", "published_at": "2026-10-01T00:00:00Z", "date_precision": null, "summary": "Single-fraction stereotactic body radiotherapy (SF-SBRT) represents one of the most advanced frontiers in modern radiation oncology. While ultra-hypofractionation has entered everyday clinical practice in different fields of the oncological care, curative treatments in one session are increasingly attractive for the potential favorable combination of logistic advantages with safety and clinical outcomes. This collaborative systematic review promoted by the ESTRO SBRT Focus Group in participation with members of different disease-site Focus Groups collects the available data in support of SF-SBRT for the curative treatment of the main extracranial primary tumors. The findings highlight that, for specific anatomical sites, SF-SBRT is both safe and effective though the results emphasize the critical importance of careful patient selection and mandatory technological requirements for treatment planning and delivery. This collaborative work provides a comprehensive overview of current evidence and identifies key knowledge gaps for future investigation and upcoming clinical trials.", "access_scope": "abstract", "pmid": "42898625", "doi": "10.1016/j.ctro.2026.101295", "url": "https://pubmed.ncbi.nlm.nih.gov/42898625/"}], "drafts": [{"platform": "facebook", "text": "大家有沒有想過，癌症放射治療有沒有可能在單一次療程中就完成呢？放射腫瘤學近年來持續發展，單次高劑量全身立體定位放射治療（SF-SBRT）成為其中的前沿技術之一。這種單次治癒性治療因其潛在的便利性、安全性與臨床成效，在癌症照護中受到關注。根據歐洲放射腫瘤學會（ESTRO）相關焦點小組推動的協同系統性文獻回顧，收集了支援主要頭顱外原發腫瘤單次立體定位放射治療的現有資料。研究結果指出，針對特定解剖部位，單次立體定位放射治療是安全且有效的。不過，這項研究也強調了幾個關鍵點： 🎯 必須進行非常審慎的患者選擇 💡 治療計畫與執行需要嚴格的技術要求 🔬 該文獻回顧也指出了未來的知識缺口，有待後續研究與臨床試驗進一步探討。希望今天的醫療新知分享，能讓大家對現代放射治療的進展有更多了解。如果你身邊有親友正在關心相關治療選擇，也歡迎分享給他們喔！\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42898625/"}, {"platform": "instagram", "text": "面對癌症治療，你聽過單次完成的放射治療選項嗎？✨ 近年來放射腫瘤學有許多新進展，其中單次高劑量全身立體定位放射治療（SF-SBRT）備受討論。歐洲放射腫瘤學會（ESTRO）相關焦點小組進行了一項協同系統性文獻回顧，整理了主要頭顱外原發腫瘤接受單次立體定位放射治療的現有資料。研究帶給我們的重點整理： 🌟 針對特定解剖部位，單次立體定位放射治療展現了安全與有效性 🔍 治療效果高度依賴審慎的患者選擇 ⚙️ 治療計畫與執行必須符合嚴格的技術要求 📝 這份合作研究也點出了未來需要繼續填補的知識缺口，期待未來的臨床試驗帶來更多解答。收藏這篇貼文，隨時掌握最新的醫療科技進展！💬\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42898625/"}, {"platform": "threads", "text": "癌症放射治療有可能在單一次療程就完成嗎？輻射腫瘤學界近年持續探討單次高劑量全身立體定位放射治療（SF-SBRT）的應用。根據一項歐洲放射腫瘤學會（ESTRO）相關焦點小組推動的協同系統性文獻回顧，針對特定解剖部位，單次立體定位放射治療在審慎的患者選擇與嚴格技術要求下，被認為是安全且有效的。這項研究也為未來的臨床試驗指引了方向。大家對於這樣的單次治療方式有什麼想法呢？歡迎留言聊聊！\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42898625/"}]}, {"id": "n2s-df2ce02981fa462999d9", "title": "3T、1.5T差在哪？磁場不是越強越好 醫揭MRI適用情境 - 鏡週刊Mirror Media", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "3T、1.5T差在哪？磁場不是越強越好 醫揭MRI適用情境 - 鏡週刊Mirror Media", "publisher": "鏡週刊Mirror Media", "published_at": "2026-10-22T01:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://www.healthnews.com.tw/article/70093"}], "drafts": []}, {"id": "n2s-d21b4c53238130a0bcfa", "title": "健康醫療網》攝護腺肥大是男性必經之路？「排尿不順」可能不是小問題 醫解析治療策略 - 自由評論網", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "健康醫療網》攝護腺肥大是男性必經之路？「排尿不順」可能不是小問題 醫解析治療策略 - 自由評論網", "publisher": "自由評論網", "published_at": "2026-10-21T00:00:00Z", "date_precision": null, "summary": "已取得原站正文並用於事實查核；為尊重版權，本頁不轉載新聞全文，請點選原始來源閱讀。", "access_scope": "full_text", "pmid": null, "doi": null, "url": "https://talk.ltn.com.tw/article/breakingnews/5610102"}], "drafts": []}, {"id": "n2s-aece9a24639b1e842c2d", "title": "Discovery of 177Lu-PSMA-MN4 as an improved PSMA-targeted radioligand with enhanced antitumor efficacy.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Discovery of 177Lu-PSMA-MN4 as an improved PSMA-targeted radioligand with enhanced antitumor efficacy.", "publisher": "European journal of medicinal chemistry", "published_at": "2026-09-26T00:00:00Z", "date_precision": null, "summary": "Prostate-specific membrane antigen (PSMA)-targeted radioligand therapy with 177Lu-PSMA-617 improves outcomes in metastatic castration-resistant prostate cancer (mCRPC), yet a substantial subset of patients experiences disease progression, underscoring the need for next-generation agents with improved pharmacological profiles. Guided by the PSMA-617/PSMA co-crystal structure (PDB: 8BOW) and molecular dynamics (MD) simulations, the present study rationally designs seven novel PSMA-617 derivatives (PSMA-MN1-7) to enhance target engagement and pharmacokinetic behavior. Among these, 177Lu-PSMA-MN4 demonstrates potent PSMA enzymatic inhibition (IC50 = 1.72 nM), enhanced cellular internalization (110.67 ± 2.60% relative to PSMA-617), and a favorable biodistribution profile marked by sustained tumor retention and rapid renal clearance in LNCaP tumor-bearing mice. In both hormone-sensitive LNCaP and castration-resistant 22RV1 xenograft models, 177Lu-PSMA-MN4 achieves superior tumor growth inhibition and survival prolongation compared with 177Lu-PSMA-617. Single-dose administration at doses up to 0.6 mCi/animal is well tolerated, with no clinically significant hematological changes, renal biochemical abnormalities, or histopathological findings within the observation period of this study. These findings should be interpreted in light of several limitations: absorbed-dose estimates were derived from mouse biodistribution data and require allometric scaling before comparison with clinical organ constraints; therapeutic efficacy was evaluated under a single-dose regimen rather than a fractionated or multi-cycle schedule; and long-term toxicity, including delayed renal and hematopoietic effects, was not assessed. These findings position 177Lu-PSMA-MN4 as a promising candidate for next-generation PSMA-targeted radioligand therapy. Collectively, this work establishes a structure-guided linker-optimization paradigm for PSMA radioligands and identifies 177Lu-PSMA-MN4 as a promising preclinical candidate that warrants further translational evaluation.", "access_scope": "abstract", "pmid": "42810190", "doi": "10.1016/j.ejmech.2026.119381", "url": "https://pubmed.ncbi.nlm.nih.gov/42810190/"}], "drafts": []}, {"id": "n2s-9261464c752b251313e4", "title": "男尿不出來！檢查一脫褲驚見「狼牙棒」 醫嘆：菜花拖10年 - 三立新聞", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "男尿不出來！檢查一脫褲驚見「狼牙棒」 醫嘆：菜花拖10年 - 三立新聞", "publisher": "三立新聞", "published_at": "2026-10-23T05:38:07Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTFAzWEpJQjByeEhraDU5WkZsZ0dUeXFUMmZzOE1rcktGZ0NVYjZfelQtaV81RDhTTFAzUkYwdDBxVXJFNy1FbmRjSEg0NjE?oc=5"}], "drafts": []}, {"id": "n2s-8ba53079934bfe339ae2", "title": "Purulent cardiac tamponade associated with necrotic mediastinal lymphadenopathy: Multimodality imaging of a presumed mediastinal-pericardial pathway.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Purulent cardiac tamponade associated with necrotic mediastinal lymphadenopathy: Multimodality imaging of a presumed mediastinal-pericardial pathway.", "publisher": "Radiology case reports", "published_at": "2026-10-05T00:00:00Z", "date_precision": null, "summary": "Purulent pericarditis is an uncommon but potentially fatal condition that may rapidly progress to cardiac tamponade. Contiguous spread from adjacent thoracic disease is a recognized mechanism; however, imaging documentation of a presumed mediastinal-pericardial pathway in association with necrotic mediastinal lymphadenopathy remains uncommon. We describe the case of a 72-year-old man with recently diagnosed low-grade prostate adenocarcinoma and a concomitant radiologically suspected primary right upper lobe lung malignancy. Baseline FDG PET/CT performed on 19 March 2026 demonstrated intensely hypermetabolic right upper lobe pulmonary lesions and FDG-avid mediastinal lymphadenopathy, including a supracarinal nodal station with central photopenia and corresponding central hypoattenuation, suggesting pre-existing necrotic change. On 11 May 2026, the patient presented with progressive dyspnea, hemodynamic compromise, and echocardiographic evidence of cardiac tamponade. Urgent subxiphoid pericardiocentesis yielded grossly purulent material. Cytology showed abundant neutrophilic inflammatory material without evidence of malignant cells. Gram stain, aerobic and anaerobic bacterial cultures, blood cultures, fungal cultures, and mycobacterial testing did not identify a causative pathogen. Contrast-enhanced chest CT performed on 13 May 2026 because of rapid pericardial fluid re-accumulation demonstrated a right lower paratracheal/anterior supracarinal nodal conglomerate with more extensive liquefactive necrosis, superior vena cava infiltration, and close apparent contiguity with the superior pericardial recess. Associated circumferential pericardial effusion, pericardial thickening, and pericardial enhancement were consistent with active pericarditis. This case highlights the complementary role of FDG PET/CT and contrast-enhanced CT in suggesting a presumed mediastinal-pericardial route in a patient with recurrent purulent pericardial effusion and necrotic mediastinal lymphadenopathy.", "access_scope": "abstract", "pmid": "42890963", "doi": "10.1016/j.radcr.2026.09.038", "url": "https://pubmed.ncbi.nlm.nih.gov/42890963/"}], "drafts": []}, {"id": "n2s-74820bf271865291a4c9", "title": "醫起看／下體長成「狼牙棒」尿道口都塞住 醫：菜花拖10年 | EBC 東森新聞 - LINE TODAY", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "醫起看／下體長成「狼牙棒」尿道口都塞住 醫：菜花拖10年 | EBC 東森新聞 - LINE TODAY", "publisher": "LINE TODAY", "published_at": "2026-10-23T14:02:59Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiVkFVX3lxTE9RcF91Si1iMWJUd2pITnh2YUxqNTJpX1o0aU8xbTNCMjRzV3BCSVpoam5VQXVvRUtxOXNNRzB5a3VOaG10VlY0WkdvNlppRGFmbnZGTjRR?oc=5"}], "drafts": []}, {"id": "n2s-6a6e59105d45f65249c8", "title": "An anti-fouling photoelectrochemical-electrochemical sensing platform with a zwitterionic interface and a photocurrent-polarity-switching strategy.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "An anti-fouling photoelectrochemical-electrochemical sensing platform with a zwitterionic interface and a photocurrent-polarity-switching strategy.", "publisher": "Biosensors \u0026 bioelectronics", "published_at": "2026-09-26T00:00:00Z", "date_precision": null, "summary": "In this work, we have developed a photoelectrochemical-electrochemical (PEC-EC) dual-mode sensing platform consisting of a polydopamine (PDA)-poly(sulfobetaine methacrylate) (PSBMA) anti-fouling zwitterionic interface equipped with a photocurrent-polarity-switching strategy. The PSBMA-PDA copolymer anti-fouling layer was attached to a hydrogen bonded organic framework-101 (HOF-101)-Sb2S3 modified indium titanium oxide (ITO) electrode surface using a dopamine mediated coupling reaction. The attachment of the aptamer of the model analyte prostate specific antigen (PSA) was designed to trigger a hybridisation chain reaction that linked the bifunctional factor of thionine-modified hairpin H1 and hairpin H2 to the anti-fouling electrode surface. Thionine then induced a switch from a cathodic to an anodic photocurrent at the PSBMA-PDA-HOF-101-Sb2S3/ITO, while generating a large differential pulse voltammetric current. This PSBMA-PDA interface-based anti-fouling thus acts as a dual-mode sensing platform that not only offers good anti-fouling capability by reducing non-specific adsorption, but also sensitively detects PSA over a 10 fg mL-1 - 100 ng mL-1 linear range and a detection limit of 5.0 fg mL-1 PSA in the PEC mode, and a 50 fg mL-1 - 100 ng mL-1 linear range and a detection limit of 24.6 fg mL-1 in the EC mode. This anti-fouling PEC-EC dual-mode sensing platform is readily applicable to the highly sensitive and selective detection of various disease biomarkers by simply attaching the corresponding DNA aptamer, thereby offering a promising pathway for early clinical diagnosis and point-of-care testing.", "access_scope": "abstract", "pmid": "42810248", "doi": "10.1016/j.bios.2026.119270", "url": "https://pubmed.ncbi.nlm.nih.gov/42810248/"}], "drafts": []}, {"id": "n2s-695c36c136147412e4c5", "title": "坐著尿尿＝攝護腺出問題？醫破解男性「3大迷思」：其實更好放鬆 - 三立新聞", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "坐著尿尿＝攝護腺出問題？醫破解男性「3大迷思」：其實更好放鬆 - 三立新聞", "publisher": "三立新聞", "published_at": "2026-10-22T03:52:29Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE85RXRmZWJWN05VVnpVRnBSQ2ZpZFRwb29LcUZObWg5MXdsb21QLS1xRWJNajhEdTdHOGVxTFBMUU1WamY2VXJDQ25PQlM?oc=5"}], "drafts": []}, {"id": "n2s-659fe163f4b1272aa036", "title": "坐著尿=攝護腺出問題？醫破解男性3大迷思 - 鏡週刊Mirror Media", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "坐著尿=攝護腺出問題？醫破解男性3大迷思 - 鏡週刊Mirror Media", "publisher": "鏡週刊Mirror Media", "published_at": "2026-10-22T03:49:00Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiYkFVX3lxTE5fUlpPZTkzcXF1cUZLOTNTTjl3RjhJWkNmS3JDN1UtMV9EZW1zS3dQM2hqMFJ1QWVMbTdhQ2dGcFEtVkIxZm8tT3dDNThtTkpqNnBzTkhpVkkyZTFXMFI4U2xB0gFiQVVfeXFMTl9SWk9lOTNxcXVxRks5M1NOOXdGOElaQ2ZLckM3VS0xX0RlbXNLd1AzaGowUnVBZUxtN2FDZ0ZwUS1WQjFmby1Pd0M1OG1OSmo2cHNOSGlWSTJlMVcwUjhTbEE?oc=5"}], "drafts": []}, {"id": "n2s-62728a0414e9b18e49e7", "title": "Localized nanomedicine for urologic cancers: anatomy-guided design and clinical translation.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Localized nanomedicine for urologic cancers: anatomy-guided design and clinical translation.", "publisher": "Materials today. Bio", "published_at": "2026-10-08T00:00:00Z", "date_precision": null, "summary": "Bladder, prostate, and renal cancers differ in their anatomical locations, tissue structures, and routes of clinical intervention. Conventional systemic treatments are often limited by nonspecific biodistribution, insufficient tumor accumulation, and toxicity. Localized nanomedicine delivery offers an alternative strategy by using organ-specific anatomical access to increase exposure at the tumor site and reduce systemic distribution. Its success depends on the compatibility of nanomedicine delivery systems with the physiological environment, anatomical characteristics, and procedural requirements of the organ. Here, we compare local nanomedicine strategies for these three cancers and discuss how anatomy can guide their design. We therefore define five design criteria for localized nanomedicines: retention, penetration, responsiveness, targeting, and synergy. For each criterion, describe relevant engineering approaches and applications in individual cancers. We also consider barriers to clinical use, including formulation reproducibility and compatibility with clinical workflows. An approach that combines anatomy, nanomedicine design, and delivery procedures may support their clinical translation for more precise diagnosis and treatment.", "access_scope": "abstract", "pmid": "42898651", "doi": "10.1016/j.mtbio.2026.103740", "url": "https://pubmed.ncbi.nlm.nih.gov/42898651/"}], "drafts": []}, {"id": "n2s-5b2eeb7d2ab36aa1dfa2", "title": "A Comprehensive Beam-Level Assessment of Pencil-Beam Scanning Migration and Utilization at a Multi-System Proton Therapy Center.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "A Comprehensive Beam-Level Assessment of Pencil-Beam Scanning Migration and Utilization at a Multi-System Proton Therapy Center.", "publisher": "International journal of particle therapy", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "PURPOSE: To provide a beam-level comparison of pencil-beam scanning (PBS) proton therapy at a high-volume center operating both the ProteusPLUS (P-PLUS) and ProteusONE (P-ONE) platforms and to evaluate how system capabilities influenced room utilization during a multi-year transition to PBS.\nMETHODS AND MATERIALS: Log files were analyzed for three rooms: P-PLUS Gantry Room 2 (GTR2; 2018-2024), P-PLUS Gantry Room 1 (GTR1; mid-2023-2024), and P-ONE Compact Gantry Room (CGTR; 2020-2024). A script was written to extract beam parameters while clinical and demographic information were obtained from the MOSAIQ database. Data streams were merged, then grouped and analyzed by site, age, and temporal factors.\nRESULTS: The final dataset included 120,367 beams for the P-PLUS and 95,587 for the P-ONE. During an 18-month comparative period, mean throughput was 27.4 ± 5.4 patients/day (GTR2), 22.9 ± 5.1 (GTR1), and 27.0 ± 4.6 (CGTR), with mean session times of 28.2 ± 2.5, 25.6 ± 1.7, and 26.9 ± 2.4 minutes, respectively. Case allocation reflected platform/nozzle differences: GTR2 primarily treated prostate, breast, and thorax/abdomen targets, while GTR1 and CGTR focused on prostate, head-and-neck, brain, and CNS cases. CGTR treated more pediatric patients (25.2% vs 7.1% in GTR2 and 5.8% in GTR1) and cases involving anesthesia. Maximum cyclotron energy was used more on GTR2 compared to CGTR (7.5% vs 0.4%), while range-shifter use was similar (71.1% vs 67.0%); couch flips occurred in 77% of P-ONE treatments.\nCONCLUSIONS: Expanding PBS capacity substantially shifted room utilization and case mix, driven mainly by differences in spot and field size, and secondarily by imaging, layer-switching, and pediatric-oriented room features. The P-ONE's smaller field size did not materially constrain prostate treatment with involved lymph nodes, frequent couch flips did not inhibit high operational capacity, and the P-ONE's lower minimum energy reduced range-shifter reliance and the need for maximum cyclotron energy. This real-world analysis provides guidance for case selection, workflow optimization, and future proton system design.", "access_scope": "abstract", "pmid": "42904178", "doi": "10.1016/j.ijpt.2026.101969", "url": "https://pubmed.ncbi.nlm.nih.gov/42904178/"}], "drafts": []}, {"id": "n2s-547dd94bb7c8468fdf3f", "title": "Atorvastatin improves hyperlipidemia-induced erectile dysfunction via PKA-associated eNOS phosphorylation at the Ser633 site.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Atorvastatin improves hyperlipidemia-induced erectile dysfunction via PKA-associated eNOS phosphorylation at the Ser633 site.", "publisher": "Sexual medicine", "published_at": "2026-10-18T00:00:00Z", "date_precision": null, "summary": "INTRODUCTION: Hyperlipidemia contributes to vasculogenic erectile dysfunction (ED) by reducing endothelial nitric oxide bioavailability. Although atorvastatin has been reported to improve ED, the upstream mechanism by which it restores endothelial nitric oxide synthase (eNOS) activity remains unclear. This study aimed to evaluate the therapeutic effect of atorvastatin in hyperlipidemia-induced erectile dysfunction (HLED) and to determine whether protein kinase A (PKA)-associated phosphorylation of eNOS at Ser633 contributes to this effect.\nMETHODS: Hyperlipidemia-induced erectile dysfunction was induced in rats by a high-fat diet. Animals received low- or high-dose atorvastatin, with tadalafil as a positive control. Erectile function, serum lipid profiles, oxidative stress, penile fibrosis, and cavernosal eNOS signaling were assessed. In parallel, oxidized low-density lipoprotein (ox-LDL)-injured rat corpus cavernosum endothelial cells (RCECs) were treated with atorvastatin in the presence or absence of the PKA inhibitor H89.\nRESULTS: Atorvastatin improved dyslipidemia, reduced systemic oxidative stress, attenuated penile fibrosis, and partially restored erectile function in HLED rats. Hyperlipidemia-induced erectile dysfunction was associated with decreased eNOS phosphorylation at Ser1177 and Ser633 and increased phosphorylation at Thr495. Atorvastatin enhanced PKA activation and eNOS Ser633 phosphorylation while reducing inhibitory Thr495 phosphorylation in penile tissue. In ox-LDL-treated RCECs, atorvastatin reduced intracellular lipid and ROS accumulation and improved endothelial function, accompanied by increased PKA Thr197 and eNOS Ser633 phosphorylation. These effects were largely blunted by H89.\nDISCUSSION: These findings suggest that atorvastatin ameliorates HLED by restoring endothelial function through a PKA-associated increase in eNOS Ser633 phosphorylation. This upstream endothelial mechanism may complement the action of phosphodiesterase type 5 inhibitors and provide additional benefit for hyperlipidemia-associated vasculogenic ED. The combined in vivo and in vitro design supports mechanistic relevance, although pathway inference relies partly on pharmacological inhibition with H89 and limited time-point analyses. Collectively, our results identify PKA-associated eNOS Ser633 activation as an important mechanism underlying the endothelial-protective effect of atorvastatin in HLED.", "access_scope": "abstract", "pmid": "42894824", "doi": "10.1093/sexmed/qfag094", "url": "https://pubmed.ncbi.nlm.nih.gov/42894824/"}], "drafts": []}, {"id": "n2s-448755f3a74887d2ca68", "title": "Exonuclease III-Proofread high-fidelity primer exchange reaction enables ultrasensitive analysis of prostate cancer MicroRNA.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Exonuclease III-Proofread high-fidelity primer exchange reaction enables ultrasensitive analysis of prostate cancer MicroRNA.", "publisher": "Biosensors \u0026 bioelectronics", "published_at": "2026-10-01T00:00:00Z", "date_precision": null, "summary": "The primer exchange reaction (PER) has emerged as a versatile isothermal amplification technique for biosensing, yet its practical application is severely hampered by non-specific hybridization-induced background signals. Here, we report a high-fidelity PER (Hf-PER) strategy that overcomes this limitation through a rationally designed template architecture integrating exonuclease III (Exo III)-mediated target recycling, blocked primer binding, and self-priming amplification. In this design, Exo III strictly discriminates perfectly matched targets from mismatched sequences, while the absence of free primers and magnetic bead separation effectively suppress spurious amplification. Using miR-21, a prostate cancer-associated biomarker, as a model, the Hf-PER assay achieves a remarkable limit of detection of 0.15 fM with a wide dynamic range spanning five orders of magnitude and single-base discrimination capability. The method demonstrates excellent recovery (95.6%-101.2%) in spiked serum samples, high repeatability (CV \u003c 4.5%), and strong concordance with qPCR (R2 > 0.99). Moreover, it successfully distinguishes prostate cancer cells from normal cells and accurately identifies miR-21 elevation in clinical serum samples from prostate cancer patients. By simply reprogramming the recognition domain, this platform can be readily adapted for other nucleic acid biomarkers; as a proof of concept, we further applied the Hf-PER strategy to detect miR-155, achieving a limit of detection of 0.21 fM and comparable specificity, demonstrating excellent versatility. The Hf-PER strategy offers a robust, sensitive, specific, and programmable tool for early cancer diagnosis, liquid biopsy, and point-of-care testing, addressing a critical need for reliable isothermal amplification in complex biological matrices.", "access_scope": "abstract", "pmid": "42830000", "doi": "10.1016/j.bios.2026.119288", "url": "https://pubmed.ncbi.nlm.nih.gov/42830000/"}], "drafts": []}, {"id": "n2s-4329ebeac403ffca12da", "title": "頻繁夜醒尿尿恐非正常老化 醫揭攝護腺4迷思「長期忽略影響大」 - 觸mii", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "頻繁夜醒尿尿恐非正常老化 醫揭攝護腺4迷思「長期忽略影響大」 - 觸mii", "publisher": "觸mii", "published_at": "2026-10-23T03:57:23Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMibEFVX3lxTE1LdDFfZ0VOME5uVGtyTXZGMjhWdlVGLVpVS0dpa1hyRlRodWp3VkJPaldVM21GT001R3ZHUURUMzdpcVhnTWdDdXFPY2FJM3AxZ0xDSmF6cUlCbGdwRHl4dHhKR3V4b2dYZDQ1Qg?oc=5"}], "drafts": []}, {"id": "n2s-3fc9f7620a1c10cc185b", "title": "FMOD marks a low-malignancy epithelial state in prostate cancer: an ECM-related prognostic signature with single-cell and functional validation.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "FMOD marks a low-malignancy epithelial state in prostate cancer: an ECM-related prognostic signature with single-cell and functional validation.", "publisher": "Cell adhesion \u0026 migration", "published_at": "2026-10-21T00:00:00Z", "date_precision": null, "summary": "Extracellular matrix (ECM) remodeling promotes prostate cancer progression, while the prognostic value and cellular context of ECM-related genes (ERGs) remain unclear. A 4-gene ERG signature for disease-free interval prediction was built using TCGA-PRAD data, and the hub gene Fibromodulin (FMOD) was validated in an external cohort via scRNA-seq, bulk deconvolution and siRNA knockdown. The signature stratified patient prognosis, and FMOD exerted the strongest protective effect. Despite higher bulk expression in tumor tissues, FMOD predicted better clinical outcomes. FMOD was enriched in a low-chromosomal-instability, low-proliferation epithelial subpopulation with enhanced stromal-immune crosstalk, and FMOD knockdown boosted cancer cell proliferation and colony formation. FMOD identifies a low-malignancy epithelial state linked to favorable prostate cancer prognosis, supporting cell state-resolved validation of ECM-related prognostic biomarkers.", "access_scope": "abstract", "pmid": "42904786", "doi": "10.1080/19336918.2026.2728740", "url": "https://pubmed.ncbi.nlm.nih.gov/42904786/"}], "drafts": []}, {"id": "n2s-3e54b54d3475280bd22e", "title": "Axonemal dynein gene dysfunction as a cause of male infertility: insights from DNAH family mutations.", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "Axonemal dynein gene dysfunction as a cause of male infertility: insights from DNAH family mutations.", "publisher": "Gene", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "Male infertility is a complex disorder and defective sperm motility is one of the most common reasons for impaired fertility. The dynein axonemal heavy chain (DNAH) gene family encode molecular motors that form the structure of cilia and sperm flagella. Abnormalities in several DNAH genes have already been confirmed to be causative factors responsible for male infertility conditions, mainly including asthenozoospermia, multiple morphological abnormalities of the sperm flagella (MMAF), and reproductive failure related to primary ciliary dyskinesia (PCD). Here, this review illustrates the current evidence regarding the involvement of members of the DNAH family in male infertility, along with summarizing their biological functions, genotypic and phenotypic correlations and clinical significance. Due to the breakthroughs of the technologies of whole-exome and whole-genome sequencing along with research with animal models and functional investigations, the diversity of reported causative DNAH mutations and their implications for the organization and function of sperm axonemes are currently better understood. DNAH1, DNAH8 and DNAH17 are the DNAH genes most frequently described as being involved in male infertility, though growing evidence also indicated that DNAH3, DNAH11, DNAH12 and DNAH14 also contribute to the male reproductive disorders. Implementation of testing DNAH genes into molecular diagnostics enhances the assessment of genes causing severe sperm motility disorders and aids genetic counseling of the affected families. Together with the genomic and functional data, further research will elucidate additional details for disease mechanisms and will bring benefit to more precise diagnosis and treatments of DNAH-associated male infertility.", "access_scope": "abstract", "pmid": "42838247", "doi": "10.1016/j.gene.2026.150435", "url": "https://pubmed.ncbi.nlm.nih.gov/42838247/"}], "drafts": []}, {"id": "n2s-26612eef7c7eff1146af", "title": "余天跟上洋流！與沈伯洋同場現身 挺友勤跑造勢「復出內情」曝光 - 四季線上4gTV", "date": "2026-10-23", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "余天跟上洋流！與沈伯洋同場現身 挺友勤跑造勢「復出內情」曝光 - 四季線上4gTV", "publisher": "四季線上4gTV", "published_at": "2026-10-22T04:10:46Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiV0FVX3lxTFBtOXo3UFd4REttT096S1FNTXNjb2hkQWNTcW4wZFoyU0JmV3Q4MXpwcy1ncXU4ckNMR3JVNmpMVDVwcEdyR0ZEWEV2ek5LdG5PXzhJTHBiOA?oc=5"}], "drafts": []}, {"id": "n2s-01fe58f4e18dd40f2a36", "title": "A novel multiplex digital PCR assay for simultaneous quantification of androgen receptor amplification, mutations, and splice variants in cell-free nucleic acids from metastatic castration-resistant prostate cancer.", "date": "2026-10-23", "status": "blocked", "warning": "禁止發布／流程測試或呼叫結果待釐清；此紀錄僅供稽核。", "revision": 1, "sources": [{"title": "A novel multiplex digital PCR assay for simultaneous quantification of androgen receptor amplification, mutations, and splice variants in cell-free nucleic acids from metastatic castration-resistant prostate cancer.", "publisher": "The journal of liquid biopsy", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "Somatic androgen receptor (AR) alterations including gene amplification, point mutations, and the AR-V7 splice variant occur in 50-70% of patients with metastatic castration-resistant prostate cancer (mCRPC) and drive resistance to AR-pathway inhibitors (ARPIs) in metastatic castration-resistant prostate cancer (mCRPC). However, current liquid biopsy approaches typically require separate cell-free DNA (cfDNA) and cfRNA workflows to evaluate these distinct alteration classes, increasing sample input requirements, assay complexity, and cost. Because plasma cell-free nucleic acid yield is often limited, an integrated assay capable of interrogating DNA and RNA-derived biomarkers from a single blood draw remain an unmet clinical need. Here we describe the development and proof-of-concept validation of a novel multiplex multimodal digital PCR (dPCR) assay that co-detects AR copy-number amplification, somatic point mutations (T878A), and the AR-V7 splice variant from plasma cell-free nucleic acids (cfNAs) in a single streamlined reaction. The assay employs RNase H-dependent PCR (rhPCR) primers with ultra-short amplicons (≤68 bp) that simultaneously interrogate both cfDNA and cfRNA, enabling multimodal detection without separate DNA and RNA workflows. Using prostate cancer cell lines with defined AR alteration status, the assay detected AR amplification at 2% of tumor DNA, quantified T878A mutations at a mutant allele frequency as low as 0.024%, and AR-V7 splicing variant with a sensitivity of 0.096% tumor cell fraction. In two mCRPC patient plasma samples, the assay tracked dynamic changes of these AR variants during ARPI therapy, revealing distinct patterns of clonal evolution that are consistent with treatment pressure and clinical outcomes. This multimodal dPCR platform provides a cost-effective, highly sensitive liquid biopsy tool for detection of clinically significant AR alterations and represents a foundation for a laboratory-developed test (LDT) to guide personalized therapy in mCRPC.", "access_scope": "abstract", "pmid": "42893057", "doi": "10.1016/j.jlb.2026.100672", "url": "https://pubmed.ncbi.nlm.nih.gov/42893057/"}], "drafts": []}];

 const q=$('query').value.trim().toLowerCase(),day=$('date').value;

 $('np-tabs').innerHTML=visible.map(a=>`<button role="tab" id="tab-${a.id}" aria-controls="article-${a.id}" tabindex="${a.id===selected?0:-1}" class="np-tab" data-id="${a.id}" aria-selected="${a.id===selected}">${esc(a.date.slice(5))}｜${esc(a.title)}${a.drafts.length?' · 有文案':''}</button>`).join('');
 renderContent(visible.find(a=>a.id===selected));
 const i=visible.findIndex(a=>a.id===selected);
 $('np-prev').disabled=i<=0;$('np-next').disabled=i<0||i>=visible.length-1;
 $('np-page-count').textContent=`${i+1} / ${visible.length} 題`;
 $('np-progress').style.width=visible.length?`${(i+1)/visible.length*100}%`:'0%';
 $('counts').textContent=`共 ${records.length} 題來源・${records.filter(a=>a.drafts.length).length} 題有文案・目前 ${visible.length} 題`;
 if(selected)history.replaceState(null,'','#'+selected);
}
function dates(){const days=[...new Set(records.filter(a=>a.date.startsWith(month)).map(a=>a.date))].sort().reverse();$('date').innerHTML='<option value="">全部日期</option>'+days.map(d=>`<option>${d}</option>`).join('')}
function jump(){const a=records.find(a=>a.id===location.hash.slice(1));if(a){month=a.date.slice(0,7);selected=a.id;$('query').value='';$('draft-only').checked=false;dates()}render()}
$('np-nav').addEventListener('click',e=>{const b=e.target.closest('[data-month]');if(b){month=b.dataset.month;dates();render()}});
$('np-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){selected=b.dataset.id;render();$('tab-'+selected).focus()}});
for(const id of ['date','draft-only'])$(id).addEventListener('change',render);
$('query').addEventListener('input',render);
function move(delta){const i=visible.findIndex(a=>a.id===selected),a=visible[i+delta];if(a){selected=a.id;render()}}
$('np-prev').onclick=()=>move(-1);$('np-next').onclick=()=>move(1);
$('np-tabs').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();if(e.key==='Home')selected=visible[0]?.id;else if(e.key==='End')selected=visible.at(-1)?.id;else move(e.key==='ArrowRight'?1:-1);render();$('tab-'+selected)?.focus()}});
$('np-stage').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const d=records.find(a=>a.id===selected).drafts.find(d=>d.platform===b.dataset.copy);try{await navigator.clipboard.writeText(d.text);b.textContent='已複製'}catch{b.textContent='請選取下方文字複製'}});
window.addEventListener('hashchange',jump);dates();jump();
</script>
</body></html>
