<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="男性泌尿科新聞與研究來源，及 FB、IG、Threads 待審草稿資料庫。">
<title>男性泌尿科｜新聞與社群衛教資料庫</title>
<style>

.np-root,
.np-root * {
  box-sizing: border-box;
}

.np-root {
  --np-navy: #2f4f9f;
  --np-blue: #536df5;
  --np-blue-2: #6d83ff;
  --np-ink: #18305f;
  --np-muted: #64759a;
  --np-sky: #eaf2ff;
  --np-paper: #fbfcff;
  --np-line: #c9d7f4;
  --np-soft-line: #e1e9fa;
  --np-coral: #ff755f;
  --np-green: #2f8a5b;
  --np-red-soft: #fff0ed;
  --np-shadow: 0 18px 46px rgba(28, 53, 111, 0.14);

  width: calc(100% - 32px);
  max-width: 1800px;
  margin: 16px auto;

  position: relative;
  overflow: hidden;

  border: 1px solid rgba(47, 79, 159, 0.14);
  border-radius: 28px;

  background:
    radial-gradient(circle at 8% 7%, rgba(83,109,245,.12), transparent 25rem),
    linear-gradient(145deg, #f5f8ff 0%, #fbfcff 52%, #eef3ff 100%);

  color: var(--np-ink);

  font-family:
    "Noto Sans TC",
    "Microsoft JhengHei",
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  box-shadow: var(--np-shadow);
  line-height: 1.7;
}

.np-root button,
.np-root input,
.np-root select,
.np-root textarea {
  font: inherit;
}

.np-root img,
.np-root iframe {
  max-width: 100%;
}

.np-root a {
  color: var(--np-blue);
}

.np-root a:hover {
  color: var(--np-navy);
}

/* Header */

.np-root .np-masthead {
  position: relative;
  min-height: 122px;

  display: flex;
  align-items: center;
  gap: 20px;

  padding: 22px 30px;

  color: #fff;

  background:
    linear-gradient(
      112deg,
      var(--np-navy) 0 57%,
      #3e60c8 57% 72%,
      var(--np-blue) 72% 100%
    );

  overflow: hidden;
}

.np-root .np-masthead::after {
  content: "";
  position: absolute;
  right: 10%;
  top: -20%;
  width: 160px;
  height: 140%;
  border-left: 7px solid rgba(255,255,255,.9);
  border-right: 7px solid rgba(255,255,255,.9);
  transform: skewX(-38deg);
  opacity: .88;
  pointer-events: none;
}

.np-root .np-brand-icon {
  flex: 0 0 auto;
  width: 72px;
  height: 72px;

  display: grid;
  place-items: center;

  border: 2px solid rgba(255,255,255,.75);
  border-radius: 20px 5px 20px 5px;

  background: rgba(255,255,255,.12);

  font-size: max(20px, 2rem);
}

.np-root .np-titleblock {
  position: relative;
  z-index: 1;
  min-width: 0;
}

.np-root .np-titleblock h1 {
  margin: 0;
  font-size: max(20px, clamp(1.5rem, 3vw, 2.45rem));
  line-height: 1.25;
  letter-spacing: .06em;
}

.np-root .np-titleblock p {
  margin: 8px 0 0;
  font-size: max(20px, clamp(.82rem, 1.4vw, 1rem));
  font-weight: 700;
  letter-spacing: .14em;
  opacity: .86;
}

/* Layout */

.np-root .np-layout {
  display: grid;
  grid-template-columns: clamp(230px, 17vw, 300px) minmax(0, 1fr);
  min-height: calc(100vh - 170px);
}

.np-root .np-sidebar {
  padding: 20px 14px 26px;

  border-right: 1px solid var(--np-line);

  background:
    linear-gradient(
      180deg,
      rgba(234,242,255,.94),
      rgba(247,250,255,.98)
    );
}

.np-root .np-sidebar-title {
  margin: 0 8px 12px;
  color: var(--np-muted);
  font-size: max(20px, .73rem);
  font-weight: 900;
  letter-spacing: .18em;
}

.np-root .np-nav {
  display: grid;
  gap: 6px;
}

.np-root .np-nav-button {
  width: 100%;
  min-height: 44px;

  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  align-items: center;
  gap: 8px;

  padding: 7px 9px;

  border: 0;
  border-radius: 14px 5px 14px 5px;

  color: #294274;
  background: transparent;

  text-align: left;
  cursor: pointer;

  transition:
    transform .18s ease,
    background .18s ease,
    color .18s ease,
    box-shadow .18s ease;
}

.np-root .np-nav-button:hover {
  background: #fff;
  transform: translateX(3px);
}

.np-root .np-nav-button[aria-current="true"] {
  color: #fff;
  background: linear-gradient(110deg, var(--np-navy), #4565cb);
  box-shadow: 0 9px 20px rgba(47,79,159,.2);
}

.np-root .np-nav-index {
  width: 29px;
  height: 29px;

  display: grid;
  place-items: center;

  border: 1px solid currentColor;
  border-radius: 9px 3px 9px 3px;

  font-size: max(20px, .72rem);
  font-weight: 900;
}

.np-root .np-nav-label {
  overflow: hidden;
  font-size: max(20px, .83rem);
  font-weight: 800;
  line-height: 1.25;
  text-overflow: ellipsis;
}

.np-root .np-main {
  min-width: 0;
  padding: 20px 22px 28px;
}

/* Tabs */

.np-root .np-tabs-wrap {
  margin-bottom: 15px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--np-line);
}

.np-root .np-tabs {
  display: flex;
  gap: 8px;

  padding: 1px 1px 8px;

  overflow-x: auto;
  scrollbar-width: thin;
}

.np-root .np-tab {
  flex: 0 0 auto;

  min-height: 39px;
  padding: 8px 14px;

  border: 1px solid var(--np-line);
  border-radius: 14px 5px 14px 5px;

  color: #395181;
  background: #fff;

  font-size: max(20px, .82rem);
  font-weight: 800;

  cursor: pointer;
}

.np-root .np-tab:hover {
  border-color: #95aae4;
  color: var(--np-navy);
}

.np-root .np-tab[aria-selected="true"] {
  color: #fff;
  border-color: var(--np-blue);
  background: var(--np-blue);
}

/* Stage */

.np-root .np-stage {
  position: relative;

  padding: clamp(14px, 2.2vw, 24px);

  border: 1px solid rgba(47,79,159,.14);
  border-radius: 24px 7px 24px 7px;

  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(
      135deg,
      rgba(83,109,245,.30),
      rgba(47,79,159,.04)
    ) border-box;

  min-height: clamp(560px, 68vh, 920px);
}

.np-root .np-page {
  display: none;
}

.np-root .np-page.is-active {
  display: block;
  animation: npFade .25s ease;
}

@keyframes npFade {
  from {
    opacity: 0;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.np-root .np-page-head {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  margin-bottom: 20px;
}

.np-root .np-page-number {
  flex: 0 0 auto;

  min-width: 48px;
  height: 48px;

  display: grid;
  place-items: center;

  padding: 0 10px;

  border-radius: 15px 4px 15px 4px;

  color: #fff;
  background: linear-gradient(135deg, var(--np-navy), var(--np-blue));

  font-weight: 900;
  font-size: max(20px, .86rem);
}

.np-root .np-page-head h2 {
  margin: 0;
  color: var(--np-ink);
  font-size: max(20px, clamp(1.35rem, 2.7vw, 2rem));
  line-height: 1.3;
}

.np-root .np-page-head p {
  margin: 4px 0 0;
  color: var(--np-muted);
  font-size: max(20px, .9rem);
}

.np-root .np-section {
  scroll-margin-top: 16px;
}

.np-root .np-section h3 {
  margin: 0 0 13px;
  padding-bottom: 9px;

  border-bottom: 2px solid var(--np-sky);

  color: var(--np-navy);

  font-size: max(20px, clamp(1.05rem, 2vw, 1.3rem));
}

.np-root .np-section h4 {
  margin: 18px 0 8px;
  color: var(--np-ink);
}

/* Cards */

.np-root .np-card-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.np-root .np-card {
  min-width: 0;
  padding: 18px;

  border: 1px solid var(--np-soft-line);
  border-radius: 18px 5px 18px 5px;

  background: #fff;

  box-shadow: 0 9px 24px rgba(29,52,103,.07);
}

.np-root .np-card h4 {
  margin: 0 0 7px;
  color: var(--np-navy);
}

.np-root .np-callout {
  margin: 16px 0;
  padding: 16px 18px;

  border-left: 5px solid var(--np-blue);
  border-radius: 4px 14px 14px 4px;

  background: var(--np-sky);

  font-weight: 700;
}

.np-root .np-callout.warning {
  border-left-color: var(--np-coral);
  background: var(--np-red-soft);
}

.np-root .np-callout.success {
  border-left-color: var(--np-green);
  background: #edf9f3;
}

.np-root .np-quote {
  margin: 16px 0;
  padding: 16px 20px;

  border-left: 5px solid var(--np-coral);

  background: linear-gradient(135deg, #fff7f4, #fff);

  color: #6f3f36;

  font-size: max(20px, 1.04rem);
  font-weight: 800;
}

.np-root .np-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;

  margin: 15px 0;
}

.np-root .np-keyword {
  padding: 8px 13px;

  border: 1px solid #b8c9f4;
  border-radius: 999px;

  background: #f7f9ff;

  color: var(--np-navy);

  font-weight: 800;
}

/* Message */

.np-root .np-message {
  overflow: hidden;

  border: 1px solid var(--np-line);
  border-radius: 18px 5px 18px 5px;

  background: #fff;
}

.np-root .np-message-head {
  padding: 10px 14px;

  color: #fff;
  background: linear-gradient(110deg, var(--np-navy), #4e6bd2);

  font-size: max(20px, .82rem);
  font-weight: 800;
}

.np-root .np-message-body {
  padding: 18px;
  white-space: pre-line;
}

.np-root .np-fake-action {
  display: inline-block;
  margin-top: 10px;
  padding: 9px 15px;

  border-radius: 8px;

  background: var(--np-coral);
  color: #fff;

  font-weight: 900;
}

/* Images */

.np-root .np-image-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 15px;
}

.np-root .np-image-card {
  margin: 0;
  padding: 10px;

  border: 1px solid var(--np-line);
  border-radius: 18px 5px 18px 5px;

  background: #fff;
}

.np-root .np-image-card img {
  width: 100%;
  height: auto;
  display: block;

  border-radius: 12px 4px 12px 4px;

  object-fit: contain;
}

.np-root .np-image-card figcaption {
  padding: 9px 5px 2px;

  color: var(--np-muted);
  font-size: max(20px, .8rem);
  font-weight: 800;
  text-align: center;
}

/* Embedded media */

.np-root .np-embed-box {
  margin: 15px 0;

  overflow: hidden;

  border: 1px solid var(--np-line);
  border-radius: 18px 5px 18px 5px;

  background: #f5f8ff;
}

.np-root .np-embed-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  padding: 10px 14px;

  border-bottom: 1px solid var(--np-line);

  background: #edf3ff;
}

.np-root .np-embed-title {
  min-width: 0;

  color: var(--np-ink);
  font-weight: 900;
  font-size: max(20px, .88rem);
}

.np-root .np-external-link {
  flex: 0 0 auto;

  display: inline-flex;
  align-items: center;
  gap: 5px;

  padding: 6px 10px;

  border: 1px solid #aabce9;
  border-radius: 9px 3px 9px 3px;

  color: var(--np-navy) !important;
  background: #fff;

  font-size: max(20px, .75rem);
  font-weight: 900;
  text-decoration: none;
}

.np-root .np-video {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;

  background: #0c1630;
}

.np-root .np-video iframe {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  display: block;

  border: 0;
}

.np-root .np-site-frame {
  width: 100%;
  height: clamp(520px, 70vh, 900px);

  display: block;

  border: 0;

  background: #fff;
}

.np-root .np-site-note {
  padding: 10px 14px;

  border-top: 1px solid var(--np-line);

  color: var(--np-muted);

  background: #fbfcff;

  font-size: max(20px, .75rem);
}

/* Tables */

.np-root .np-table-wrap {
  width: 100%;
  overflow-x: auto;

  margin: 15px 0;

  border: 1px solid var(--np-line);
  border-radius: 15px 5px 15px 5px;
}

.np-root .np-table {
  width: 100%;
  min-width: 720px;

  border-collapse: collapse;

  background: #fff;
}

.np-root .np-table th,
.np-root .np-table td {
  padding: 11px 12px;

  border-bottom: 1px solid #e2e9f7;

  vertical-align: top;
  text-align: left;
}

.np-root .np-table th {
  color: #fff;
  background: var(--np-navy);

  font-size: max(20px, .82rem);
}

.np-root .np-table td {
  font-size: max(20px, .86rem);
}

.np-root .np-table tr:last-child td {
  border-bottom: 0;
}

.np-root .np-table tr:nth-child(even) td {
  background: #f8faff;
}

/* Attack chain */

.np-root .np-chain {
  display: grid;
  grid-template-columns:
    minmax(0,1fr) auto
    minmax(0,1fr) auto
    minmax(0,1fr) auto
    minmax(0,1fr) auto
    minmax(0,1fr);

  align-items: center;
  gap: 8px;

  margin: 25px 0;
}

.np-root .np-chain-step {
  min-height: 94px;

  display: grid;
  place-items: center;

  padding: 12px;

  border: 1px solid #b9c9ee;
  border-radius: 17px 5px 17px 5px;

  background: linear-gradient(145deg, #fff, #edf3ff);

  color: var(--np-navy);

  font-weight: 900;
  text-align: center;
}

.np-root .np-chain-arrow {
  color: var(--np-coral);
  font-size: max(20px, 1.4rem);
  font-weight: 900;
}

/* Stop Check Verify */

.np-root .np-scv {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 14px;

  margin: 18px 0;
}

.np-root .np-scv-card {
  padding: 18px;

  border: 1px solid var(--np-line);
  border-radius: 19px 5px 19px 5px;

  background: #fff;
}

.np-root .np-scv-letter {
  width: 48px;
  height: 48px;

  display: grid;
  place-items: center;

  margin-bottom: 10px;

  border-radius: 14px 4px 14px 4px;

  color: #fff;
  background: var(--np-blue);

  font-size: max(20px, 1.2rem);
  font-weight: 900;
}

.np-root .np-scv-card:nth-child(1) .np-scv-letter {
  background: var(--np-coral);
}

.np-root .np-scv-card:nth-child(3) .np-scv-letter {
  background: var(--np-green);
}

/* Puzzle */

.np-root .np-puzzle {
  display: grid;
  gap: 10px;
}

.np-root .np-puzzle-step {
  position: relative;

  padding: 14px 15px 14px 56px;

  border: 1px solid var(--np-line);
  border-radius: 15px 5px 15px 5px;

  background: #fff;
}

.np-root .np-puzzle-step::before {
  content: attr(data-step);

  position: absolute;
  left: 13px;
  top: 13px;

  width: 29px;
  height: 29px;

  display: grid;
  place-items: center;

  border-radius: 9px 3px 9px 3px;

  color: #fff;
  background: var(--np-blue);

  font-size: max(20px, .75rem);
  font-weight: 900;
}

/* Checklist */

.np-root .np-check-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;

  padding: 0;
  margin: 0;

  list-style: none;
}

.np-root .np-check-list li {
  position: relative;

  padding: 12px 14px 12px 42px;

  border: 1px solid var(--np-soft-line);
  border-radius: 13px 4px 13px 4px;

  background: #fff;
}

.np-root .np-check-list li::before {
  content: "✓";

  position: absolute;
  left: 13px;
  top: 10px;

  color: var(--np-green);

  font-weight: 900;
}

/* Prompt */

.np-root .np-prompt {
  position: relative;

  margin: 15px 0;
  padding: 18px;

  overflow-x: auto;

  border-radius: 14px 4px 14px 4px;

  color: #eaf2ff;
  background: #17264b;

  font-family:
    "JetBrains Mono",
    Consolas,
    "Microsoft JhengHei",
    monospace;

  white-space: pre-wrap;
}

/* Controls */

.np-root .np-controls {
  display: grid;
  grid-template-columns: 48px minmax(0,1fr) 48px;
  align-items: center;
  gap: 12px;

  margin-top: 17px;
}

.np-root .np-control {
  width: 48px;
  height: 42px;

  display: grid;
  place-items: center;

  border: 1px solid var(--np-line);
  border-radius: 14px 5px 14px 5px;

  color: var(--np-navy);
  background: #fff;

  font-size: max(20px, 1.2rem);
  font-weight: 900;

  cursor: pointer;
}

.np-root .np-control:hover:not(:disabled) {
  color: #fff;
  background: var(--np-navy);
}

.np-root .np-control:disabled {
  opacity: .3;
  cursor: default;
}

.np-root .np-progress {
  height: 8px;

  overflow: hidden;

  border-radius: 999px;
  background: #e4ebfa;
}

.np-root .np-progress-bar {
  width: 0;
  height: 100%;

  border-radius: inherit;

  background:
    linear-gradient(
      90deg,
      var(--np-navy),
      var(--np-blue),
      var(--np-coral)
    );

  transition: width .22s ease;
}

.np-root .np-page-count {
  grid-column: 2;
  justify-self: center;

  margin-top: -6px;

  color: var(--np-muted);

  font-size: max(20px, .74rem);
  font-weight: 900;
  letter-spacing: .12em;
}

/* Footer */

.np-root .np-footer {
  padding: 16px 22px;

  border-top: 1px solid var(--np-line);

  color: var(--np-muted);
  background: #f0f5ff;

  font-size: max(20px, .76rem);
  text-align: center;
}

/* Accessibility */

.np-root .np-nav-button:focus-visible,
.np-root .np-tab:focus-visible,
.np-root .np-control:focus-visible,
.np-root .np-external-link:focus-visible {
  outline: 3px solid rgba(255,117,95,.5);
  outline-offset: 2px;
}

/* Wide desktop / 16:9 classroom displays */

@media (min-width: 1440px) {

  .np-root {
    width: calc(100% - 48px);
    max-width: 1800px;
  }

  .np-root .np-main {
    padding: 24px 28px 32px;
  }

  .np-root .np-stage {
    padding: clamp(20px, 1.8vw, 32px);
  }

  .np-root .np-page-head h2 {
    font-size: max(20px, clamp(1.55rem, 2vw, 2.2rem));
  }
}


/* Tablet */

@media (max-width: 980px) {

  .np-root {
    border-radius: 20px;
  }

  .np-root .np-layout {
    grid-template-columns: 190px minmax(0,1fr);
  }

  .np-root .np-main {
    padding: 15px;
  }

  .np-root .np-card-grid {
    grid-template-columns: 1fr;
  }

  .np-root .np-chain {
    grid-template-columns: 1fr;
  }

  .np-root .np-chain-arrow {
    transform: rotate(90deg);
    text-align: center;
  }
}

/* Mobile */

@media (max-width: 720px) {

  .np-root {
    width: 100%;
    margin: 0 auto;
    border-radius: 14px;
  }

  .np-root .np-masthead {
    min-height: 92px;
    padding: 15px;
  }

  .np-root .np-brand-icon {
    width: 52px;
    height: 52px;

    border-radius: 14px 4px 14px 4px;

    font-size: max(20px, 1.4rem);
  }

  .np-root .np-titleblock h1 {
    letter-spacing: .02em;
  }

  .np-root .np-titleblock p {
    display: none;
  }

  .np-root .np-layout {
    display: block;
    min-height: 0;
  }

  .np-root .np-sidebar {
    padding: 10px;

    border-right: 0;
    border-bottom: 1px solid var(--np-line);
  }

  .np-root .np-sidebar-title {
    display: none;
  }

  .np-root .np-nav {
    display: flex;
    gap: 6px;

    overflow-x: auto;

    padding-bottom: 5px;
  }

  .np-root .np-nav-button {
    flex: 0 0 auto;

    width: auto;
    max-width: 170px;
  }

  .np-root .np-nav-label {

<script>
'use strict';
const records=[{"id": "n2s-fb702f8b673217e25d9d", "title": "Clinical phenotypes and multidomain sexual function in men with ejaculatory and orgasmic dysfunction: a cross-sectional analysis of the CLIMAX Registry.", "date": "2026-10-26", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Clinical phenotypes and multidomain sexual function in men with ejaculatory and orgasmic dysfunction: a cross-sectional analysis of the CLIMAX Registry.", "publisher": "Sexual medicine", "published_at": "2026-10-23T00:00:00Z", "date_precision": null, "summary": "INTRODUCTION: Delayed ejaculation (DE) and anorgasmia/anejaculation are frequently grouped together, yet whether they represent distinct clinical phenotypes or points along a shared spectrum remains unclear. Relationships between erectile function and other sexual function domains have been characterized primarily in men with erectile dysfunction rather than ejaculatory or orgasmic dysfunction. We sought to characterize clinical phenotypes and multidomain sexual function among men with ejaculatory or orgasmic dysfunction using baseline data from the CLIMAX Registry.\nMETHODS: We performed a cross-sectional secondary analysis of baseline data from 43 participants enrolled in the prospective, multi-institutional CLIMAX Registry. The phenotype analysis included isolated DE (n = 14) and isolated anorgasmia/anejaculation (n = 13), defined as selection of these diagnoses without another ejaculatory/orgasmic diagnosis. These groups were compared using clinical, psychosocial, and sexual function characteristics. A separate analysis of the broader registry cohort evaluated relationships between erectile function and other sexual function domains. Participants with complete International Index of Erectile Function erectile function domain (IIEF-EF) scores were stratified by erectile function severity (IIEF-EF ≥17 [none/mild erectile dysfunction] vs IIEF-EF ≤16 [moderate/severe erectile dysfunction]). Continuous variables were compared using Mann-Whitney U tests, categorical variables using Fisher exact tests, and erectile function and orgasmic function were evaluated using Pearson correlation.\nRESULTS: The overall cohort included 43 participants (mean age, 56.4 ± 15.7 years). Participants with isolated anorgasmia/anejaculation were significantly older than those with isolated DE (67.6 ± 14.6 vs 53.3 ± 12.8 years; P = .004). Beck Depression Inventory scores were higher among participants with DE (14.3 ± 12.3 vs 4.8 ± 4.1; P = .013), whereas standardized sexual function domains did not differ significantly between phenotypes. Notably, 6 of 13 participants (46.2%) in the combined anorgasmia/anejaculation category reported ability to achieve orgasm. Erectile and orgasmic function were not significantly correlated (r = -0.03; P = .84; n = 37), and 7 of 22 participants (31.8%) with unassisted erections sufficient for penetration reported inability to achieve orgasm. Moderate/severe erectile dysfunction was associated with lower intercourse satisfaction (P = .017) but not orgasmic function.\nCONCLUSIONS: Diagnostic phenotype and erectile function alone incompletely characterized sexual function in this exploratory cohort. These findings support multidimensional phenotyping of uncommon ejaculatory and orgasmic disorders and highlight the value of prospective registries for clinical characterization.", "access_scope": "abstract", "pmid": "42921230", "doi": "10.1093/sexmed/qfag097", "url": "https://pubmed.ncbi.nlm.nih.gov/42921230/"}], "drafts": [{"platform": "facebook", "text": "大家平常會關注男性健康的研究新知嗎？最近有一項針對特定男性功能障礙的橫斷面分析研究，帶我們更深入了解不同的表現型與心理狀態關聯。這篇研究納入了 43 位參與者，探討了包含延遲射精與無性高潮等狀況，並分析其臨床與心理特徵。研究結果發現，單純無性高潮的參與者平均年齡相對較高，而有延遲射精困擾的參與者在貝克憂鬱量表的分數則較高。此外，研究也發現勃起功能與高潮功能之間並未呈現顯著相關，這顯示單靠單一診斷表現型或勃起功能，並無法完全涵蓋整體的性功能狀況。這類研究有助於醫界未來進行更多元且全面的評估。大家怎麼看男性健康的多元評估呢？歡迎留言分享你的想法！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42921230/"}, {"platform": "instagram", "text": "你對男性健康研究了解多少呢？一起來看看關於射精與高潮功能的新研究發現！這是一項針對 43 位參與者的橫斷面分析研究，重點整理如下：\n\n📌 族群年齡差異：單純無性高潮的參與者平均年齡顯著高於單純延遲射精的參與者。\n📌 心理量表表現：單純延遲射精的參與者在貝克憂鬱量表中的分數相對較高。\n📌 功能相關性探討：研究指出，勃起功能與高潮功能並未呈現顯著相關，顯示單一指標無法完整代表全面的性功能狀態。\n\n這類探討提醒我們，面對較少見的射精與高潮障礙時，需要更多面向的評估與理解。你平常會關注這類醫療新知嗎？歡迎留言跟我們聊聊！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42921230/"}, {"platform": "threads", "text": "大家平常會注意男性健康相關的醫療研究嗎？最近有一項針對 43 位參與者的橫斷面研究指出，單純無性高潮的參與者平均年齡較高，而單純延遲射精的參與者在憂鬱量表的分數則較高。研究也發現，勃起功能與高潮功能並未呈現顯著相關，單靠單一指標無法完整評估整體的性功能。這提醒我們需要更全面的視角來看待不同的生理與心理狀況。你對這類研究有什麼看法呢？\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42921230/"}]}, {"id": "n2s-c243669459a5e28eeec7", "title": "Peripheral and selective venous liquid biopsy profiling in localized prostate cancer: A pilot feasibility study.", "date": "2026-10-26", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Peripheral and selective venous liquid biopsy profiling in localized prostate cancer: A pilot feasibility study.", "publisher": "The journal of liquid biopsy", "published_at": "2026-10-01T00:00:00Z", "date_precision": null, "summary": "BACKGROUND: Liquid biopsy profiling via next-generation sequencing (NGS) is increasingly being used in prostate cancer to identify actionable genomic alterations, monitor disease dynamics, and provide prognostic information. However, the circulating tumor DNA (ctDNA) fraction correlates with disease burden, often remaining near the analytical limit of detection in localized disease. Accordingly, strategies to enhance the molecular characterization in earlier-stage disease represent a clinically relevant priority.\nMETHODS: We conducted a retrospective, single-center observational analysis in a cohort of patients with localized prostate cancer undergoing liquid biopsy. Patients underwent peripheral venous sampling for genomic profiling. When peripheral testing failed to identify genomic alterations or was non-informative, patients proceeded to selective venous blood sampling within the cavo-iliac venous compartment. The primary outcome was the detection rate of reportable genomic alterations in peripheral blood, while exploratory outcomes included findings from selective sampling.\nRESULTS: Thirty-one patients were enrolled. Peripheral blood liquid biopsy was evaluable in 28 patients. Genomic alterations were detected in 20 of them (20/28, 71.4%; 95% CI, 51.3-86.8%). Patients most frequently harbored mutations in ATM (21.4%), RB1 (14.3%), and BRCA1 or BRCA2 (7.1% each). Eight patients underwent selective venous sampling, with 4 out of 8 (50.0%) demonstrating the presence of at least one genomic alteration. Conversion to mutation-positive occurred in two patients (50.0%) who initially lacked detectable alterations in peripheral blood sampling. Across all available peripheral and selective samples, at least one reportable genomic alteration was identified in 23 of the 31 enrolled patients (74.2%).\nCONCLUSIONS: Our findings demonstrate a high prevalence of genomic mutations in localized prostate cancer. Selective venous sampling was feasible and safe in this small exploratory cohort and provided additional molecular findings in selected patients. These hypothesis-generating data support selective sampling as a potential complementary approach for molecular profiling in localized prostate cancer, deserving prospective validation.", "access_scope": "abstract", "pmid": "42927017", "doi": "10.1016/j.jlb.2026.100499", "url": "https://pubmed.ncbi.nlm.nih.gov/42927017/"}], "drafts": [{"platform": "facebook", "text": "大家知道局限性攝護腺癌在進行液態切片時，常常會遇到循環腫瘤DNA濃度偏低、不易檢測到的情況嗎？近期一項回顧性單中心觀察性分析探討了這個議題，一起來看看相關的學術發現。這項研究納入了31名局限性攝護腺癌患者，探討透過次世代定序進行液態切片基因分型的表現。研究指出，周邊血液液態切片在可評估的患者中，最常檢測到的基因突變包含ATM、RB1以及BRCA1或BRCA2等。對於周邊檢測未發現突變的患者，研究進一步評估了選擇性靜脈血液採樣作為輔助方法的可能性。這屬於小規模的探索性數據，仍需要未來更多前瞻性研究來進一步驗證。大家對於癌症基因檢測與檢驗技術的發展有什麼看法呢？歡迎在下方留言一起交流討論。\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42927017/"}, {"platform": "instagram", "text": "面對局限性攝護腺癌，醫師和研究人員一直在尋找更準確掌握腫瘤基因特徵的方法。液態切片是目前常被討論的技術之一，但早期或局限性病灶的循環腫瘤DNA往往較低，這也是臨床上需要克服的挑戰。近期一項回顧性觀察研究帶來了以下發現：✨ 評估周邊血液液態切片：在可評估的患者中，部分檢測出特定的基因突變，如ATM、RB1與BRCA1或BRCA2。✨ 探索性選擇性靜脈採樣：針對周邊檢測未有發現的患者進行選擇性採樣，在部分個案中提供了額外的分子檢測資訊。這是一項小規模的探索性研究，相關結果仍需更多前瞻性驗證。你對目前的癌症分子檢測技術了解多少？歡迎留言或收藏這篇分享給需要的朋友。\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42927017/"}, {"platform": "threads", "text": "大家平時會關注癌症醫療新知的發展嗎？近期一項針對局限性攝護腺癌的回顧性研究發現，透過次世代定序進行液態切片，有助於了解患者的基因突變狀況，例如常見的ATM、RB1等基因變異。不過因為早期腫瘤的循環腫瘤DNA較少，檢測常面臨挑戰。研究也初步探討了選擇性靜脈採樣作為輔助的可行性，但這仍屬於小規模的探索性數據，需要更多前瞻性研究來證實。大家覺得未來這類檢測技術會如何發展呢？\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42927017/"}]}, {"id": "n2s-3e54b54d3475280bd22e", "title": "Axonemal dynein gene dysfunction as a cause of male infertility: insights from DNAH family mutations.", "date": "2026-10-26", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Axonemal dynein gene dysfunction as a cause of male infertility: insights from DNAH family mutations.", "publisher": "Gene", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "Male infertility is a complex disorder and defective sperm motility is one of the most common reasons for impaired fertility. The dynein axonemal heavy chain (DNAH) gene family encode molecular motors that form the structure of cilia and sperm flagella. Abnormalities in several DNAH genes have already been confirmed to be causative factors responsible for male infertility conditions, mainly including asthenozoospermia, multiple morphological abnormalities of the sperm flagella (MMAF), and reproductive failure related to primary ciliary dyskinesia (PCD). Here, this review illustrates the current evidence regarding the involvement of members of the DNAH family in male infertility, along with summarizing their biological functions, genotypic and phenotypic correlations and clinical significance. Due to the breakthroughs of the technologies of whole-exome and whole-genome sequencing along with research with animal models and functional investigations, the diversity of reported causative DNAH mutations and their implications for the organization and function of sperm axonemes are currently better understood. DNAH1, DNAH8 and DNAH17 are the DNAH genes most frequently described as being involved in male infertility, though growing evidence also indicated that DNAH3, DNAH11, DNAH12 and DNAH14 also contribute to the male reproductive disorders. Implementation of testing DNAH genes into molecular diagnostics enhances the assessment of genes causing severe sperm motility disorders and aids genetic counseling of the affected families. Together with the genomic and functional data, further research will elucidate additional details for disease mechanisms and will bring benefit to more precise diagnosis and treatments of DNAH-associated male infertility.", "access_scope": "abstract", "pmid": "42838247", "doi": "10.1016/j.gene.2026.150435", "url": "https://pubmed.ncbi.nlm.nih.gov/42838247/"}], "drafts": [{"platform": "facebook", "text": "面對男性生育能力的問題，常讓人感到不知所措，其實精子活動力異常是常見的原因之一。💡 這篇文獻回顧整理了相關研究，帶大家了解其中的科學進展。\n\n🔍 什麼是 DNAH 基因家族？\n研究指出，DNAH 基因家族負責編碼構成纖毛與精子鞭毛結構的分子馬達。當這些基因出現異常，可能會影響精子結構與活動力，進而與精子無力症、精子鞭毛多發性形態異常（MMAF）等情況有關。\n\n🔬 常見的相關基因有哪些？\n在眾多研究中，DNAH1、DNAH8 與 DNAH17 是最常被描述與男性生育問題相關的基因，此外 DNAH3、DNAH11、DNAH12 和 DNAH14 也受到關注。\n\n🧬 分子診斷的應用與未來\n隨著基因定序技術的進步，檢測 DNAH 基因有助於更精準地評估嚴重的精子活動力異常，也能為受影響的家庭提供更好的遺傳諮詢方向。\n\n大家平時會關注健康檢查中的基因檢測資訊嗎？歡迎留言分享你的想法！💬\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42838247/"}, {"platform": "instagram", "text": "你有聽過基因與男性生育能力的關聯嗎？🔍 男性生育問題是一個複雜的健康議題，其中精子活動力異常是常見的原因。\n\n帶大家快速看懂文獻提到的重點：\n\n🧬 基因家族的角色\nDNAH 基因家族負責形塑精子鞭毛的結構，當中的異常已被證實與多種精子活動力與形態異常有關。\n\n🧪 常見受關注的基因\n研究指出 DNAH1、DNAH8、DNAH17 以及 DNAH3、DNAH11、DNAH12、DNAH14 等基因都與男性生殖系統健康有關聯。\n\n💡 臨床與診斷意義\n透過次世代定序等技術，將基因檢測納入分子診斷，有助於更進一步了解原因並協助遺傳諮詢。\n\n點擊收藏這篇，隨時複習實用的健康小知識！✨\n\n你對哪一種健康檢查最感興趣呢？在底下留言告訴我們吧 👇\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42838247/"}, {"platform": "threads", "text": "精子活動力不好是什麼原因造成的？🤔\n\n近期一篇文獻回顧探討了 DNAH 基因家族與男性生育問題的關聯。研究提到，DNAH 基因異常會影響精子鞭毛的結構，進而與精子無力症或型態異常有關。\n\n隨著基因檢測技術的進步，這些發現有助於更精準地評估與協助遺傳諮詢。\n\n大家會想透過基因檢測來多了解自己的身體狀況嗎？留言聊聊吧！👇✨\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42838247/"}]}, {"id": "n2s-ab94b9d76d6c1909fcd8", "title": "一晚狂起身4次「確診攝護腺肥大」！醫靠2招得救了：不再夜尿 - 三立新聞", "date": "2026-10-26", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "一晚狂起身4次「確診攝護腺肥大」！醫靠2招得救了：不再夜尿 - 三立新聞", "publisher": "三立新聞", "published_at": "2026-10-25T08:51:00Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE1wamN2OGZmWVFGck5kd216azE2UVpxbW9rVEhzbVYxRHVJOUg5cFMxNkUwYXZPRWsydHIwU1JhM256ZG83QU8zalNxel_SAUxBVV95cUxNcGpjdjhmZllRRnJOZHdtemsxNlFacW1va1RIc21WMUR1STlIOXBTMTZFMGF2T0VrMnRyMFNSYTNuemRvN0FPM2pTcXpf?oc=5"}], "drafts": []}, {"id": "n2s-92b298053b28aae0e091", "title": "美國嬌生前列腺癌口服藥JNJ-6143早期試驗報捷，69%患者腫瘤縮小 - BigGo 財經", "date": "2026-10-26", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "美國嬌生前列腺癌口服藥JNJ-6143早期試驗報捷，69%患者腫瘤縮小 - BigGo 財經", "publisher": "BigGo 財經", "published_at": "2026-10-25T10:25:00Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiekFVX3lxTE9sRjJNb1hBcXFDaER3T3Y0QjR5REVRQ2FfMTlLbzMwYmI5ZlczaURqTVNyMW1XUC1wZlBzVW5aajEzTVZoeGhNZHNybmRidjNLaGk4dFZMWmN3SjJwai1BbEFYNzFfVWh3UlZRNzFYUDlIZGRxRF8zRHB3?oc=5"}], "drafts": []}, {"id": "n2s-8d6ed70f8fd6c93d71e0", "title": "Erratum: [Corrigendum] Androgen deprivation therapy has no effect on Pim-1 expression in a mouse mo n2s-38b9190ec38f47ae12fd", "title": "討論牆 | 別補過頭！醫推「保養攝護腺」3飲食 預防肥大、改善排尿障礙 - LINE TODAY", "date": "2026-10-26", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "討論牆 | 別補過頭！醫推「保養攝護腺」3飲食 預防肥大、改善排尿障礙 - LINE TODAY", "publisher": "LINE TODAY", "published_at": "2026-10-25T10:42:43Z", "date_precision": null, "summary": "", "access_scope": "title_only", "pmid": null, "doi": null, "url": "https://news.google.com/rss/articles/CBMiZEFVX3lxTE1KLVBDU1ktem91OFdWYmdtX2J6Y3lGZDB1VFpqVE55MkxGcVRUZUgzVnFRdFFBUFpySW1Nay1reTdDcy1mU2F5ZzNzNk9abkFCS21MLU8tbUxUd1dFZnBnbWF4SUI?oc=5"}], "drafts": []}, {"id": "n2s-8ba53079934bfe339ae2", "title": "Purulent cardiac tamponade associated with necrotic mediastinal lymphadenopathy: Multimodality imaging of a presumed mediastinal-pericardial pathway.", "date": "2026-10-25", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "Purulent cardiac tamponade associated with necrotic mediastinal lymphadenopathy: Multimodality imaging of a presumed mediastinal-pericardial pathway.", "publisher": "Radiology case reports", "published_at": "2026-10-05T00:00:00Z", "date_precision": null, "summary": "Purulent pericarditis is an uncommon but potentially fatal condition that may rapidly progress to cardiac tamponade. Contiguous spread from adjacent thoracic disease is a recognized mechanism; however, imaging documentation of a presumed mediastinal-pericardial pathway in association with necrotic mediastinal lymphadenopathy remains uncommon. We describe the case of a 72-year-old man with recently diagnosed low-grade prostate adenocarcinoma and a concomitant radiologically suspected primary right upper lobe lung malignancy. Baseline FDG PET/CT performed on 19 March 2026 demonstrated intensely hypermetabolic right upper lobe pulmonary lesions and FDG-avid mediastinal lymphadenopathy, including a supracarinal nodal station with central photopenia and corresponding central hypoattenuation, suggesting pre-existing necrotic change. On 11 May 2026, the patient presented with progressive dyspnea, hemodynamic compromise, and echocardiographic evidence of cardiac tamponade. Urgent subxiphoid pericardiocentesis yielded grossly purulent material. Cytology showed abundant neutrophilic inflammatory material without evidence of malignant cells. Gram stain, aerobic and anaerobic bacterial cultures, blood cultures, fungal cultures, and mycobacterial testing did not identify a causative pathogen. Contrast-enhanced chest CT performed on 13 May 2026 because of rapid pericardial fluid re-accumulation demonstrated a right lower paratracheal/anterior supracarinal nodal conglomerate with more extensive liquefactive necrosis, superior vena cava infiltration, and close apparent contiguity with the superior pericardial recess. Associated circumferential pericardial effusion, pericardial thickening, and pericardial enhancement were consistent with active pericarditis. This case highlights the complementary role of FDG PET/CT and contrast-enhanced CT in suggesting a presumed mediastinal-pericardial route in a patient with recurrent purulent pericardial effusion and necrotic mediastinal lymphadenopathy.", "access_scope": "abstract", "pmid": "42890963", "doi": "10.1016/j.radcr.2026.09.038", "url": "https://pubmed.ncbi.nlm.nih.gov/42890963/"}], "drafts": [{"platform": "facebook", "text": "大家平常有關心過心臟周邊組織的健康狀況嗎？心包膜炎是一種較少見但可能很嚴重的狀況，如果沒有注意，有時可能會迅速發展成心臟壓塞。近期醫學文獻中記錄了一個值得關注的病例，探討了胸腔病灶與心包膜之間的可能關聯。🔍 在這個病例中，有一位患者同時面臨低度攝護腺腺癌以及疑似右上葉肺部惡性腫瘤的情況。透過正子斷層造影與顯影電腦斷層的輔助，醫師得以觀察到縱膈腔淋巴結壞死與心包膜病變之間的影像學特徵。這顯示出高階影像檢查在評估複雜胸腔變化時的重要角色。醫療團隊會依據詳細的檢查結果來追蹤病況，這也提醒我們，面對複雜的胸腔與心臟周邊健康問題，需要仰賴完整的影像評估來協助釐清。大家身邊也有在定期追蹤健康檢查的朋友嗎？歡迎留言分享你對健康檢查與影像追蹤的看法！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42890963/"}, {"platform": "instagram", "text": "平常做健康檢查時，大家會特別注意胸腔與心臟周邊的檢查報告嗎？🩺 醫學文獻上曾記錄過罕見的化膿性心包膜炎病例，帶我們了解胸腔病灶的潛在影響：\n\n📌 什麼是化膿性心包膜炎？\n這是一種少見但可能相當危險的狀況，有時可能與鄰近胸腔疾病的擴散有關。\n\n📌 影像檢查的重要性\n透過不同的影像工具如正子斷層造影與顯影電腦斷層，有助於醫師觀察縱膈腔淋巴結變化與心包膜之間的關聯。\n\n面對複雜的身體狀況，完整的醫學檢查與持續追蹤是不可或缺的。如果你對今天的醫療資訊感興趣，記得按讚並收藏起來，隨時關注更多健康新知！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42890963/"}, {"platform": "threads", "text": "大家知道胸腔內部的組織變化有時也會互相影響嗎？🩺 醫學文獻記錄了一個罕見病例，探討化膿性心包膜炎與縱膈腔淋巴結壞死之間的關聯，並透過正子斷層造影與電腦斷層來觀察影像特徵。這讓我們看到完整影像檢查在評估複雜胸腔問題時的重要性。你身邊也有定期做健康檢查的習慣嗎？一起來聊聊吧！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42890963/"}]}, {"id": "n2s-5b2eeb7d2ab36aa1dfa2", "title": "A Comprehensive Beam-Level Assessment of Pencil-Beam Scanning Migration and Utilization at a Multi-System Proton Therapy Center.", "date": "2026-10-25", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "A Comprehensive Beam-Level Assessment of Pencil-Beam Scanning Migration and Utilization at a Multi-System Proton Therapy Center.", "publisher": "International journal of particle therapy", "published_at": "2026-10-06T00:00:00Z", "date_precision": null, "summary": "PURPOSE: To provide a beam-level comparison of pencil-beam scanning (PBS) proton therapy at a high-volume center operating both the ProteusPLUS (P-PLUS) and ProteusONE (P-ONE) platforms and to evaluate how system capabilities influenced room utilization during a multi-year transition to PBS.\nMETHODS AND MATERIALS: Log files were analyzed for three rooms: P-PLUS Gantry Room 2 (GTR2; 2018-2024), P-PLUS Gantry Room 1 (GTR1; mid-2023-2024), and P-ONE Compact Gantry Room (CGTR; 2020-2024). A script was written to extract beam parameters while clinical and demographic information were obtained from the MOSAIQ database. Data streams were merged, then grouped and analyzed by site, age, and temporal factors.\nRESULTS: The final dataset included 120,367 beams for the P-PLUS and 95,587 for the P-ONE. During an 18-month comparative period, mean throughput was 27.4 ± 5.4 patients/day (GTR2), 22.9 ± 5.1 (GTR1), and 27.0 ± 4.6 (CGTR), with mean session times of 28.2 ± 2.5, 25.6 ± 1.7, and 26.9 ± 2.4 minutes, respectively. Case allocation reflected platform/nozzle differences: GTR2 primarily treated prostate, breast, and thorax/abdomen targets, while GTR1 and CGTR focused on prostate, head-and-neck, brain, and CNS cases. CGTR treated more pediatric patients (25.2% vs 7.1% in GTR2 and 5.8% in GTR1) and cases involving anesthesia. Maximum cyclotron energy was used more on GTR2 compared to CGTR (7.5% vs 0.4%), while range-shifter use was similar (71.1% vs 67.0%); couch flips occurred in 77% of P-ONE treatments.\nCONCLUSIONS: Expanding PBS capacity substantially shifted room utilization and case mix, driven mainly by differences in spot and field size, and secondarily by imaging, layer-switching, and pediatric-oriented room features. The P-ONE's smaller field size did not materially constrain prostate treatment with involved lymph nodes, frequent couch flips did not inhibit high operational capacity, and the P-ONE's lower minimum energy reduced range-shifter reliance and the need for maximum cyclotron energy. This real-world analysis provides guidance for case selection, workflow optimization, and future proton system design.", "access_scope": "abstract", "pmid": "42904178", "doi": "10.1016/j.ijpt.2026.101969", "url": "https://pubmed.ncbi.nlm.nih.gov/42904178/"}], "drafts": [{"platform": "facebook", "text": "大家身邊可能也有親友曾面臨放射治療的安排，在醫療技術不斷進步的時代，質子治療的設備與運作方式也持續被深入探討與優化。近期有一項針對質子治療系統（如筆形光束掃描技術，PBS）的實務分析研究，探討了不同設備規格與治療室利用率的實際表現。這類研究有助於了解醫療團隊如何依據系統特性來安排不同病房的運用與案例分配。✨ 在這項分析中，研究團隊回顧了多個治療室的日均病患數與療程時間等數據。結果發現，不同平台的設備特性（例如照射野大小、能量設定等）會影響病例分配的偏好，例如某些緊湊型系統在兒童病患或特定部位的治療上展現了不同的應用方式。這也提醒我們，醫療設備的多元設計能為臨床團隊在排程與個案選擇上提供更多彈性與參考依據。💡 面對醫療科技的發展，你是否也好奇這些精密設備是如何在日常運作中幫助醫療團隊提升效率的呢？歡迎留言分享你的看法或想法！\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42904178/"}, {"platform": "instagram", "text": "醫療科技持續進步，質子治療設備的運作細節與室內利用率是如何安排的呢？近期一項針對質子治療系統（PBS）的分析研究，帶我們一窺大型醫療中心在系統轉換期間的實際運作情況！🔬 📍 根據研究分析重點：🔍 透過分析不同治療室的紀錄與數據，探討了日均治療人數與療程時間的表現。🔍 發現設備的規格差異會影響病例的分配，例如不同系統在處理攝護腺、頭頸部或兒童病患時各有其適用的配置。🔍 設備的能量設定與調整機制，也讓臨床團隊在面對不同治療需求時能有更彈性的運用。這類實際運作的數據分析，能為未來的設備設計與臨床流程優化提供寶貴的參考方向。💬 你對於現代放射治療技術有什麼了解或疑問嗎？歡迎留言跟我們討論！\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42904178/"}, {"platform": "threads", "text": "大家對放射治療中的質子治療設備了解多少呢？近期有一項關於質子治療系統（PBS）的實務分析，探討了不同設備在醫療中心實際運作中的表現與病例分配情況。研究指出，設備的特性與能量設定會影響不同治療室的運用與排程，為臨床工作流程提供了很好的參考依據。🏥 你身邊也有人在關注這類醫療科技的發展嗎？歡迎留言分享你的想法！\n\n🔎 研究閱讀提醒：本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42904178/"}]}, {"id": "n2s-3fc9f7620a1c10cc185b", "title": "FMOD marks a low-malignancy epithelial state in prostate cancer: an ECM-related prognostic signature with single-cell and functional validation.", "date": "2026-10-25", "status": "pending_review", "warning": "", "revision": 1, "sources": [{"title": "FMOD marks a low-malignancy epithelial state in prostate cancer: an ECM-related prognostic signature with single-cell and functional validation.", "publisher": "Cell adhesion \u0026 migration", "published_at": "2026-10-21T00:00:00Z", "date_precision": null, "summary": "Extracellular matrix (ECM) remodeling promotes prostate cancer progression, while the prognostic value and cellular context of ECM-related genes (ERGs) remain unclear. A 4-gene ERG signature for disease-free interval prediction was built using TCGA-PRAD data, and the hub gene Fibromodulin (FMOD) was validated in an external cohort via scRNA-seq, bulk deconvolution and siRNA knockdown. The signature stratified patient prognosis, and FMOD exerted the strongest protective effect. Despite higher bulk expression in tumor tissues, FMOD predicted better clinical outcomes. FMOD was enriched in a low-chromosomal-instability, low-proliferation epithelial subpopulation with enhanced stromal-immune crosstalk, and FMOD knockdown boosted cancer cell proliferation and colony formation. FMOD identifies a low-malignancy epithelial state linked to favorable prostate cancer prognosis, supporting cell state-resolved validation of ECM-related prognostic biomarkers.", "access_scope": "abstract", "pmid": "42904786", "doi": "10.1080/19336918.2026.2728740", "url": "https://pubmed.ncbi.nlm.nih.gov/42904786/"}], "drafts": [{"platform": "facebook", "text": "大家平時會關注攝護腺健康的相關研究嗎？近年科學界對於攝護腺癌的發展機制有更多深入探討，特別是細胞外基質的重塑過程。這篇研究探討了細胞外基質相關基因在攝護腺癌中的預後價值，並利用資料庫與實驗進行驗證。🔍 研究發現亮點：\n\n• 建立預後模型：透過基因數據分析，建立了預測無病間隔的 4 基因簽章，有助於區分患者的預後差異。\n• 關鍵基因 Fibromodulin (FMOD)：在研究中展現出明顯的保護作用，雖然在腫瘤組織中的整體表現量較高，但卻能預測較佳的臨床結果。\n• 細胞狀態解析：FMOD 豐富存在於染色體不穩定性低、增殖緩慢的上皮細胞亞群中，並與間質免疫交錯有關。\n• 實驗驗證影響：當進行 FMOD 抑制時，會促進癌細胞的增殖與群落形成。\n\n這項研究指出 FMOD 有助於辨識低惡性度的上皮細胞狀態，並與良好的預後相關。不過這屬於基礎細胞與基因層面的研究，實際應用於臨床治療仍需更多科學證據。大家對於解讀這類基因與癌症預後的科學新知有什麼看法呢？歡迎留言分享你的想法！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42904786/"}, {"platform": "instagram", "text": "你有想過細胞周圍的結構如何影響攝護腺健康嗎？🔬 最近一項發表於科學研究的成果，聚焦在細胞外基質相關基因與攝護腺癌進展的關聯，帶大家來看看重點摘要：\n\n📋 研究重要發現：\n• 4 基因預後模型：利用資料庫數據建構出能區分患者預後狀況的基因簽章。\n• 核心基因 FMOD：研究指出 Fibromodulin 具有顯著的保護作用，雖然在腫瘤組織中整體表現較高，卻反而預期較佳的臨床預後。\n• 低惡性細胞狀態：FMOD 主要富含於染色體穩定度高、增殖慢的上皮細胞群中，並與間質免疫互動有關。\n• 實驗觀察：當 FMOD 受到抑制時，會助長癌細胞的增殖與生長能力。\n\n這項研究透過單細胞定序與實驗驗證，顯示 FMOD 可作為辨識低惡性度細胞狀態的指標。不過這仍是基礎科學研究，距離臨床應用還有一段距離。追蹤我們，一起用輕鬆的方式看懂最新的醫療與科學資訊！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42904786/"}, {"platform": "threads", "text": "平時看到關於攝護腺健康的科學研究，大家都會怎麼解讀呢？🤔 最近有一篇研究探討了攝護腺癌中細胞外基質相關基因的角色，發現核心基因 FMOD 在預測預後上扮演了有趣的角色。研究指出，FMOD 雖然在腫瘤組織中表現較高，但卻與較佳的臨床結果相關，並能辨識出低增殖、低惡性度的上皮細胞狀態。雖然這有助於未來預後生物標記的發展，但仍屬於基礎研究階段。你對這類癌症基因研究有什麼好奇的地方嗎？留言跟我們交流一下吧！\n\n🔎 研究閱讀提醒：相關性不等於因果，也不代表預防或治療效果。本文僅依摘要整理，未核對全文；不取代個別醫療評估。\n\n資料來源：https://pubmed.ncbi.nlm.nih.gov/42904786/"}]}, {"id": "n2s-bc376251b6759a69a58f", "title": "一夜4次確診攝護腺肥大醫自救成功年過50沒再夜尿- 健康 - 中時新聞網", "date": "2026-10-25", "status": "collected", "warning": "", "revision": 1, "sources": [{"title": "一夜4次確診攝護腺肥大醫自救成功年過50沒再夜尿- 健康 - 中時新聞網", "publisher": "中時新聞網", "published_at": "2026-10-24T02:31:03Z", "date_precision": null, "summary": "",
